openapi: 3.0.3
info:
  title: OnScreen API
  version: "2.6.1"
  description: |
    HTTP API for the OnScreen media server.

    **API stability** — the v2.2.0 freeze was lifted after v2.3.0. A
    v2.x release adds endpoints, fields and capability flags; a breaking
    change ships only together with updated first-party clients (v2.4
    narrowed `?token=` to purpose-scoped tokens this way). See
    [docs/server-lock.md](../server-lock.md).

    All JSON responses use a uniform envelope:
      - Success: `{ "data": <payload> }`
      - List:    `{ "data": [...], "meta": { "total": <int>, "cursor": "<string>" } }`
      - Error:   `{ "error": { "code": "<UPPER_SNAKE>", "message": "...", "request_id": "..." } }`

    The HLS playlist and segment endpoints under `/api/v1/transcode/sessions/{sid}/`
    are an intentional exception: HLS players cannot consume JSON errors, so those
    paths return raw `text/plain` errors with appropriate HTTP status codes.

    Auth is delivered as either a Paseto v4 bearer token (`Authorization: Bearer ...`)
    or the `onscreen_at` httpOnly cookie set by `/auth/login`. Browser clients use the
    cookie; native and third-party clients use the bearer header. Asset routes
    (artwork, media stream, subtitles, downloads) additionally accept a
    `?token=` query-string token so renderers that can't carry an
    Authorization header (mobile webview, browser `<img>` / `<video>`) still
    authenticate. Since v2.4 that token must be a purpose-scoped one: the
    `asset_token` returned by login and refresh, or a file's `stream_token`.
    An access token in the query string is refused.

    **Personal API keys** (v2.6) are long-lived credentials for scripts and
    integrations: `Authorization: Bearer osk_…` or `X-Api-Key: osk_…`, never
    in a query string. A key acts as its user with that user's current
    library access, rating ceiling and label restriction; a `read_only` key
    may only make GET/HEAD requests (403 `API_KEY_READ_ONLY` otherwise).
    Keys are refused with 403 `API_KEY_NOT_ALLOWED` on sign-in, refresh,
    2FA, PIN, profile, signed-in device and API key management, device
    pairing, user administration, invites, server settings, backups and
    account data export. The `/opds/` catalog also takes a key as the
    password of HTTP Basic (and nowhere else accepts Basic). See
    [docs/api/api-keys.md](api-keys.md).
  license:
    name: AGPL-3.0
servers:
  - url: http://localhost:7070
    description: Local development server (default OnScreen API port)
  - url: https://onscreen.example.com
    description: Production deployment (replace with your origin)

security:
  - bearerAuth: []
  - cookieAuth: []
  - apiKeyHeader: []

tags:
  - name: Auth
    description: Login, registration, password recovery, OIDC and LDAP SSO.
  - name: Pairing
    description: Native client device pairing via short-lived PIN.
  - name: System
    description: Capabilities discovery and setup status.
  - name: Libraries
    description: Library CRUD plus item browsing inside a library.
  - name: Items
    description: Per-item metadata, playback progress, markers, EXIF, enrichment.
  - name: Music
    description: Music discovery — similar artists, an artist's "Appears on", instant mixes.
  - name: Search
    description: Full-text search across media items.
  - name: Hub
    description: Home-page rails (continue watching, recently added).
  - name: History
    description: Per-user watch history.
  - name: Favorites
    description: Per-user favorited items.
  - name: Watchlist
    description: The caller's watching statuses (Plan to Watch, Watching, …) as a list.
  - name: Collections
    description: Curated, server-wide collections.
  - name: Playlists
    description: User-owned ordered playlists.
  - name: People
    description: Cast and crew.
  - name: Studios
    description: Studios (production companies) and TV networks, and the titles they made.
  - name: Subtitles
    description: External subtitle search, download, and OCR.
  - name: Trickplay
    description: Seekbar thumbnail previews and chapter thumbnails.
  - name: Downloads
    description: Converted (lower-quality) downloads — per-user jobs over a shared encode cache.
  - name: Optimize
    description: Optimized versions (admin) — pre-made MP4 copies players direct-play instead of a live transcode.
  - name: Transcode
    description: HLS transcode sessions (start, stop, segments).
  - name: Notifications
    description: User notifications (list, mark read, SSE stream).
  - name: Sessions
    description: Active playback sessions.
  - name: Users
    description: User profile, PIN management, managed profiles, admin user management.
  - name: Settings
    description: Server-wide settings (admin only).
  - name: OPDS
    description: |
      OPDS 1.2 catalog of book libraries for e-reader apps, under `/opds/`
      (not `/api/v1`). Atom XML. HTTP Basic with a personal API key as the
      password (never the account password), or any credential the API
      takes. GET only. While downloads are disabled server-wide every route
      answers 403 `DOWNLOADS_DISABLED`. See [docs/opds.md](../opds.md). v2.6.
  - name: Audiobooks
    description: Per-user listening speed and bookmarks for audiobooks.
  - name: Scrobbling
    description: Per-user ListenBrainz / Last.fm / Trakt links. Plays are exported server-side, so one link covers every client.
  - name: Webhooks
    description: |
      Outbound webhooks (admin only).

      **Signing (when a `secret` was configured on the endpoint):** every
      delivery carries two headers — `X-OnScreen-Timestamp: <unix-seconds>`
      and `X-OnScreen-Signature: sha256=<hex(HMAC(secret, "{ts}.{body}"))>`.
      Stripe-shaped: the timestamp is part of the signed input, so an
      attacker can't change `X-OnScreen-Timestamp` without invalidating
      the MAC. Receivers MUST (1) reject timestamps outside a small drift
      window (±5 minutes is typical) to defeat replay of a captured
      request, and (2) recompute the HMAC over `{header_ts}.{request_body}`
      and compare with constant-time equality.

      **SSRF protection:** the outbound HTTP client refuses connections
      to private, loopback, link-local, multicast, and unspecified IP
      addresses post-resolution, and `CheckRedirect` returns
      `ErrUseLastResponse` so a 3xx to a different host can't be used to
      leak the signed POST body.

      **Audit:** create / update / delete on a webhook endpoint emit
      `webhook.create` / `webhook.update` / `webhook.delete` rows in the
      audit log. The detail field carries the URL host (not the full
      URL — keeps path tokens out of the audit trail), the events list,
      and a `has_secret` / `secret_changed` flag.
  - name: Maintenance
    description: One-shot admin operations (artwork backfill, dedupe).
  - name: Podcasts
    description: |
      Podcast RSS subscriptions (admin only). A podcast library subscribes
      to a feed; the server re-reads it hourly (the `podcast_refresh` task)
      and downloads episodes into `<library folder>/<feed title>/`, where the
      scanner makes them ordinary `podcast` / `podcast_episode` items named
      from the feed. Clients play them like any other file. Feed and episode
      fetches refuse private and loopback addresses.
  - name: Imports
    description: |
      Import from a Plex, Jellyfin or Emby server (admin only): each mapped
      user's watched state, resume points, ratings, favorites, playlists and
      play history. Connect to list the server's accounts, start a run (or a
      `dry_run` preview that matches without writing) and poll it. Items are
      matched by file path, shows by their folder, then by TMDB / TVDB / IMDb
      ID. What a user already did on OnScreen is kept, and a re-run writes
      only what's new. The token is used for the run and never stored. The
      server URL may be on the LAN or loopback; link-local is refused.
  - name: Notifications
    description: |
      Outbound notification agents (admin only): Discord webhooks, Telegram
      bots, ntfy topics, Gotify servers and email lists that hear about
      requests, problem reports, new content (batched — one message per
      batch) and ops failures (scheduled task / backup failures, no transcode
      worker). One message per event per agent, never one per user.

      **Secrets** (the Discord webhook URL, bot / app / access tokens) are
      encrypted at rest and write-only; changing an ntfy / Gotify server URL
      requires re-entering the token.

      **SSRF protection:** deliveries dial through the same post-resolution
      guard as webhooks (no private, loopback, link-local, CGNAT or multicast
      targets; redirects are not followed). `allow_private_network` opts a
      self-hosted ntfy / Gotify into the LAN; Discord and Telegram never.
  - name: Plugins
    description: Outbound MCP plugin registrations (admin only).
  - name: Backup
    description: Backup download and restore (admin only).
  - name: Tasks
    description: Scheduled task CRUD plus run history (admin only).
  - name: Audit
    description: Audit log (admin only).
  - name: Analytics
    description: Usage analytics (admin only).
  - name: Invites
    description: Invitation creation and acceptance.
  - name: Email
    description: SMTP test (admin only).
  - name: Arr
    description: Sonarr/Radarr webhook ingestion.
  - name: ArrServices
    description: Multi-instance Radarr/Sonarr configuration (admin only).
  - name: Discover
    description: TMDB-backed search for the request workflow.
  - name: Requests
    description: Media request workflow (user submit, admin approve/decline).
  - name: DVR
    description: DVR recordings post-processing and commercial detection.

paths:
  # ── Health ─────────────────────────────────────────────────────────────────
  /health/live:
    get:
      summary: Liveness probe
      description: Returns 200 with `{"status":"ok"}` if the process is up.
      tags: [System]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }

  # ── System ─────────────────────────────────────────────────────────────────
  /api/v1/setup/status:
    get:
      summary: Initial setup status
      tags: [System]
      security: []
      responses:
        '200':
          description: Whether first-run setup has been completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatusEnvelope'

  /api/v1/system/capabilities:
    get:
      summary: Server capabilities
      description: Server build, enabled features, and operational limits.
      tags: [System]
      security: []
      responses:
        '200':
          description: Capabilities snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesEnvelope'

  /api/v1/email/enabled:
    get:
      summary: Email-feature visibility flag
      tags: [System]
      security: []
      responses:
        '200': { $ref: '#/components/responses/BoolEnabled' }

  /api/v1/auth/forgot-password/enabled:
    get:
      summary: Password-reset feature visibility flag
      tags: [System]
      security: []
      responses:
        '200': { $ref: '#/components/responses/BoolEnabled' }

  /api/v1/auth/oidc/enabled:
    get:
      summary: OIDC SSO visibility flag
      tags: [System]
      security: []
      responses:
        '200': { $ref: '#/components/responses/BoolEnabled' }

  /api/v1/auth/ldap/enabled:
    get:
      summary: LDAP login visibility flag
      tags: [System]
      security: []
      responses:
        '200': { $ref: '#/components/responses/BoolEnabled' }

  # ── Auth ───────────────────────────────────────────────────────────────────
  /api/v1/auth/login:
    post:
      summary: Local username/password login
      description: |
        Two layered rate limits:
          - **Per-IP** (chi `httprate`): cap on calls from one source IP
            inside a sliding window — defeats single-host brute force.
          - **Per-username** (Valkey, failure-only counter): caps total
            *failed* logins across all source IPs against one username
            inside the same window — defeats credential stuffing from
            CGNAT pools or botnets where per-IP wouldn't bite. The cap
            counts failures only, so a power-user who logs in 10× in a
            day legitimately won't lock themselves out. Counter clears
            on a successful login. The Valkey key is keyed on a
            HMAC-SHA256 of the lowercased attempted username with
            `SECRET_KEY` as pepper, so the keyspace can't be scanned for
            real usernames.

        Both bcrypt-compare (real password) and a dummy bcrypt-compare
        (user-not-found, federated-only user) run at cost 12 so login
        latency doesn't reveal which case applied.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: Token pair plus user metadata. Sets `onscreen_at` and `onscreen_rt` cookies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: |
            Bad credentials, or the per-username failure cap was reached.
            Both paths return the same generic envelope so the response
            doesn't reveal which one fired.

  /api/v1/auth/refresh:
    post:
      summary: Refresh access token
      description: Reads refresh token from JSON body (`refresh_token`) or `onscreen_rt` cookie.
      tags: [Auth]
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: New token pair.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairEnvelope'
        '401':
          description: |
            The refresh token is invalid — unknown, expired, or already spent
            (reuse, which also signs the user out on every device unless the
            token was spent less than 2 minutes earlier). Auth cookies are
            cleared; the client should discard its tokens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: |
            The server could not check the token (e.g. the database is
            unreachable). Not a verdict on it: cookies are left alone and the
            client should keep its tokens and retry later.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/auth/logout:
    post:
      summary: Revoke the current refresh token
      tags: [Auth]
      security: []
      responses:
        '204':
          description: Logged out. Clears `onscreen_at` and `onscreen_rt` cookies.

  /api/v1/auth/register:
    post:
      summary: Register a new user
      description: |
        First call (no users yet) creates the initial admin and is unauthenticated.
        Subsequent calls require an admin caller; the new account is non-admin.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, pattern: '^[a-zA-Z0-9_]{2,32}$' }
                email:    { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UserInfo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/auth/forgot-password:
    post:
      summary: Request a password reset email
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: |
            Always 200 with a generic message envelope. The response is
            identical whether the address exists, doesn't exist, or SMTP
            is disabled — closing the enumeration / SMTP-state differential
            an attacker would otherwise probe with timing or status-code
            comparison.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message: { type: string, example: 'If an account with that email exists, a password reset link has been sent.' }

  /api/v1/auth/reset-password:
    post:
      summary: Complete a password reset
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:    { type: string }
                password: { type: string, format: password, minLength: 12 }
      responses:
        '200':
          description: Password reset. New password is enforced at 12-char minimum and the token is single-use (claimed atomically before the password write — a second concurrent submit of the same token loses the race and gets 400 Invalid).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message: { type: string, example: 'Password has been reset. You can now sign in.' }
        '400':
          description: |
            Token invalid, expired, already used, or password fails the
            12-char floor. Body shape matches the standard error envelope
            (see `#/components/responses/BadRequest`).

  /api/v1/auth/oidc:
    get:
      summary: Begin OIDC SSO flow
      description: 302 redirect to the configured IdP authorization endpoint.
      tags: [Auth]
      security: []
      responses:
        '302': { description: Redirect to IdP. }

  /api/v1/auth/oidc/callback:
    get:
      summary: OIDC callback
      description: Exchanges the authorization code, issues tokens, and 302s to the SPA.
      tags: [Auth]
      security: []
      parameters:
        - { in: query, name: code,  required: true, schema: { type: string } }
        - { in: query, name: state, required: true, schema: { type: string } }
      responses:
        '302': { description: Redirect after successful login. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/ldap/login:
    post:
      summary: LDAP bind login
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: Token pair (LDAP-backed account).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/pin-switch:
    post:
      summary: Switch to another local user via PIN
      description: |
        Verifies the target user's PIN and returns a token pair for them.
        Brute-force protected: failures are locked out per target (5 per
        15 min) and the route is additionally rate-limited per session.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, pin]
              properties:
                user_id: { type: string, format: uuid }
                pin:     { type: string, minLength: 4, maxLength: 8 }
      responses:
        '200':
          description: Token pair for the target user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairEnvelope'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: |
            Too many failed PIN attempts for this target (locked out for
            ~15 min) or the per-session rate limit was hit. Body carries
            `code: RATE_LIMITED`; `Retry-After` is set.

  # ── Pairing ────────────────────────────────────────────────────────────────
  /api/v1/auth/pair/code:
    post:
      summary: Create a pairing PIN
      description: |
        Issued to a native client. Returns a 6-digit PIN to display to the user
        plus a `device_token` the client uses to poll. PIN expires in 10 minutes.
      tags: [Pairing]
      security: []
      responses:
        '200':
          description: New pairing record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PairCodeResponse'

  /api/v1/auth/pair/poll:
    get:
      summary: Poll for pairing completion
      tags: [Pairing]
      security: []
      parameters:
        - { in: query, name: device_token, required: true, schema: { type: string } }
      responses:
        '200':
          description: Pending or claimed status; on `claimed` includes a token pair.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PairPollResponse'
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/auth/pair/claim:
    post:
      summary: Claim a pairing PIN (browser-side)
      description: Binds a displayed PIN to the authenticated user, releasing tokens to the waiting device.
      tags: [Pairing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties:
                pin:         { type: string, minLength: 6, maxLength: 6 }
                device_name: { type: string }
      responses:
        '204': { description: Claimed. The polling device now has tokens. }
        '404': { $ref: '#/components/responses/NotFound' }
        '429':
          description: 'Per-session rate limit hit while claiming PIN codes. Body carries `code: RATE_LIMITED`.'

  # ── Libraries ──────────────────────────────────────────────────────────────
  /api/v1/libraries:
    get:
      summary: List libraries the caller can access
      tags: [Libraries]
      responses:
        '200':
          description: Library list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryListEnvelope'
    post:
      summary: Create a library (admin)
      tags: [Libraries]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Library' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/libraries/{id}:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: Get a single library
      tags: [Libraries]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Library' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update a library (admin)
      tags: [Libraries]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LibraryUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Library' }
    delete:
      summary: Delete a library (admin)
      tags: [Libraries]
      responses:
        '204': { description: Deleted. }

  /api/v1/libraries/{id}/items:
    parameters:
      - { $ref: '#/components/parameters/UUID' }
      - { $ref: '#/components/parameters/Limit' }
      - { $ref: '#/components/parameters/Offset' }
      - { in: query, name: q,        schema: { type: string }, description: 'Title contains substring.' }
      - { in: query, name: genre,    schema: { type: string }, description: 'Filter by genre name.' }
      - { in: query, name: year_min, schema: { type: integer } }
      - { in: query, name: year_max, schema: { type: integer } }
      - { in: query, name: rating_min, schema: { type: number, format: float } }
      - in: query
        name: sort
        schema: { type: string, enum: [title, year, rating, created_at, taken_at, artist] }
        description: |
          `artist` orders by the parent item's title — the artist, for
          albums and music videos listed via `type` — then oldest first
          within each artist.
      - in: query
        name: sort_dir
        schema: { type: string, enum: [asc, desc] }
        description: Defaults to `desc` for year, rating, created_at and taken_at; `asc` otherwise.
      - in: query
        name: type
        schema: { type: string }
        description: |
          List another level of the library's hierarchy instead of its
          top-level items, validated per library type (400 otherwise) —
          e.g. `album` for every album in a music library, across artists.
      - $ref: '#/components/parameters/WatchFilter'
    get:
      summary: List items in a library
      description: |
        Each item carries the caller's watch state: `watch_state` /
        `view_offset_ms` on playable videos (movie, episode, music video,
        home video), `leaf_count` / `unwatched_count` on shows and seasons
        (episodes within the caller's content-rating ceiling). `watch=`
        filters in SQL, so paging, sort and `meta.total` stay consistent.
        Rows below the top level (listed via `type`) also carry
        `parent_id` / `parent_title` — an album's artist.
      tags: [Libraries]
      responses:
        '200':
          description: Filtered list of media items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItemListEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/libraries/{id}/random:
    parameters:
      - { $ref: '#/components/parameters/UUID' }
      - { in: query, name: genre,    schema: { type: string } }
      - { in: query, name: year_min, schema: { type: integer } }
      - { in: query, name: year_max, schema: { type: integer } }
      - { in: query, name: rating_min, schema: { type: number, format: float } }
      - { in: query, name: type, schema: { type: string }, description: 'Item type within the library (validated per library type, as on /items).' }
      - $ref: '#/components/parameters/WatchFilter'
    get:
      summary: Pick one random item ("Surprise me")
      description: |
        One random item the caller can see, under the same filters as
        GET /libraries/{id}/items (library access and content-rating
        ceiling included). 404 when nothing matches or the library is
        not visible to the caller.
      tags: [Libraries]
      responses:
        '200':
          description: The picked item.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:   { type: string, format: uuid }
                      type: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/libraries/{id}/genres:
    parameters:
      - { $ref: '#/components/parameters/UUID' }
      - in: query
        name: type
        schema: { type: string }
        description: |
          Item type to count, validated as on /items (400 otherwise).
          Defaults to the library's top-level type. A music library's
          genres are on its albums (`type=album`); its artists carry none.
    get:
      summary: List distinct genres in a library
      tags: [Libraries]
      responses:
        '200':
          description: Genre counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/GenreCount' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/libraries/{id}/years:
    parameters:
      - { $ref: '#/components/parameters/UUID' }
      - in: query
        name: type
        schema: { type: string }
        description: Item type to count, as on /genres (`type=album` for a music library).
    get:
      summary: List distinct years in a library
      tags: [Libraries]
      responses:
        '200':
          description: Year counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/YearCount' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/libraries/{id}/scan:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    post:
      summary: Trigger a library scan (admin)
      tags: [Libraries]
      responses:
        '202': { description: Scan enqueued. }

  /api/v1/libraries/{id}/detect-intros:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    post:
      summary: Trigger intro detection across the library (admin)
      tags: [Libraries]
      responses:
        '202': { description: Detection enqueued. }

  /api/v1/libraries/{id}/trickplay/generate:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    post:
      summary: Queue seek-bar thumbnail generation for a library (admin)
      description: |
        Queues every video item in the library that has no trickplay sprites
        yet on the server's single background generation worker (one ffmpeg
        job at a time, paused while a transcode is running) and returns
        immediately. Idempotent — items already queued or generating are not
        added twice. Works whether or not the library's `trickplay_enabled`
        toggle is on (an explicit request). Items whose last attempt failed
        are skipped unless `include_failed=true`. Audited as
        `library.trickplay_generate`.
      tags: [Libraries, Trickplay]
      parameters:
        - { in: query, name: include_failed, schema: { type: boolean, default: false } }
      responses:
        '202':
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string, enum: [queued] }
                      queued: { type: integer, description: 'Items newly added to the queue by this call.' }
        '403': { description: Not an admin. }
        '404': { description: Unknown library, or trickplay generation not available on this server. }

  /api/v1/libraries/{id}/trickplay/status:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: Seek-bar thumbnail progress for a library (admin)
      tags: [Libraries, Trickplay]
      responses:
        '200':
          description: Counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TrickplayLibraryStatus' }
        '403': { description: Not an admin. }
        '404': { description: Unknown library, or trickplay generation not available on this server. }

  # ── Search ─────────────────────────────────────────────────────────────────
  /api/v1/search:
    get:
      summary: Full-text item search
      tags: [Search]
      parameters:
        - { in: query, name: q, required: true, schema: { type: string } }
        - { in: query, name: library_id, schema: { type: string, format: uuid } }
        - { in: query, name: limit, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: Search results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SearchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ── Hub ────────────────────────────────────────────────────────────────────
  /api/v1/hub:
    get:
      summary: Home-page rails
      description: Continue watching, recently added, and on-deck rails for the current user.
      tags: [Hub]
      responses:
        '200':
          description: Hub data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Hub' }

  # ── History ────────────────────────────────────────────────────────────────
  /api/v1/history:
    get:
      summary: Watch history
      tags: [History]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: History entries (newest first).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/WatchHistoryItem' }

  # ── Music discovery ────────────────────────────────────────────────────────
  /api/v1/music/artists/{id}/similar:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: Artists similar to an artist
      description: |
        Artists from the same library, ranked by co-listening (people who
        play one play the other, from the nightly item co-occurrence table,
        aggregated to artists and normalised by track counts) blended with
        shared genres. With no listening history, genre overlap ranks alone
        with era as a tie-breaker; an artist with no genres falls back to
        artists of its era. Library access, the content-rating ceiling and
        label restrictions apply to the artist asked about (404 / 403) and to
        every suggestion. Additive (v2.6).
      tags: [Music]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Similar artists, best first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SimilarArtist' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/music/artists/{id}/appears-on:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: Tracks an artist appears on
      description: |
        Tracks on other artists' albums this artist is credited on: featured
        artists (a "feat." clause or a multi-valued ARTISTS tag), and the
        performer of a compilation track. Newest album first, tracks in album
        order. Each track passes the content-rating ceiling and label
        restrictions (a label on its album or album artist hides it).
        Additive (v2.6).
      tags: [Music]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: Appearances.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ArtistAppearance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/music/mix:
    get:
      summary: Instant mix from a track, album or artist
      description: |
        An ordered list of about `limit` tracks to play: the seed's own
        tracks first (a seed track leads), then tracks by similar artists
        (most similar first in each round), then tracks sharing the seed
        artist's genres. Tracks by one artist are spaced apart while other
        artists remain; tracks the caller rated 2 or lower (one star) are
        left out, except a seed track; every call is shuffled afresh. Each
        entry carries the file to stream and its ReplayGain values, so it
        can go straight into a player queue. Library access, the
        content-rating ceiling and label restrictions apply to the seed and
        to every track. Additive (v2.6).
      tags: [Music]
      parameters:
        - in: query
          name: seed
          required: true
          schema: { type: string, format: uuid }
          description: A track, album or artist id.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: The mix, in play order.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/MixTrack' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Favorites ──────────────────────────────────────────────────────────────
  /api/v1/favorites:
    get:
      summary: List favorited items
      tags: [Favorites]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Favorites.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/FavoriteItem' }

  /api/v1/items/{id}/favorite:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    post:
      summary: Add an item to favorites
      tags: [Favorites]
      responses:
        '204': { description: Added. }
        '404':
          description: |
            Item not found, or in a library the caller can't access / above
            their content-rating ceiling (obfuscated as not-found) — the same
            access gate the favorites list applies on reads.
    delete:
      summary: Remove an item from favorites
      tags: [Favorites]
      responses:
        '204': { description: Removed. }

  /api/v1/watchlist:
    get:
      summary: List the caller's watching statuses
      description: |
        The caller's own Plan to Watch / Watching / On Hold / Completed /
        Dropped rows (set with `PUT /api/v1/items/{id}/watch-status`), as
        cards. Scoped like every item list: only libraries the caller can
        access, at or under their content-rating ceiling, permitted by their
        label restriction, and never a deleted item. A managed profile sees
        only its own rows. `meta.total` counts the same filtered set. v2.6.
      tags: [Watchlist]
      parameters:
        - name: status
          in: query
          description: One status, or `all` for every status.
          schema:
            type: string
            enum: [plan_to_watch, watching, on_hold, completed, dropped, all]
            default: plan_to_watch
        - name: type
          in: query
          description: Only items of this media type.
          schema:
            type: string
            enum: [movie, show, season, episode, track, album, artist, photo, music_video, audiobook, audiobook_chapter, book_author, book_series, podcast, podcast_episode, home_video, book]
        - name: sort
          in: query
          description: |
            `recent` — newest status change first (when the item entered its
            current status); `title` — by sort title.
          schema: { type: string, enum: [recent, title], default: recent }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: One page of the list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/WatchlistItem' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/watchlist/counts:
    get:
      summary: Watchlist counts per status and type
      description: |
        Per-status totals with a per-type breakdown, under the same filters as
        `GET /api/v1/watchlist` — tab badges and the type filter's options.
        `statuses` always has all five keys. v2.6.
      tags: [Watchlist]
      responses:
        '200':
          description: Counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      total: { type: integer, format: int64 }
                      statuses:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            total: { type: integer, format: int64 }
                            types:
                              type: object
                              additionalProperties: { type: integer, format: int64 }
              example:
                data:
                  total: 4
                  statuses:
                    plan_to_watch: { total: 3, types: { movie: 2, show: 1 } }
                    watching: { total: 1, types: { show: 1 } }
                    on_hold: { total: 0, types: {} }
                    completed: { total: 0, types: {} }
                    dropped: { total: 0, types: {} }

  # ── Items ──────────────────────────────────────────────────────────────────
  /api/v1/items/{id}:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: Get a single media item with files and markers
      tags: [Items]
      responses:
        '200':
          description: Item detail.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ItemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Edit item metadata and field locks (admin)
      tags: [Items]
      description: |
        Admin metadata editor for any item type. Each field is "set when
        present"; omitted fields keep their stored value. Unknown fields
        are rejected with HTTP 400 (DisallowUnknownFields) so a misnamed
        key returns a clear error instead of silently being dropped.
        Cast, artwork, tags and provider IDs are not editable here (Fix
        Match, the poster picker).

        **Field locks** *(v2.6)*: every field the body sets is added to
        the item's `locked_fields`, and scans, enrichment, refresh,
        re-enrich and Fix Match leave locked fields as they are (Fix
        Match still changes the provider IDs). A locked title also keeps
        the sort title. `unlock_fields` releases locks; the stored value
        stays until the next refresh rewrites it. Lock names:
        `title`, `sort_title`, `original_title`, `year`,
        `originally_available_at` (sent as `taken_at`), `summary`,
        `tagline`, `rating`, `content_rating`, `genres`.

        Setting `title` also sets the sort title to it, unless the body
        carries `sort_title` or the item has a locked sort title; that
        derived sort title isn't locked itself.

        For home_video and photo items, setting `title` also renames the
        file on disk (sanitized + collision-suffixed) and `taken_at`
        stamps the file's mtime, so user edits travel with the file
        across tools instead of being locked into OnScreen's DB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:    { type: string, maxLength: 500, description: 'Empty string is rejected with 400.' }
                summary:  { type: string, description: 'Empty string clears the summary.' }
                taken_at:
                  type: string
                  description: |
                    The item's date (originally_available_at): a photo's
                    capture date, a home video's recording date, a movie's
                    or episode's release date. RFC3339 timestamp
                    ("2024-04-15T00:00:00Z") or bare YYYY-MM-DD. Empty
                    string clears the date. For home_video items, this
                    also drives the file mtime stamp so external tools
                    sort by recording date rather than scan date.
                sort_title:     { type: string, maxLength: 500, description: '*(v2.6)* Empty string resets the sort title to the title and unlocks it.' }
                original_title: { type: string, maxLength: 500, description: '*(v2.6)* Empty string clears.' }
                tagline:        { type: string, maxLength: 500, description: '*(v2.6)* Empty string clears.' }
                year:           { type: integer, nullable: true, minimum: 1000, maximum: 9999, description: '*(v2.6)* null clears.' }
                rating:         { type: number, nullable: true, minimum: 0, maximum: 10, description: '*(v2.6)* Critic score; null clears.' }
                content_rating:
                  type: string
                  maxLength: 32
                  description: |
                    *(v2.6)* Empty string clears. Free text; a rating the
                    parental ceiling doesn't recognise ranks as most
                    restrictive, like an unrated item.
                genres:
                  type: array
                  maxItems: 50
                  items: { type: string, maxLength: 100 }
                  description: '*(v2.6)* The full list (trimmed, case-insensitive repeats dropped); [] clears.'
                unlock_fields:
                  type: array
                  items: { type: string }
                  description: '*(v2.6)* Lock names to release. A field can''t be edited and unlocked in one request (400).'
      responses:
        '200':
          description: Updated. The edited fields and the resulting lock set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:                      { type: string, format: uuid }
                      title:                   { type: string }
                      summary:                 { type: string, nullable: true }
                      originally_available_at: { type: string, format: date-time, nullable: true }
                      sort_title:              { type: string, description: '*(v2.6)*' }
                      original_title:          { type: string, nullable: true, description: '*(v2.6)*' }
                      tagline:                 { type: string, nullable: true, description: '*(v2.6)*' }
                      year:                    { type: integer, nullable: true, description: '*(v2.6)*' }
                      rating:                  { type: number, nullable: true, description: '*(v2.6)*' }
                      content_rating:          { type: string, nullable: true, description: '*(v2.6)*' }
                      genres:                  { type: array, items: { type: string }, description: '*(v2.6)*' }
                      locked_fields:           { type: array, items: { type: string }, description: '*(v2.6)*' }
        '400':
          description: 'Invalid body, empty title, out-of-range value, unknown field or lock name.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 'Another top-level item of the same type in the library already has this title and year.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/items/bulk:
    patch:
      summary: Edit metadata of many items at once (admin)
      tags: [Items]
      description: |
        *(v2.6)* One edit applied to up to 500 items in a single
        transaction: if any item's write fails, none is changed. Item
        types may be mixed. Unknown fields are rejected with 400.

        - `set.content_rating` applies to movies, shows, episodes, music
          videos, home videos, audiobooks, books and podcasts.
        - `set.genres` (replace) or `add_genres` / `remove_genres` (merge,
          case-insensitive; removes first) apply to movies, shows, albums,
          artists, music videos, audiobooks, books and podcasts. Sending
          `set.genres` with a merge list is a 400. A merge that leaves an
          item's genres as they were doesn't touch (or lock) it.
        - `add_labels` / `remove_labels` work like
          `POST /api/v1/labels/apply` on every item.
        - `lock` / `unlock` add or drop field locks (lock names as for
          `PATCH /api/v1/items/{id}`) without changing values.

        As in the single-item editor, every field written is locked. A
        field an item's type doesn't carry is skipped and reported
        (`not_applicable`), and so is a field the item has locked
        (`locked`) — unless the same request lists it in `unlock`: the
        unlock comes first, the new value is written and locked again. Ids
        without a live item are reported as `not_found`. NFO files of the
        updated items are rewritten in the background in libraries that
        save them. Audited as one `item.bulk_edit` event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_ids]
              properties:
                item_ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: string, format: uuid }
                set:
                  type: object
                  properties:
                    content_rating: { type: string, nullable: true, maxLength: 32, description: 'Empty string or null clears.' }
                    genres:
                      type: array
                      maxItems: 50
                      items: { type: string, maxLength: 100 }
                      description: 'The full list; [] clears.'
                add_genres:    { type: array, maxItems: 50, items: { type: string, maxLength: 100 } }
                remove_genres: { type: array, maxItems: 50, items: { type: string, maxLength: 100 } }
                add_labels:    { type: array, items: { type: string } }
                remove_labels: { type: array, items: { type: string } }
                lock:          { type: array, items: { type: string }, description: 'Lock names to add. Can''t overlap unlock.' }
                unlock:        { type: array, items: { type: string }, description: 'Lock names to drop, applied before the writes.' }
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      matched:        { type: integer, description: 'Live items among item_ids.' }
                      updated:        { type: integer, description: 'Items whose metadata or locks were written.' }
                      labels_added:   { type: integer, description: 'Items the label add changed.' }
                      labels_removed: { type: integer, description: 'Items the label remove changed.' }
                      skipped:
                        type: array
                        items:
                          type: object
                          properties:
                            item_id: { type: string, format: uuid }
                            title:   { type: string }
                            field:   { type: string, description: 'Absent for not_found.' }
                            reason:  { type: string, enum: [locked, not_applicable, not_found] }
        '400':
          description: 'Invalid body: no or too many ids, a duplicate or malformed id, nothing to change, an unknown field or lock name, set.genres with a merge list, a lock name in both lock and unlock.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/items/{id}/children:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: List children (seasons of a show, episodes of a season)
      tags: [Items]
      responses:
        '200':
          description: Children.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ChildItem' }

  /api/v1/items/{id}/progress:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    put:
      summary: Update playback progress
      tags: [Items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [view_offset_ms]
              properties:
                view_offset_ms: { type: integer, format: int64, description: 'Position in the content, ms.' }
                duration_ms:
                  type: integer
                  format: int64
                  description: |
                    Length of the whole content, ms. May be omitted (or 0) when
                    `features.progress_without_duration` is true: the server
                    then fills it from the file being played (`file_id`, else
                    the newest live transcode session's file, else the primary
                    file) or the item. When the version being played is known
                    but has no probed length, the item's runtime is used only
                    if the item has no other active version (the runtime may be
                    another cut's length); otherwise nothing is filled. When
                    nothing is filled, the duration already stored is kept and
                    the report can't mark the item watched.
                file_id:     { type: string, format: uuid, description: 'File (version) being played; only consulted to fill a missing duration_ms.' }
                state:       { type: string, enum: [playing, paused, stopped], description: 'Anything else is recorded as playing.' }
                client_name: { type: string, description: 'Truncated to 64 characters.' }
                decision:    { type: string, enum: [directPlay, directStream, remux, transcode], description: 'Playback decision in use; inferred server-side when omitted.' }
      responses:
        '204': { description: Recorded. }

  /api/v1/items/{id}/enrich:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    post:
      summary: Re-run metadata enrichment (TMDB/TVDB)
      tags: [Items]
      responses:
        '202': { description: Enqueued. }

  /api/v1/items/{id}/episode-order:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    put:
      summary: Set a show's episode order (admin)
      description: |
        v2.6. Picks the order a show's episode files are numbered in, overriding
        the library's `episode_order`: `aired` (the provider's broadcast order),
        `dvd` or `absolute`. `null` (or an empty string) clears the show's own
        order so it follows the library again. When the order changes the show
        is re-enriched in the background (children forced), so its episodes take
        their titles, summaries and stills from the new order: TMDB episode
        groups for a show matched on TMDB, TVDB season types for one matched on
        TVDB. A show whose providers have no such order stays on aired order (a
        warning is logged). Admin only; audit-logged as `item.episode_order`.
      tags: [Items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                episode_order:
                  type: string
                  nullable: true
                  enum: [aired, dvd, absolute, null]
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:            { type: string, format: uuid }
                      episode_order: { type: string, nullable: true, enum: [aired, dvd, absolute, null] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: The item is not a show. }

  /api/v1/items/{id}/match/search:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: Search external metadata sources for a manual match
      tags: [Items]
      parameters:
        - { in: query, name: q, schema: { type: string } }
      responses:
        '200':
          description: Candidate matches.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MatchCandidate' }

  /api/v1/items/{id}/match:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    post:
      summary: Apply a chosen external match
      tags: [Items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tmdb_id]
              properties:
                tmdb_id: { type: integer }
      responses:
        '204': { description: Applied. }

  /api/v1/items/{id}/posters:
    parameters:
      - { $ref: '#/components/parameters/UUID' }
      - { in: query, name: tmdb_id, required: true, schema: { type: integer }, description: 'TMDB id of the show / movie to fetch poster variants for.' }
    get:
      summary: List TMDB poster variants for an item
      description: |
        Returns every poster TMDB has for the supplied show / movie id.
        Powers the admin "Set Poster" tray and the watch-page Choose
        Poster modal. Admin-only — TMDB calls cost the operator's API
        quota.
      tags: [Items]
      responses:
        '200':
          description: Poster candidates.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        url:      { type: string, format: uri }
                        width:    { type: integer }
                        height:   { type: integer }
                        language: { type: string, nullable: true }
                        vote:     { type: number, format: float }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/items/{id}/poster:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    post:
      summary: Apply a poster URL to an item
      description: |
        Downloads the supplied URL and writes it next to the item's
        media files, then updates `poster_path`. URL must point at a
        direct image (jpg / png / webp). Page URLs (IMDB mediaviewer,
        Wikipedia file pages) are rejected with 400 + the upstream HTTP
        status. Admin-only.
      tags: [Items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                  description: 'Direct image URL (jpg/png/webp). Stream tokens, query strings allowed.'
      responses:
        '204': { description: Applied. }
        '400':
          description: |
            Bad URL. Returned with `code = DOWNLOADS_DISABLED` when the
            admin toggle is off, or with the upstream HTTP status in
            the message when the URL didn't return an image.
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/items/{id}/watch-status:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: Per-(user, item) watching-status mirror
      description: |
        Plan to Watch / Watching / Completed / On Hold / Dropped — a
        generic feature, not anime-only. Distinct from playback
        progress; this records the user's explicit classification
        ("I want to watch this later", "I gave up").

        Always returns 200. When the user has no recorded status for
        the item, `data.status` is the empty string `""`. (Previously
        the no-row case was a 404, which the browser's resource-
        loading layer surfaced as a "Failed to load resource" console
        error on every /watch page visit — no client-side `.catch()`
        could suppress it; an empty string keeps the same "blank
        dropdown" UX without the noise.)

        GET and PUT also repeat `status`, `created_at` and `updated_at` at
        the top level of the body, outside `data`: the handler answered with
        only that bare object until v2.6, and the Android phone app reads it.
      tags: [Items]
      responses:
        '200':
          description: Current status (or empty string when never set).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatchStatusBody' }
              example:
                status: watching
                created_at: '2026-10-01T19:04:11Z'
                updated_at: '2026-10-12T21:30:02Z'
                data:
                  status: watching
                  created_at: '2026-10-01T19:04:11Z'
                  updated_at: '2026-10-12T21:30:02Z'
    put:
      summary: Set watch status
      tags: [Items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [plan_to_watch, watching, completed, on_hold, dropped] }
      responses:
        '200':
          description: Saved; the stored status, in the same shape as GET.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatchStatusBody' }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      summary: Clear watch status
      tags: [Items]
      responses:
        '204': { description: Cleared. }

  /api/v1/items/{id}/playback-rate:
    get:
      summary: Listening speed for an audiobook
      description: |
        The speed the caller plays this book at. `{id}` is an `audiobook` or
        one of its `audiobook_chapter` items (it resolves to the book).
        `source` is `book` (set on this book), `recent` (the caller's latest
        speed on another book, what a new book starts at) or `default` (1.0).
        v2.5.
      tags: [Audiobooks]
      responses:
        '200':
          description: The speed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      rate: { type: number, minimum: 0.5, maximum: 3.0 }
                      source: { type: string, enum: [book, recent, default] }
        '404': { description: Not found, or hidden from the caller (library access / rating ceiling). }
        '422': { description: 'VALIDATION: not an audiobook.' }
    put:
      summary: Save the listening speed for an audiobook
      tags: [Audiobooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rate]
              properties:
                rate: { type: number, minimum: 0.5, maximum: 3.0 }
      responses:
        '204': { description: Saved (on the book, for a chapter id). }
        '400': { description: Missing or out-of-range rate. }

  /api/v1/items/{id}/bookmarks:
    get:
      summary: The caller's bookmarks in an audiobook
      description: |
        Every bookmark the caller has in the book (`{id}` is the book or one of
        its chapters), in listening order: by chapter, then position.
        `item_id` is the playable item the position is in (the book itself
        for a single-file book). v2.5.
      tags: [Audiobooks]
      responses:
        '200':
          description: Bookmarks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AudiobookBookmark' }
        '404': { description: Not found, or hidden from the caller. }
        '422': { description: 'VALIDATION: not an audiobook.' }
    post:
      summary: Add a bookmark
      description: '`{id}` is the playable item: a single-file audiobook, or the chapter being played.'
      tags: [Audiobooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position_ms]
              properties:
                position_ms: { type: integer, minimum: 0 }
                note: { type: string, maxLength: 500 }
      responses:
        '201':
          description: The new bookmark.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AudiobookBookmark' }
        '400': { description: Negative position or a note over 500 characters. }
        '409': { description: 'BOOKMARK_LIMIT: 1000 bookmarks in this book already.' }

  /api/v1/bookmarks/{id}:
    patch:
      summary: Edit a bookmark's note
      tags: [Audiobooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, maxLength: 500, description: '"" clears it.' }
      responses:
        '204': { description: Saved. }
        '404': { description: No such bookmark of the caller's. }
    delete:
      summary: Delete a bookmark
      tags: [Audiobooks]
      responses:
        '204': { description: Deleted. }
        '404': { description: No such bookmark of the caller's. }

  /api/v1/items/{id}/watched:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    post:
      summary: Mark played
      description: |
        Marks the item watched for the caller without playing it. A
        movie, episode, music video or home video is marked directly; a
        season marks each of its episodes and a show every episode under
        it (only episodes within the caller's content-rating ceiling).
        A mark overrides all earlier watch activity; activity after it
        derives normally. Marks are not plays and never appear in
        analytics or history. Other item types return 422. Items outside
        the caller's libraries or ceiling return 404.
      tags: [Items]
      responses:
        '204': { description: Marked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/NoWatchState' }
    delete:
      summary: Mark unplayed
      description: |
        Marks the item (or every episode of a season / show) unwatched
        for the caller and clears its resume point. Same scope and
        errors as POST.
      tags: [Items]
      responses:
        '204': { description: Marked unwatched. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/NoWatchState' }

  /api/v1/items/{id}/dismiss-continue-watching:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    post:
      summary: Remove from Continue Watching
      description: |
        Hides the item from every Continue Watching row (the legacy
        combined row and the split TV / movie rows) and from Next Up
        until the caller records newer watch activity on it. An episode
        or season dismisses its show's tile (Continue Watching TV shows
        one tile per show). Movies, episodes, seasons, shows, music
        videos and home videos only (422 otherwise).
      tags: [Items]
      responses:
        '204': { description: Dismissed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/NoWatchState' }

  /api/v1/items/{id}/up-next:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: Which episode Play on a show or season starts
      description: |
        Shows and seasons only (422 otherwise). Considers only episodes
        within the caller's content-rating ceiling; for a show, season 0
        specials are skipped unless the show has nothing else.

        - resume: an episode has a resume point (the most recently
          touched one; `episode.view_offset_ms` is set)
        - next: the first not-watched episode after the most recently
          watched one (by season, then episode number); if nothing is
          left after it, the first not-watched episode overall
        - start: nothing watched yet (first episode)
        - rewatch: everything watched (first episode)
        - none: no episodes (`episode` omitted)
      tags: [Items]
      responses:
        '200':
          description: Up next.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UpNext' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/NoWatchState' }

  /api/v1/items/{id}/rating:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: The caller's own star rating for an item
      description: |
        Per-user rating on a 0-10 scale, independent of the community
        average (which is returned inline on the item payload as
        `community_rating`). 404 when the caller has not rated the item —
        distinct from a score of 0, which is a real rating.

        Returns 404 rather than an empty value when the ratings service is
        not wired, so a deployment with the feature off looks like a
        deployment where nothing is rated.
      tags: [Items]
      responses:
        '200':
          description: The caller's rating.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      score: { type: number, format: float, minimum: 0, maximum: 10 }
        '404': { description: Caller has not rated this item, or ratings are disabled. }
    put:
      summary: Set the caller's rating
      description: Upserts, so re-rating an already-rated item replaces the score.
      tags: [Items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score: { type: number, format: float, minimum: 0, maximum: 10 }
      responses:
        '200':
          description: Saved; echoes the stored score.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      score: { type: number, format: float }
        '400': { description: Score outside 0-10, or a malformed body. }
    delete:
      summary: Clear the caller's rating ("un-rate")
      description: Clearing a rating that was never set is a no-op and still returns 204.
      tags: [Items]
      responses:
        '204': { description: Cleared. }

  /api/v1/items/{id}/lyrics:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: Lyrics for a music track
      description: |
        Returns embedded USLT (ID3) / Vorbis-comment LYRICS extracted
        at scan time, or LRCLIB-sourced synced lyrics when the file
        ships none. `synced` is true when timestamped LRC frames were
        parsed; clients use this to render karaoke-style timing.
      tags: [Items]
      responses:
        '200':
          description: Lyrics text.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      text:   { type: string }
                      synced: { type: boolean }
                      source: { type: string, enum: [embedded, lrclib], description: 'Where the bytes came from.' }
        '404': { description: 'No lyrics available.' }

  /api/v1/items/{id}/markers:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: List markers (intro, recap, credits) for an item
      tags: [Items]
      responses:
        '200':
          description: Markers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Marker' }

  /api/v1/items/{id}/markers/{kind}:
    parameters:
      - { $ref: '#/components/parameters/UUID' }
      - { in: path, name: kind, required: true, schema: { type: string, enum: [intro, recap, credits] } }
    put:
      summary: Upsert a marker
      tags: [Items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_ms, end_ms]
              properties:
                start_ms: { type: integer, format: int64 }
                end_ms:   { type: integer, format: int64 }
      responses:
        '204': { description: Saved. }
    delete:
      summary: Delete a marker
      tags: [Items]
      responses:
        '204': { description: Deleted. }

  /api/v1/items/{id}/exif:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: Photo EXIF metadata
      tags: [Items]
      responses:
        '200':
          description: EXIF (if a photo).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PhotoEXIF' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/items/{id}/credits:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: Cast and crew for an item
      tags: [People]
      responses:
        '200':
          description: Credits.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Credit' }

  # ── People ─────────────────────────────────────────────────────────────────
  /api/v1/people:
    get:
      summary: Search people
      description: >
        People whose name starts with `q`. A non-admin caller only finds people
        credited on an item they could open (a library they have a grant on,
        within their content-rating ceiling).
      tags: [People]
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: People.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PersonSummary' }

  /api/v1/people/{id}:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: Person detail
      tags: [People]
      responses:
        '200':
          description: Person.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Person' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/people/{id}/filmography:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: Person filmography
      tags: [People]
      responses:
        '200':
          description: Filmography entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/FilmographyEntry' }

  # ── Studios / networks ───────────────────────────────────────────────────────
  /api/v1/studios:
    get:
      summary: List studios and networks
      description: |
        *(v2.6)* Studios (movies' TMDB production companies) and networks
        (shows' TMDB networks); an NFO's `<studio>` tags win over TMDB's.
        Only studios with at least one title the caller can see are listed,
        each with how many — library grants, the content-rating ceiling and
        label restrictions all apply. Ordered by name.
      tags: [Studios]
      parameters:
        - { in: query, name: library_id, schema: { type: string, format: uuid }, description: 'Count only this library''s titles. 404 when the caller can''t open it.' }
        - { in: query, name: kind, schema: { type: string, enum: [studio, network] } }
      responses:
        '200':
          description: Studios with visible titles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Studio' }
                  meta: { type: object, properties: { total: { type: integer } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/studios/{id}:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: Studio detail
      description: '*(v2.6)* A studio and how many of its titles the caller can see. 404 when that is none, the same as an unknown id.'
      tags: [Studios]
      responses:
        '200':
          description: Studio.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Studio' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/studios/{id}/items:
    parameters:
      - { $ref: '#/components/parameters/UUID' }
      - { $ref: '#/components/parameters/Limit' }
      - { $ref: '#/components/parameters/Offset' }
      - { in: query, name: library_id, schema: { type: string, format: uuid }, description: 'Only this library''s titles. 404 when the caller can''t open it.' }
      - { in: query, name: sort, schema: { type: string, enum: [title, year, rating, created_at] } }
      - in: query
        name: sort_dir
        schema: { type: string, enum: [asc, desc] }
        description: Defaults to `desc` for year, rating and created_at; `asc` for title.
    get:
      summary: A studio's titles
      description: |
        *(v2.6)* The studio's movies or shows the caller can see, paged and
        sorted like library browse, in the same item shape (watch state is
        not included). 404 when the caller can see none of them (without
        `library_id`) or the id is unknown.
      tags: [Studios]
      responses:
        '200':
          description: One page of titles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItemListEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Subtitles ──────────────────────────────────────────────────────────────
  /api/v1/items/{id}/subtitles/search:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: Search external subtitle providers
      tags: [Subtitles]
      parameters:
        - { in: query, name: language, schema: { type: string, description: 'ISO 639-1 or 639-2 code.' } }
      responses:
        '200':
          description: Provider results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SubtitleSearchResult' }
        '503': { description: 'SUBTITLES_NOT_CONFIGURED: OpenSubtitles is not enabled on this server (features.subtitles_external is false). Download answers the same.' }

  /api/v1/items/{id}/subtitles/download:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    post:
      summary: Download an external subtitle to disk
      tags: [Subtitles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, provider_file_id, language]
              properties:
                provider:         { type: string }
                provider_file_id: { type: string }
                language:         { type: string }
      responses:
        '201':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }

  /api/v1/items/{id}/subtitles/ocr:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    post:
      summary: Enqueue an OCR job for a PGS/VobSub track
      description: |
        v2.1 Track A. Returns immediately with a job ID; OCR runs in
        a server-lifetime goroutine. Client polls
        `/api/v1/items/{id}/subtitles/ocr/{jobId}` for status. Async
        because OCR can take minutes — synchronous behaviour 524'd
        behind reverse proxies with sub-multi-minute timeouts
        (Cloudflare Tunnel free tier = 100 s).
      tags: [Subtitles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stream_index]
              properties:
                stream_index: { type: integer }
                language:     { type: string }
      responses:
        '202':
          description: Job enqueued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:        { type: string, format: uuid }
                      status:    { type: string, enum: [pending, running, complete, failed] }
                      created_at: { type: string, format: date-time }

  /api/v1/items/{id}/subtitles/ocr/{jobId}:
    parameters:
      - { $ref: '#/components/parameters/UUID' }
      - { in: path, name: jobId, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Poll OCR job status (v2.1)
      tags: [Subtitles]
      responses:
        '200':
          description: Job status. `complete` jobs include the resulting subtitle id.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:           { type: string, format: uuid }
                      status:       { type: string, enum: [pending, running, complete, failed] }
                      created_at:   { type: string, format: date-time }
                      completed_at: { type: string, format: date-time, nullable: true }
                      error:        { type: string, nullable: true }
                      subtitle_id:  { type: string, format: uuid, nullable: true }
        '404': { description: Job not found (TTL expired or never enqueued). }

  /api/v1/items/{id}/subtitles/{subId}:
    parameters:
      - { $ref: '#/components/parameters/UUID' }
      - { in: path, name: subId, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Delete an external subtitle
      tags: [Subtitles]
      responses:
        '204': { description: Deleted. }

  /api/v1/subtitles/{id}/offset:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid }, description: 'External subtitle id.' }
    put:
      summary: Set an external subtitle's timing offset (admin)
      tags: [Subtitles]
      description: |
        *(v2.6, migration 00055)* A server-wide correction for a mistimed
        subtitle, applied for everyone: `/media/external-subtitles/{id}`
        serves every cue shifted by it (positive = later; a cue pushed
        before 0 starts at 0, one that also ends at or before 0 is
        dropped). Clients need no change. 0 removes the correction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offset_ms]
              properties:
                offset_ms: { type: integer, minimum: -600000, maximum: 600000 }
      responses:
        '200':
          description: The updated subtitle.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ExternalSubtitle' }
        '400': { description: 'Missing or malformed offset_ms.' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 'offset_ms outside ±600000 (10 minutes).' }

  /api/v1/files/{file_id}/subtitle-streams/{index}/offset:
    parameters:
      - { in: path, name: file_id, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: index, required: true, schema: { type: integer, minimum: 0 }, description: 'Absolute stream index, as in subtitle_streams[].index.' }
    put:
      summary: Set an embedded subtitle stream's timing offset (admin)
      tags: [Subtitles]
      description: |
        *(v2.6, migration 00055)* The same correction for an embedded text
        subtitle stream; `/media/subtitles/{fileId}/{streamIndex}` serves
        the shifted cues. Image-based streams (PGS, VobSub, DVB) are 415 —
        they're never served as text; set the offset on their OCR'd copy.
        Converted downloads still carry the embedded stream's original
        timing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offset_ms]
              properties:
                offset_ms: { type: integer, minimum: -600000, maximum: 600000 }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      file_id:      { type: string, format: uuid }
                      stream_index: { type: integer }
                      offset_ms:    { type: integer }
        '400': { description: 'Bad file id, stream index or body.' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'No such file, or the file has no subtitle stream at that index.' }
        '415': { description: 'IMAGE_SUBTITLE: the stream is image-based.' }
        '422': { description: 'offset_ms outside ±600000 (10 minutes).' }

  # ── Trickplay ──────────────────────────────────────────────────────────────
  /api/v1/items/{id}/trickplay:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: Trickplay status
      tags: [Trickplay]
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TrickplayStatus' }
    post:
      summary: Generate trickplay sprites
      tags: [Trickplay]
      responses:
        '202': { description: Enqueued. }

  /trickplay/{id}/{file}:
    parameters:
      - { $ref: '#/components/parameters/UUID' }
      - { in: path, name: file, required: true, schema: { type: string } }
    get:
      summary: Serve a trickplay sprite or VTT
      description: |
        Auth required: Bearer / cookie, or a `purpose=asset` token in
        `?token=` (sprites are loaded where no Authorization header can be
        sent; a general access token is rejected in the URL). The item's
        library ACL and the caller's content-rating ceiling apply (404 when
        either fails). `file` is whitelisted to `index.vtt`,
        `sprite_NNN.jpg` or `chapter_NNN.jpg` (a chapter thumbnail, linked
        from the item detail's `chapters[].thumb_url`); the VTT's cues name
        sprites relative to it.
      tags: [Trickplay]
      responses:
        '200':
          description: Sprite/VTT.
          content:
            image/jpeg: {}
            text/vtt:   {}
        '401': { description: No or invalid credentials. }
        '404': { description: Unknown item, no access, over the rating ceiling, or no such file. }

  /api/v1/items/{id}/trickplay/{file}:
    parameters:
      - { $ref: '#/components/parameters/UUID' }
      - { in: path, name: file, required: true, schema: { type: string, example: index.vtt } }
    get:
      summary: Serve a trickplay sprite or VTT (alias)
      description: |
        Alias of `GET /trickplay/{id}/{file}` at the path the Tizen and
        webOS clients use — same handler, same auth (Bearer / cookie, or a
        `purpose=asset` `?token=`), same library ACL and rating ceiling.
        Relative sprite names in the VTT resolve to
        `/api/v1/items/{id}/trickplay/sprite_NNN.jpg`.
      tags: [Trickplay]
      responses:
        '200':
          description: Sprite/VTT.
          content:
            image/jpeg: {}
            text/vtt:   {}
        '401': { description: No or invalid credentials. }
        '404': { description: Unknown item, no access, over the rating ceiling, or no such file. }

  # ── Transcode ──────────────────────────────────────────────────────────────
  /api/v1/items/{id}/playback-decision:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    post:
      summary: Server-authoritative play decision
      tags: [Transcode]
      description: |
        Resolves the client's capability profile (`X-Client-Capabilities`,
        legacy `supports_*` body flags folded in) against the file and
        returns how to play it: `directPlay` (the direct file URL),
        `directStream` (a video-copy remux transcode), `transcode`, or
        `unsupported` / `damaged` (no playback path). Read-only; the
        transcode start that follows re-validates everything.

        **Internet streaming limit (v2.6).** When the caller is outside
        the home network — judged from the trusted client IP, see
        Settings ▸ Transcode `local_networks` — and the source bitrate
        exceeds its cap (the lowest of the user's bitrate cap, the
        user's internet cap and the server's internet limit), a
        `directPlay` / `directStream` verdict becomes `transcode`, with
        `reason: remote_bitrate_limit` (an internet limit binds) or
        `user_bitrate_limit` (the user's own cap is lower) and the cap in
        `max_bitrate_kbps`. Transcode start then clamps the output (and
        every ABR rung) to that cap. Video only; LAN clients and clients
        with no internet limit configured get exactly the verdict they
        got before. Both fields are additive — a client that ignores
        them still sees `transcode`. A client that skips this endpoint
        and fetches `/media/stream` directly gets 409 `TRANSCODE_REQUIRED`
        there instead (v2.6), so it is held to the limit too.

        **Dolby Vision (v2.6).** The capability profile's `dovi` key lists
        the Dolby Vision profiles the client decodes (`dovi=5:8.1:8.4`, plus
        `7`; `dovi=1` means `5:8.1:8.4`). A file whose profile is listed
        plays as Dolby Vision: profile 5 is no longer `unsupported`, the HDR
        tone-map check is skipped, and a remux keeps the Dolby Vision
        configuration record and per-frame metadata (fMP4 segments). A
        profile 7 file for a client that lists only 8.1 is converted to 8.1
        on workers with the `dolby_vision_p7_to_p81` feature, else plays
        from its HDR10 base layer. Profile 5 is never re-encoded: a client
        that lists it but needs a re-encode gets `unsupported`. Clients that
        don't send `dovi` get the verdicts they got before (profile 5
        `unsupported`, other profiles judged by their base layer).

        **Quality profile (v2.6).** The caller's own quality profile
        (`PUT /users/me/quality-profile`) applies on every network: its
        resolution ceiling bounds the verdict like a display limit, and
        a video above its video bitrate — or an audio-only file above
        its audio bitrate — becomes `transcode` with `reason:
        quality_profile` and the cap in `max_bitrate_kbps`.

        **Concurrent streams (v2.6).** With an admin-set
        `max_concurrent_streams`, the decision answers 429
        `TOO_MANY_SESSIONS` when the caller already has that many streams
        on other devices — transcode sessions and direct plays alike.

        **Optimized versions (v2.6).** A client that declares
        `optimized=1` in `X-Client-Capabilities` may get `decision:
        directPlay` with `reason: optimized_version` and an
        `optimized_version` to play from its `stream_url`, when the source
        would otherwise need a video transcode (any cause, the internet
        limit included) and an admin-made optimized version fits the
        client's profile and bitrate cap. `file_id` stays the source's;
        `source_decision` / `source_reason` carry the source's own verdict
        for the client's fallback (the version has only the default audio
        track). Clients that don't send `optimized=1` never get this
        verdict.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                file_id: { type: string, format: uuid, description: 'Decide for this file of the item (default: the best file).' }
      responses:
        '200':
          description: The decision.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      decision: { type: string, enum: [directPlay, directStream, transcode, unsupported, damaged] }
                      file_id: { type: string, format: uuid }
                      reason:
                        type: string
                        enum: [remote_bitrate_limit, user_bitrate_limit, quality_profile, optimized_version]
                        description: Set only when the server overrode a capability verdict (v2.6). `optimized_version` only for `optimized=1` clients.
                      max_bitrate_kbps:
                        type: integer
                        description: The bitrate cap the transcode will be held to, with `reason` (v2.6).
                      optimized_version:
                        allOf: [{ $ref: '#/components/schemas/OptimizedVersion' }]
                        description: With `reason optimized_version` — the version to direct-play (v2.6).
                      source_decision:
                        type: string
                        description: The source file's own verdict, when an optimized version replaced it (v2.6).
                      source_reason:
                        type: string
                        description: The source file's own reason (e.g. `remote_bitrate_limit`), when an optimized version replaced it (v2.6).
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429':
          description: The caller is at its admin-set concurrent-stream limit (`code TOO_MANY_SESSIONS`, v2.6).

  /api/v1/items/{id}/transcode:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    post:
      summary: Start a HLS transcode session
      tags: [Transcode]
      description: |
        Spins up an HLS session for the item. The server picks one of
        three decisions: **direct** (no session, client plays the
        file directly), **remux** (video stream copied, audio
        re-encoded if needed — this is the path AV1 sources take
        with `video_copy:true`), or **transcode** (full re-encode).
        The response shape is the same regardless, but `direct` is
        rare from this endpoint — typically the client checks the
        item's file metadata first and skips the session start
        entirely.

        Body may be an empty object `{}` for "use defaults". For an
        AV1 source on an AV1-capable client, send `{"video_copy": true}`
        to get the fMP4 remux path with `#EXT-X-MAP` + `.m4s`
        segments instead of H.264 NVENC/QSV/AMF re-encode.

        Subject to the per-session `TranscodeStartLimit` rate limit
        (default 10/min, override via `OS_TRANSCODE_START_RATE_LIMIT_PER_MIN`).

        Multi-part movies (v2.6): when the chosen file is one part of a
        stacked movie (its `part_index` is set), the session streams every
        part in order as one continuous movie starting from part 1,
        whichever part's `file_id` was sent. `position_ms` and the stream
        timeline are on that combined timeline, and the item's
        `duration_ms` is its length. A damaged, missing or swapped part
        refuses the whole session with the same codes a single file gets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscodeStartRequest'
      responses:
        '200':
          description: Session created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TranscodeStartResponse' }
        '400':
          description: 'Malformed request (`code: BAD_REQUEST`): a negative `height` or one over the server maximum, an invalid `file_id`, or an `audio_stream_index` past the last audio track of the file. v2.6: a refused `burn_subtitle_stream_index` answers `INVALID_SUBTITLE_STREAM`, `SUBTITLE_NOT_IMAGE` or `BURN_IN_UNSUPPORTED` (see the request field).'
        '404':
          description: 'Item not found, or item type is not transcodable (e.g. audiobook / book / photo).'
        '422':
          description: |
            Pre-flight source verification rejected the file before a worker
            was dispatched. `code` is one of:

            * `SOURCE_MISSING` — the file path doesn't resolve on disk
              (drive unmounted, file moved/deleted since scan, share offline).
            * `SOURCE_UNREADABLE` — ffprobe couldn't demux the file within
              the 5 s pre-flight budget (corrupt container, zero-byte file,
              unsupported codec at the header level).
            * `FILE_DAMAGED` — the integrity probe marked the file damaged
              (the play decision answers `damaged` for it).

            The first two replace the historical "spinner forever" failure mode where
            ffmpeg hung on the bad input and the client polled the playlist
            endpoint until the 60 s deadline. See ERROR_CODES.md ▸ Transcode.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code: { type: string, enum: [SOURCE_MISSING, SOURCE_UNREADABLE, FILE_DAMAGED] }
                      message: { type: string }
                      request_id: { type: string }
        '415':
          description: |
            `DOLBY_VISION_UNSUPPORTED`: a Dolby Vision profile 5 file (no
            compatible base layer) for a client whose `dovi` capability
            doesn't list profile 5, or any re-encode of a profile 5 file
            (it can only be copied). `UNSUPPORTED_CONTAINER`: the source is a
            playlist / reference container.
        '429':
          description: |
            Either the per-session `TranscodeStartLimit` (default 10/min) or
            the per-user concurrent-session cap (default 5) was hit. Body
            carries `code: TOO_MANY_SESSIONS` for the latter. An admin-set
            `max_concurrent_streams` replaces the default and, since v2.6,
            counts the user's direct plays on other devices too.
        '503':
          description: |
            v2.6: `BURN_IN_UNAVAILABLE` when a burn-in was asked for and no
            transcode worker can do one yet (every worker predates it).

            Returned by the playlist sub-endpoint
            (`/api/v1/transcode/sessions/{sid}/playlist.m3u8`) when seg 0
            doesn't land within the handler's 60 s deadline. The deadline is
            now bounded by per-call worker-HEAD timeouts so a hung worker
            can't slip past it — the client gets the 503 promptly instead of
            polling indefinitely.

  /api/v1/transcode/sessions/{sid}:
    parameters: [{ in: path, name: sid, required: true, schema: { type: string } }]
    delete:
      summary: Stop a HLS transcode session
      tags: [Transcode]
      responses:
        '204': { description: Stopped. }

  /api/v1/transcode/sessions/{sid}/playlist.m3u8:
    parameters:
      - { in: path, name: sid, required: true, schema: { type: string } }
      - { in: query, name: token, required: true, schema: { type: string }, description: 'Segment token from `transcodeStart`.' }
    get:
      summary: Serve the rewritten HLS playlist
      description: |
        Returns `application/x-mpegURL`. Errors are plain text, not the JSON
        envelope. This route, the segment route and the ABR rung routes
        answer `Access-Control-Allow-Origin: *` (never with credentials; the
        token in the URL is the only credential) and answer CORS preflights,
        so a Chromecast receiver on Google's origin can play the session.
      tags: [Transcode]
      security: []
      responses:
        '200':
          description: Playlist.
          content:
            application/x-mpegURL: {}
        '401': { description: Bad or missing token. }
        '503': { description: Playlist not yet ready or request cancelled. }

  /api/v1/transcode/sessions/{sid}/seg/{name}:
    parameters:
      - { in: path, name: sid,  required: true, schema: { type: string } }
      - { in: path, name: name, required: true, schema: { type: string } }
      - { in: query, name: token, required: true, schema: { type: string } }
    get:
      summary: Serve a HLS segment
      description: Returns `video/MP2T` or `video/mp4`. Errors are plain text.
      tags: [Transcode]
      security: []
      responses:
        '200':
          description: Segment.
          content:
            video/MP2T: {}
            video/mp4:  {}
        '401': { description: Bad or missing token. }
        '404': { description: Segment not found upstream. }

  # ── Direct play / subtitles ────────────────────────────────────────────────
  /media/stream/{id}:
    parameters:
      - { $ref: '#/components/parameters/UUID' }
      - in: query
        name: token
        required: false
        schema: { type: string }
        description: |
          Optional Paseto v4 stream token (purpose=stream) bound to this
          file ID. Used by native players that can't carry a Bearer
          header on a media-element fetch (Android `<video>`, iOS Safari
          `<audio>`). Token is 24 h, file_id-pinned, and rejected on
          any non-file-scoped route. Falls through to the standard
          Bearer / cookie auth when omitted.
    get:
      summary: Direct-play a media file
      description: Serves the raw container with HTTP range support. Auth via cookie, bearer, or `?token=<stream_token>`.
      tags: [Items]
      responses:
        '200':
          description: Full body.
          content:
            'video/*': {}
        '206':
          description: Partial content (range request).
        '401': { description: 'Bad or missing auth.' }
        '403': { description: "Caller's content-rating ceiling forbids this item, or per-library ACL denies access." }
        '404': { description: 'File not found, soft-deleted, or item lookup failed.' }
        '409':
          description: |
            `TRANSCODE_REQUIRED`: the play decision would convert this video for
            the viewer on any device — over the internet streaming limit from
            outside the home network, or over the viewer's quality profile
            (video bitrate or resolution). Play it through
            `POST /api/v1/items/{id}/transcode` instead. Audio-only files and books are
            never refused.
        '422': { description: '`FILE_DAMAGED`: the integrity probe marked this video damaged.' }
        '429': { description: '`TOO_MANY_SESSIONS`: over the admin-set concurrent-stream limit.' }

  /media/download/{id}:
    parameters:
      - { $ref: '#/components/parameters/UUID' }
      - in: query
        name: token
        required: false
        schema: { type: string }
        description: |
          Same stream-token semantics as `/media/stream/{id}` — required
          when the caller can't carry cookies (mobile webview download
          managers, share-sheet handoff to a downloader app).
    get:
      summary: Download the raw file with a save-as disposition
      description: |
        Same auth + per-library ACL + content-rating gate as `/media/stream/{id}`,
        but adds `Content-Disposition: attachment; filename="..."; filename*=UTF-8''...`
        and `Content-Type: application/octet-stream` so the browser triggers a
        save-as dialog instead of inline playback. Body bytes are the original
        on-disk file (no transcode); `Range` is honoured so an interrupted
        download can resume.

        Filename is built from the item title + the on-disk extension and
        sanitised against header injection (CRLF strip), shell-illegal
        characters, and quoted-string termination (`"`, `\`). Capped at 200
        chars. Both the ASCII `filename=` fallback and the UTF-8
        `filename*=UTF-8''<percent-encoded>` form are emitted so non-ASCII
        titles survive on every browser.

        The original file only. Lower-quality copies are converted downloads:
        `POST /api/v1/items/{id}/downloads`.
      tags: [Items]
      responses:
        '200':
          description: Full body with attachment disposition.
          headers:
            Content-Disposition:
              schema: { type: string }
              description: 'Always begins with `attachment;` and includes both `filename=` and `filename*=UTF-8''` forms.'
          content:
            application/octet-stream: {}
        '206':
          description: Partial content (resume after interrupted download).
        '401': { description: Bad or missing auth. }
        '403':
          description: |
            Content-rating or per-library ACL denial, **or** the server-wide
            web-downloads admin toggle is off (v2.2). The off case carries
            `code = DOWNLOADS_DISABLED`. Mirrored to the public
            `features.web_downloads` capabilities flag so clients hide
            the UI without needing to probe with a real download.
        '404': { description: File not found or soft-deleted. }

  # ── Converted downloads ────────────────────────────────────────────────────
  /api/v1/items/{id}/downloads:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: Converted-download qualities for an item
      description: |
        The lower-quality copies this user may download (the original is
        always `GET /media/download/{file_id}`). `allowed` is false for a
        quality above the user's bitrate cap — and, from outside the home
        network, the internet limit — following the playback rule: the
        highest ladder rung that fits, or the lowest rung when none does.
        Empty `qualities` when the file can't be converted (audio-only,
        damaged, Dolby Vision profile 5).
      tags: [Downloads]
      parameters:
        - { in: query, name: file_id, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Options.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DownloadOptions' }
        '403': { description: '`DOWNLOADS_DISABLED`, over the rating ceiling / label restriction, watch limit, or an admin stop.' }
        '404': { description: Unknown item, no library access, or no such file. }
    post:
      summary: Request a converted download
      description: |
        Creates the user's conversion job, or returns their existing one for
        this file and quality (200 instead of 201). The file is encoded once
        into a progressive MP4 (H.264 + stereo AAC, `+faststart`; text
        subtitles carried as mov_text) and the result is shared: another user
        asking for the same file at the same quality gets the ready file
        without a second encode. A stacked (multi-part) movie converts into
        one joined file whichever part's `file_id` is given. Poll
        `GET /api/v1/downloads/{job}` until `status` is `ready`, then fetch
        `file_url`. Rate-limited like transcode start; at most 3 of a user's
        jobs may be waiting on an encode at once.
      tags: [Downloads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quality]
              properties:
                quality: { type: string, enum: [1080p_8mbps, 720p_4mbps, 720p_2mbps, 480p_1mbps] }
                file_id: { type: string, format: uuid, description: "Default: the item's best file." }
      responses:
        '200':
          description: The existing job.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DownloadJob' }
        '201':
          description: Job created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DownloadJob' }
        '400': { description: 'Bad body, or `quality: original` (use `/media/download/{file_id}`).' }
        '403': { description: '`DOWNLOADS_DISABLED`, `QUALITY_ABOVE_LIMIT`, over the rating ceiling / label restriction, watch limit, or an admin stop.' }
        '404': { description: Unknown item, no library access, or a `file_id` not of this item. }
        '422': { description: '`NOT_CONVERTIBLE` (audio-only, damaged, a playlist container, Dolby Vision profile 5) or an unknown quality.' }
        '429': { description: "`TOO_MANY_DOWNLOADS` — three of the user's downloads are already being prepared." }

  /api/v1/downloads/{job}:
    parameters:
      - { in: path, name: job, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Converted-download status and progress
      tags: [Downloads]
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DownloadJob' }
        '404': { description: "No such job, or not the caller's." }
    delete:
      summary: Cancel or remove a converted download
      description: |
        Removes the job. An encode nobody else is waiting for is cancelled;
        a ready file stays in the shared cache for anyone who asks next,
        until the cleanup task evicts it.
      tags: [Downloads]
      responses:
        '204': { description: Removed. }
        '404': { description: "No such job, or not the caller's." }

  /api/v1/downloads/{job}/file:
    parameters:
      - { in: path, name: job, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Fetch a ready converted download
      description: |
        The MP4, `Content-Type: video/mp4`, with `Content-Disposition:
        attachment` (title + quality) and `Range` support. Auth: Bearer /
        cookie, or a `purpose=asset` `?token=` (a browser save-as link). Only
        the job's owner; the item gates (library ACL, rating ceiling, labels,
        watch limit, admin stop, `DOWNLOADS_DISABLED`) and the bitrate cap
        are re-checked at fetch time. Fetching moves the file's expiry out.
      tags: [Downloads]
      responses:
        '200':
          description: The file.
          content:
            video/mp4: {}
        '206': { description: Partial content (range request). }
        '403': { description: '`QUALITY_ABOVE_LIMIT` from here, or an item gate.' }
        '404': { description: "No such job, or not the caller's." }
        '409': { description: '`DOWNLOAD_NOT_READY` — still encoding, failed, or expired.' }

  /api/v1/users/me/downloads:
    get:
      summary: My converted downloads
      description: The caller's jobs, newest first (at most 100).
      tags: [Downloads]
      responses:
        '200':
          description: Jobs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DownloadJob' } }

  # ── Optimized versions ─────────────────────────────────────────────────────
  /media/optimized/{id}:
    parameters:
      - { $ref: '#/components/parameters/UUID' }
      - in: query
        name: token
        required: false
        schema: { type: string }
        description: |
          Optional stream token bound to this optimized version
          (`optimized_versions[].stream_token`), or an asset token.
    get:
      summary: Direct-play an optimized version
      description: |
        The optimized version's MP4 (H.264 + AAC, faststart) with `Range`
        support. Same gates as `/media/stream/{id}` on the item: library
        ACL, rating ceiling, label restriction, parental watch limit, admin
        playback stop. 404 once the version is deleted, or its source file
        was deleted or replaced in place. Shows on Now Playing as a direct
        play with `optimized_version` set (v2.6).
      tags: [Optimize, Items]
      responses:
        '200': { description: The file., content: { video/mp4: {} } }
        '206': { description: Partial content (range request). }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/optimize/profiles:
    get:
      summary: The "Optimize…" profiles (admin)
      tags: [Optimize]
      responses:
        '200':
          description: Profiles, smallest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:              { type: string, enum: [mobile_720p, tv_1080p, original_compatible] }
                        label:           { type: string, example: 'Mobile · 720p 4 Mbps' }
                        max_height:      { type: integer }
                        bitrate_kbps:    { type: integer }
                        keep_resolution: { type: boolean, description: 'The original-quality profile keeps the source resolution and picks the bitrate per file.' }

  /api/v1/optimize:
    post:
      summary: Queue optimized versions (admin)
      description: |
        Queues an optimized version at `profile` for every video item the
        selection covers — set exactly one of `item_ids` (movies,
        episodes; shows and seasons expand to their episodes; at most 500),
        `library_id` or `collection_id`. At most 5000 items per request
        (`truncated` says the rest were left out). Each item's best file is
        encoded (a stacked movie's parts as one file) by the converted-
        download runner, sharing its queue, encoder and transcode slots
        (downloads go first). Items that already have the version are left
        alone; items that can't be converted (no video, damaged, Dolby
        Vision profile 5, a playlist container) are reported as skipped.
        Versions never expire: they are removed when the source file is
        deleted or replaced, or by `DELETE /api/v1/optimize/versions/{id}`.
        Audited as `optimize.request`.
      tags: [Optimize]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile]
              properties:
                profile:       { type: string, enum: [mobile_720p, tv_1080p, original_compatible] }
                item_ids:      { type: array, items: { type: string, format: uuid } }
                library_id:    { type: string, format: uuid }
                collection_id: { type: string, format: uuid }
      responses:
        '200':
          description: What the request did.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      profile:   { type: string }
                      items:     { type: integer, description: Video items the selection expanded to. }
                      queued:    { type: integer }
                      existing:  { type: integer, description: Already optimized, or queued / encoding. }
                      skipped:   { type: integer }
                      truncated: { type: boolean }
                      skipped_items:
                        type: array
                        description: Up to 50 skips, with the reason.
                        items:
                          type: object
                          properties:
                            item_id: { type: string, format: uuid }
                            reason:  { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No such collection. }
        '422': { description: 'Bad profile, or not exactly one selector.' }

  /api/v1/optimize/jobs:
    get:
      summary: Optimized versions and their jobs (admin)
      description: Newest first, with per-status totals under the item/library filter.
      tags: [Optimize]
      parameters:
        - { in: query, name: item_id,    schema: { type: string, format: uuid } }
        - { in: query, name: library_id, schema: { type: string, format: uuid } }
        - { in: query, name: status,     schema: { type: string, enum: [queued, running, ready, failed] } }
        - { in: query, name: limit,      schema: { type: integer, default: 100, maximum: 500 } }
        - { in: query, name: offset,     schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Jobs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      jobs:   { type: array, items: { $ref: '#/components/schemas/OptimizeJob' } }
                      counts: { type: object, additionalProperties: { type: integer }, example: { queued: 3, running: 1, ready: 40 } }

  /api/v1/optimize/jobs/{id}:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: One optimized version or job (admin)
      tags: [Optimize]
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/OptimizeJob' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Cancel an optimize job, or delete its version (admin)
      description: Same as `DELETE /api/v1/optimize/versions/{id}` (one id space). Audited as `optimize.delete`.
      tags: [Optimize]
      responses:
        '204': { description: Removed. }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/optimize/versions/{id}:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    delete:
      summary: Delete an optimized version (admin)
      description: Removes the version and its file; a queued or running job is cancelled. Players go back to the source.
      tags: [Optimize]
      responses:
        '204': { description: Removed. }
        '404': { $ref: '#/components/responses/NotFound' }

  /media/subtitles/{fileId}/{streamIndex}:
    parameters:
      - { in: path, name: fileId,      required: true, schema: { type: string, format: uuid } }
      - { in: path, name: streamIndex, required: true, schema: { type: integer } }
      - $ref: '#/components/parameters/SubtitleStartMS'
    get:
      summary: Serve an embedded subtitle as VTT
      tags: [Subtitles]
      description: |
        Cues are shifted by the stream's admin offset (v2.6). Sent with an
        ETag and `Cache-Control: private, no-cache`, so an offset change
        reaches clients on their next load; an unchanged track revalidates
        with 304. Answers `Access-Control-Allow-Origin: *` (no credentials)
        so a Chromecast receiver can read it with the `?token=` in the URL.
      responses:
        '200':
          description: Subtitle.
          content:
            text/vtt: {}
        '304': { description: 'If-None-Match matched the current ETag.' }

  /media/subtitles/{fileId}/external/{subId}:
    parameters:
      - { in: path, name: fileId, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: subId,  required: true, schema: { type: string, format: uuid } }
      - $ref: '#/components/parameters/SubtitleStartMS'
    get:
      summary: Serve an external subtitle through its file
      tags: [Subtitles]
      description: |
        v2.6. The same VTT as `/media/external-subtitles/{subId}`, addressed
        through the file it belongs to, so the file's stream token
        (`ItemFile.stream_token` as `?token=`) authenticates it — what a
        cast hands the Chromecast receiver, which has no cookie. 404 when
        the subtitle belongs to another file. CORS as above.
      responses:
        '200':
          description: Subtitle.
          content:
            text/vtt: {}
        '304': { description: 'If-None-Match matched the current ETag.' }
        '404': { $ref: '#/components/responses/NotFound' }

  /media/external-subtitles/{subId}:
    parameters:
      - { in: path, name: subId, required: true, schema: { type: string, format: uuid } }
      - $ref: '#/components/parameters/SubtitleStartMS'
    get:
      summary: Serve a downloaded external subtitle
      tags: [Subtitles]
      description: |
        Cues are shifted by the subtitle's admin offset (v2.6); same ETag
        and revalidation behaviour as /media/subtitles.
      responses:
        '200':
          description: Subtitle.
          content:
            text/vtt: {}
        '304': { description: 'If-None-Match matched the current ETag.' }

  /artwork/{path}:
    parameters:
      - { in: path, name: path, required: true, schema: { type: string }, description: 'Relative artwork path beneath any library scan_path.' }
      - { in: query, name: w, schema: { type: integer, maximum: 1920 }, description: 'Resize target width.' }
      - { in: query, name: h, schema: { type: integer, maximum: 1920 }, description: 'Resize target height.' }
    get:
      summary: Serve a poster/fanart image
      description: No auth so `<img>` tags load without credentials.
      tags: [Items]
      security: []
      responses:
        '200':
          description: Image.
          content:
            image/jpeg: {}
            image/png:  {}
        '404': { description: Not found in any library root. }

  # ── Notifications ──────────────────────────────────────────────────────────
  /api/v1/notifications:
    get:
      summary: List notifications
      tags: [Notifications]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Notifications.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }

  /api/v1/notifications/unread-count:
    get:
      summary: Unread notification count
      tags: [Notifications]
      responses:
        '200':
          description: Count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      count: { type: integer, format: int64 }

  /api/v1/notifications/{id}/read:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    post:
      summary: Mark a notification read
      tags: [Notifications]
      responses:
        '204': { description: Marked read. }

  /api/v1/notifications/read-all:
    post:
      summary: Mark all notifications read
      tags: [Notifications]
      responses:
        '204': { description: Marked read. }

  /api/v1/notifications/stream:
    get:
      summary: Server-Sent Events stream of new notifications
      description: |
        `text/event-stream`. Each event is a JSON-encoded notification on a `data:` line.
        The server emits `:` keepalive comments to defeat intermediary buffering.
      tags: [Notifications]
      responses:
        '200':
          description: Stream open.
          content:
            text/event-stream: {}

  # ── Sessions ───────────────────────────────────────────────────────────────
  /api/v1/sessions:
    get:
      summary: Active playback sessions
      description: |
        Now-playing list. Non-admin callers see only their own sessions;
        admins see every active session across the fleet.
      tags: [Sessions]
      responses:
        '200':
          description: Sessions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Session' }

  /api/v1/sessions/{id}/stop:
    parameters:
      - in: path
        name: id
        required: true
        description: A Now Playing card id from GET /api/v1/sessions (a transcode session id, or a direct-play card id such as `10.0.0.5|<item>|<user>`).
        schema: { type: string }
    post:
      summary: Stop a stream (admin)
      description: |
        The Now Playing "Stop" for every playback mode — direct play
        included. Audited as `transcode.stop` (reason `admin_terminated`).

        - A server session (transcode / remux) is torn down exactly like
          `DELETE /api/v1/transcode/sessions/{sid}`.
        - The viewer's notification stream receives an ignorable
          `playback.stop` event whose `data` is
          `{item_id, session_id?, client_name?, decision?, message?}`;
          the web player stops and shows "Playback was stopped by the
          server admin: <message>".
        - For direct play, direct stream and remux — modes a client can
          simply restart — the stopped (user, item, client IP) is refused
          for 2 minutes: `/media/stream/{id}`, transcode start and
          `playing` progress reports answer 403 `PLAYBACK_STOPPED`. The
          user's other devices and titles are unaffected. A transcode stop
          keeps its historical behaviour (teardown only).
      tags: [Sessions]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  maxLength: 200
                  description: Optional note shown to the viewer (control characters are flattened to spaces).
      responses:
        '204': { description: Stopped. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`STOP_UNSUPPORTED` — a direct-play entry recorded without a user (only during an upgrade); it ages out within a minute.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/playback/transfer:
    post:
      summary: Hand a playback state to another device
      description: |
        Cross-device "play on…" transfer — same shape as Plex's "Play
        on" / Emby's "Remote Control". The target client subscribes to
        the user's notifications stream and picks up a
        `playback.transfer` event with the item id + offset; the
        client then loads the item itself rather than the server
        proxying media. Per-user device discovery uses the last-seen
        client_name registry.
      tags: [Playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_client_name, item_id]
              properties:
                target_client_name: { type: string, description: 'Last-seen device label, e.g. "Living Room TV".' }
                item_id:             { type: string, format: uuid }
                position_ms:         { type: integer, format: int64, description: 'Where to resume; defaults to the user''s saved progress on the item.' }
      responses:
        '202': { description: 'Event dispatched to the target client over SSE.' }
        '404': { description: 'Target device not currently subscribed.' }

  /api/v1/photos/map:
    get:
      summary: Geo-tagged photo points within a bounding box
      description: |
        Powers the photo map view. Uses EXIF GPS extracted at scan
        time. Bounding box is required to keep the response bounded;
        clients pan / zoom by re-querying with a tighter box.
      tags: [Photos]
      parameters:
        - { in: query, name: library_id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: min_lat,    required: true, schema: { type: number, format: double } }
        - { in: query, name: max_lat,    required: true, schema: { type: number, format: double } }
        - { in: query, name: min_lon,    required: true, schema: { type: number, format: double } }
        - { in: query, name: max_lon,    required: true, schema: { type: number, format: double } }
        - { in: query, name: limit,      schema: { type: integer, default: 500, maximum: 2000 } }
      responses:
        '200':
          description: Photo points.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      points:
                        type: array
                        items:
                          type: object
                          properties:
                            id:        { type: string, format: uuid }
                            lat:       { type: number, format: double }
                            lon:       { type: number, format: double }
                            taken_at:  { type: string, format: date-time, nullable: true }
                            thumb_url: { type: string }
                      total: { type: integer }

  /api/v1/photos/memories:
    get:
      summary: Memories — photos from this day in earlier years
      description: |
        Groups the caller's photos (every photo library they can open, with
        their rating ceiling and label restriction) by past year: photos
        taken on this month-day become "N years ago today" (±1 day when the
        libraries hold under 2000 dated photos); a year with none that day
        but at least three within three days becomes "This week N years
        ago". Most recent year first, at most 10 groups, each with a cover
        (the photo with the most faces, else the middle one) and up to 30
        photos in time order, spread across the day rather than one burst.
        Matching uses the EXIF taken date in the server's time zone. An
        empty `groups` means nothing to show. Added in v2.6 (migration
        00057).
      tags: [Photos]
      parameters:
        - in: query
          name: date
          description: The viewer's local day; defaults to today on the server.
          schema: { type: string, format: date, example: '2026-10-14' }
      responses:
        '200':
          description: Memories.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      date: { type: string, format: date }
                      groups:
                        type: array
                        items:
                          type: object
                          properties:
                            kind:      { type: string, enum: [on_this_day, this_week] }
                            year:      { type: integer }
                            years_ago: { type: integer }
                            title:     { type: string, example: '3 years ago today' }
                            total:     { type: integer, description: Photos in the group before the 30-photo pick. }
                            cover:     { $ref: '#/components/schemas/MemoryPhoto' }
                            items:
                              type: array
                              items: { $ref: '#/components/schemas/MemoryPhoto' }
        '400': { description: date is not YYYY-MM-DD. }

  /api/v1/photos/people:
    get:
      summary: People named in a photo library
      description: |
        People with at least one photo the caller may see (library grant,
        rating ceiling, label restriction), most photos first, each with
        the largest visible face as `cover`. Faces come from the opt-in
        `face_detection` task; who is who is named by hand (no automatic
        matching). Added in v2.6 (migration 00057).
      tags: [Photos]
      parameters:
        - { in: query, name: library_id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: People.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PhotoPerson' }
        '404': { description: No access to the library. }

  /api/v1/photos/people/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      summary: One person
      description: 404 when none of their photos is visible to the caller (unless the caller may edit people).
      tags: [Photos]
      responses:
        '200':
          description: The person.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PhotoPerson' }
        '404': { description: Not found or not visible. }
    patch:
      summary: Rename a person
      description: Admins and unrestricted users with access to the library.
      tags: [Photos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
      responses:
        '200': { description: Renamed. }
        '403': { description: The caller may not edit people. }
        '409': { description: Another person in the library has this name. }
        '422': { description: Empty or invalid name. }
    delete:
      summary: Remove a person (their faces stay, unnamed)
      tags: [Photos]
      responses:
        '204': { description: Removed. }
        '403': { description: The caller may not edit people. }

  /api/v1/photos/people/{id}/items:
    get:
      summary: A person's photos the caller may see, newest first
      tags: [Photos]
      parameters:
        - { in: path,  name: id,     required: true, schema: { type: string, format: uuid } }
        - { in: query, name: limit,  schema: { type: integer, default: 100, maximum: 500 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        '200': { description: Photos, same shape as GET /api/v1/photos rows; meta.total is the visible count. }

  /api/v1/photos/people/{id}/suggestions:
    get:
      summary: Unnamed faces that may be this person
      description: |
        Unnamed faces on photos taken within twelve hours of one of the
        person's photos, photos with fewer faces first, then larger faces.
        A heuristic to narrow manual naming, not face matching.
      tags: [Photos]
      parameters:
        - { in: path,  name: id,    required: true, schema: { type: string, format: uuid } }
        - { in: query, name: limit, schema: { type: integer, default: 24, maximum: 100 } }
      responses:
        '200':
          description: Faces.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PhotoFaceThumb' }

  /api/v1/photos/faces:
    get:
      summary: Unnamed faces in a photo library
      tags: [Photos]
      parameters:
        - { in: query, name: library_id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: limit,      schema: { type: integer, default: 60, maximum: 200 } }
        - { in: query, name: offset,     schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Faces, larger and more confident first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PhotoFaceThumb' }

  /api/v1/photos/faces/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Name (or unname) a face
      description: |
        `{"name": "Alice"}` assigns the library's person called Alice,
        creating them if new (names are unique per library, case-
        insensitively). `{"person_id": "<uuid>"}` assigns an existing person
        of the same library. `{"person_id": null}` or `{"name": ""}`
        unnames the face. Admins and unrestricted users with access to the
        photo's library.
      tags: [Photos]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:      { type: string, nullable: true, maxLength: 100 }
                person_id: { type: string, format: uuid, nullable: true }
      responses:
        '200':
          description: The face.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PhotoFace' }
        '403': { description: The caller may not name faces. }
        '404': { description: Face not found, or its photo isn't visible. }
        '422': { description: Invalid name, or person_id is not a person of this library. }
    delete:
      summary: Remove a box that isn't a face
      tags: [Photos]
      responses:
        '204': { description: Removed. }
        '403': { description: The caller may not edit faces. }

  /api/v1/items/{id}/faces:
    get:
      summary: Face boxes on a photo
      description: Boxes are normalised to 0..1 of the upright photo. 404 when the photo isn't visible to the caller.
      tags: [Photos]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Faces, and whether the caller may name them.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      faces:
                        type: array
                        items: { $ref: '#/components/schemas/PhotoFace' }
                      can_edit: { type: boolean }

  /api/v1/libraries/{id}/photo-settings:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Photo-library options (admin)
      tags: [Photos]
      responses:
        '200':
          description: Options; defaults when never set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PhotoLibrarySettings' }
        '404': { description: Not a photo library. }
    put:
      summary: Set photo-library options (admin)
      description: |
        `raw_jpeg_pairing` (default true): a camera RAW and a JPEG (or other
        image) with the same name in the same folder are one photo showing
        the JPEG, with the RAW as a second file served by the original
        download. A change regroups the library on its next scan.
        Audit-logged.
      tags: [Photos]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhotoLibrarySettings' }
      responses:
        '200': { description: Saved. }
        '404': { description: Not a photo library. }

  /api/v1/admin/photos/face-data:
    delete:
      summary: Delete all face data (admin)
      description: |
        Deletes every face, person and face-detection record in one photo
        library (`library_id`) or in all of them. Audit-logged. With the
        `face_detection` task still enabled, photos are detected again on
        its next run.
      tags: [Photos]
      parameters:
        - { in: query, name: library_id, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Counts deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      faces:  { type: integer }
                      people: { type: integer }
                      scans:  { type: integer }

  # ── Collections ────────────────────────────────────────────────────────────
  /api/v1/collections:
    get:
      summary: List collections
      tags: [Collections]
      description: |
        The caller's own collections plus server-owned ones (auto-genre,
        franchise, manual). A `manual` collection (v2.6, admin-curated) is
        listed to a non-admin only when they can see at least one of its
        members (library grant and content-rating ceiling), with `item_count`
        (visible members) and a cover in `poster_path` taken from a visible
        member; admins see every one, empty ones included. `franchise` collections (TMDB collections the server
        holds at least two films of) are **opt-in**: they are returned only
        with `?include=franchise` (clients that render every collection as a
        home-screen row would otherwise be flooded). Even then they are
        listed only when the caller can see at least one of their items —
        library grant and content-rating ceiling both apply — and carry
        `tmdb_collection_id` and the TMDB collection `poster_url`.
        `GET /api/v1/libraries/{id}/collections` always returns franchises.
      parameters:
        - in: query
          name: include
          required: false
          description: |
            Comma-separated (or repeated) extra collection types to include.
            Currently only `franchise` is recognised; unknown values are
            ignored.
          schema: { type: string, example: franchise }
      responses:
        '200':
          description: Collections.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Collection' }
    post:
      summary: Create a collection
      tags: [Collections]
      description: |
        Without `type` (or with `playlist`) this creates the caller's own
        private playlist. `type: manual` (v2.6) creates a shared,
        admin-curated movie / TV collection — admins only (403 otherwise).
        A manual collection can be created smart (`rules`: its members are
        filled from them at once and kept in step by the hourly
        `smart_collections` task) and on the home screen (`promoted`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:        { type: string }
                description: { type: string }
                type:        { type: string, enum: [playlist, manual] }
                item_order:  { type: string, enum: [custom, release, title], description: 'Manual collections: how members are listed (default custom).' }
                promoted:    { type: boolean, description: 'Manual collections: on the home screen (hub collection_rows).' }
                rules:       { $ref: '#/components/schemas/CollectionRules' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Collection' }
        '400': { description: 'Missing name, an unknown type, an invalid item_order, or invalid rules.' }
        '403': { description: 'type manual by a non-admin.' }

  /api/v1/collections/{id}:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: Get a collection
      tags: [Collections]
      description: |
        For a `franchise` collection the response adds `parts`: every film
        of the TMDB collection in release order. A part the caller can see
        in the server carries its `item_id`; a part that isn't in the server
        (or isn't visible to the caller) has `item_id: null` plus the
        caller's own open request status for it (`request_status`: pending,
        approved or downloading; null when none). Missing parts are listed
        only for profiles without a content-rating ceiling — TMDB parts
        carry no certification, so they rank as unrated (most restrictive).
        A franchise collection with no item visible to the caller is a 404,
        and so is a manual collection for a non-admin who can see none of its
        members.
      responses:
        '200':
          description: Collection.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Collection' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update a collection
      tags: [Collections]
      description: |
        Fields left out keep their value (an empty name too). `item_order`,
        `poster_item_id`, `promoted` and `rules` apply to manual collections
        only (400 otherwise); `poster_item_id` must be a member, and an empty
        string goes back to the first member's poster. `rules` (v2.6) makes
        the collection smart and replaces its members with what the rules
        match; `rules: null` makes it hand-picked again, keeping its members.
        A smart collection's members can't be added, removed or reordered by
        hand (400).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:           { type: string }
                description:    { type: string }
                item_order:     { type: string, enum: [custom, release, title] }
                poster_item_id: { type: string, description: 'A member item id, or empty to clear.' }
                promoted:       { type: boolean }
                rules:
                  allOf: [{ $ref: '#/components/schemas/CollectionRules' }]
                  nullable: true
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Collection' }
        '409': { description: 'MANAGED_COLLECTION: franchise collections are maintained from TMDB and cannot be edited (DELETE and the item add/remove routes answer the same).' }
    delete:
      summary: Delete a collection
      tags: [Collections]
      responses:
        '204': { description: Deleted. }
        '409': { description: 'MANAGED_COLLECTION: franchise collections cannot be deleted.' }

  /api/v1/libraries/{id}/collections:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: Franchise and manual collections with visible items in a library
      tags: [Collections]
      description: |
        Backs the library page's Collections tab. Returns the franchise and
        manual collections that have at least one item in this library
        visible to the caller (content-rating ceiling applied), with that
        visible `item_count`, by name. `poster_url` is the TMDB collection
        poster when known; `poster_path` (artwork path) is the cover from a
        visible member (a manual collection's chosen cover when visible).
        404 when the caller has no grant on the library.
      responses:
        '200':
          description: Collections.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:                 { type: string, format: uuid }
                        name:               { type: string }
                        type:               { type: string, enum: [franchise, manual] }
                        tmdb_collection_id: { type: integer }
                        poster_url:         { type: string }
                        poster_path:        { type: string }
                        item_count:         { type: integer, format: int64 }
                        poster_version:     { type: integer, format: int64, description: 'v2.6: a manual collection''s uploaded cover (see Collection.poster_version).' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/collections/{id}/items:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: List items in a collection
      tags: [Collections]
      description: |
        A manual collection lists its members in its `item_order`: custom
        (the stored order), release (oldest first) or title.
      responses:
        '200':
          description: Items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CollectionItem' }
    post:
      summary: Add an item to a collection
      tags: [Collections]
      description: |
        Manual collections also take `media_item_ids`, up to 500 movies and
        shows in one request. Every item must exist and be visible to the
        caller (404 otherwise) and be a movie or show (400 otherwise);
        nothing is added unless all pass. Items already in the collection
        stay where they are. A smart collection refuses hand adds (400).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                media_item_id:  { type: string, format: uuid }
                media_item_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        '204': { description: Added. }
        '400': { description: 'A malformed or repeated id, an empty or oversized batch, or (manual collections) an item that is not a movie or show.' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/collections/{id}/items/order:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    put:
      summary: Reorder a manual collection
      tags: [Collections]
      description: |
        v2.6. The members in their new custom order (positions 0..N-1);
        members left out keep their position. Manual collections only
        (playlists use /playlists/{id}/items/order).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_ids]
              properties:
                item_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        '204': { description: Reordered. }
        '400': { description: 'Not a manual collection, a smart one, or a malformed / repeated id.' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'MANAGED_COLLECTION: a franchise collection.' }

  /api/v1/collections/{id}/poster:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: A manual collection's uploaded cover
      tags: [Collections]
      description: |
        v2.6. The JPEG an admin uploaded. Accepts `?token=` (asset token) as
        well as the Authorization header, so an `<img>` can load it. Served to
        admins and to anyone who can see one of the collection's members
        (404 otherwise, and when there is no uploaded cover). Clients add
        `?v=<poster_version>` so a new cover isn't served from cache.
      responses:
        '200':
          description: The cover.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
        '304': { description: Not modified (If-None-Match). }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Upload a manual collection's cover
      tags: [Collections]
      description: |
        v2.6, admins only. The image as the raw request body (typed by its
        Content-Type) or as the multipart field `poster`; JPEG, PNG, GIF or
        WebP, at most 1 MB (the API's body limit — scale a photo down
        first). It is re-encoded as a JPEG of at most 1000×1500, which is all
        that is stored. It wins over `poster_item_id` until deleted.
      requestBody:
        required: true
        content:
          image/*: { schema: { type: string, format: binary } }
          multipart/form-data:
            schema:
              type: object
              properties:
                poster: { type: string, format: binary }
      responses:
        '200':
          description: The collection, with its new `poster_version`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Collection' }
        '400': { description: 'Not a manual collection, or not an image the server can read.' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: 'PAYLOAD_TOO_LARGE: over 1 MB.' }
    delete:
      summary: Remove a manual collection's uploaded cover
      tags: [Collections]
      description: v2.6, admins only. Back to the chosen (or first) member's poster.
      responses:
        '204': { description: Removed. }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/collections/{id}/items/{itemId}:
    parameters:
      - { $ref: '#/components/parameters/UUID' }
      - { in: path, name: itemId, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Remove an item from a collection
      tags: [Collections]
      responses:
        '204': { description: Removed. }
        '400': { description: 'A smart collection (its members follow its rules).' }

  # ── Playlists ──────────────────────────────────────────────────────────────
  /api/v1/playlists:
    get:
      summary: List the caller's playlists
      tags: [Playlists]
      responses:
        '200':
          description: Playlists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Playlist' }
    post:
      summary: Create a playlist
      tags: [Playlists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:    { type: string }
                summary: { type: string }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Playlist' }

  /api/v1/playlists/{id}:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    patch:
      summary: Update a playlist
      tags: [Playlists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:    { type: string }
                summary: { type: string }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Playlist' }
    delete:
      summary: Delete a playlist
      tags: [Playlists]
      responses:
        '204': { description: Deleted. }

  /api/v1/playlists/{id}/items:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: List items in a playlist
      tags: [Playlists]
      responses:
        '200':
          description: Items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PlaylistItem' }
    post:
      summary: Append an item to a playlist
      tags: [Playlists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_id]
              properties:
                item_id: { type: string, format: uuid }
      responses:
        '204': { description: Added. }

  /api/v1/playlists/{id}/items/{itemId}:
    parameters:
      - { $ref: '#/components/parameters/UUID' }
      - { in: path, name: itemId, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Remove an item from a playlist
      tags: [Playlists]
      responses:
        '204': { description: Removed. }

  /api/v1/playlists/{id}/items/order:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    put:
      summary: Reorder playlist items
      tags: [Playlists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_ids]
              properties:
                item_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '204': { description: Reordered. }

  /api/v1/playlists/{id}/export.m3u8:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: Export a playlist as extended M3U
      tags: [Playlists]
      description: |
        The playlist (static or smart) as an `.m3u8` attachment: `#EXTM3U`,
        then `#EXTINF:<seconds>,<artist> - <title>` and a path per item.
        Paths are relative to the item's library root (forward slashes) by
        default, or the server's absolute paths with `?paths=absolute`.
        Items the caller can't see (library access, rating ceiling, label
        restriction) and items without a file are left out. Own playlists
        only (404 otherwise). v2.6.
      parameters:
        - { in: query, name: paths, required: false, schema: { type: string, enum: [relative, absolute], default: relative } }
      responses:
        '200':
          description: The playlist.
          content:
            audio/x-mpegurl:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/playlists/import:
    post:
      summary: Create a playlist from an M3U file
      tags: [Playlists]
      description: |
        Multipart upload of an `.m3u` (UTF-8 or Latin-1) or `.m3u8` (UTF-8)
        playlist, at most 1 MB and 10,000 entries (413
        `PLAYLIST_TOO_LARGE`). Creates a static playlist owned by the caller
        from the entries that match an item the caller can see, trying in
        order: the exact absolute path; the path relative to `base_dir` or a
        library root; the same file name and parent folders under another
        mount point (case-insensitive, either slash); the `#EXTINF` artist
        and title against tracks. Entries are only matched as strings —
        never opened or fetched — so an `http(s)://` entry is reported
        unmatched with reason `url`. A file listed twice is added once.
        v2.6.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:     { type: string, format: binary, description: The .m3u / .m3u8 file. }
                name:     { type: string, description: Playlist name; defaults to the file name. }
                base_dir: { type: string, description: The server directory the playlist came from, for its relative entries. }
      responses:
        '201':
          description: The new playlist and how each line was matched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/M3UImportResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { description: File over 1 MB or over 10,000 entries (`PLAYLIST_TOO_LARGE`). }

  # ── Users / profile ────────────────────────────────────────────────────────
  /api/v1/users/me/password:
    put:
      summary: Change the caller's password
      tags: [Users]
      description: |
        Checks the current password, stores the new one and ends every OTHER
        sign-in of the account: their sessions are deleted and the session
        epoch is bumped, so their access and asset tokens stop working. This
        sign-in stays; its access token is refreshed on the next request. A
        token without a session id (from an old sign-in) ends every session,
        this one included (`signed_out: true`). Not accepted with an API key
        or from a PIN-switched session (403 `PIN_SESSION_FORBIDDEN`). Since
        v2.6.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 12, description: Must differ from the current password. }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      other_sessions_revoked: { type: integer }
                      signed_out: { type: boolean, description: True when this sign-in ended too. }
        '400': { description: Missing current password, new password too short, or unchanged. }
        '403': { description: '`INVALID_CREDENTIALS` (wrong current password) or `PIN_SESSION_FORBIDDEN`.' }
        '409': { description: '`NO_LOCAL_PASSWORD`: the account signs in through SSO / LDAP or is a managed profile.' }
        '429': { description: '`RATE_LIMITED`: five wrong current passwords in 15 minutes.' }

  /api/v1/users/me/preferences:
    get:
      summary: Get caller preferences
      tags: [Users]
      description: |
        Also reports *(v2.6)* `has_password`: whether the
        account signs in with an OnScreen password (false for SSO / LDAP-only
        accounts and managed profiles), i.e. whether
        `PUT /users/me/password` can work.
      responses:
        '200':
          description: Preferences.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Preferences' }
    put:
      summary: Replace caller preferences
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Preferences' }
      responses:
        '204': { description: Saved. }

  /api/v1/users/me/quality-profile:
    put:
      summary: Replace the caller's quality profile
      tags: [Users]
      description: |
        The viewer's own playback limits, read back through `GET
        /users/me/preferences`. Replaces the whole profile: a null or
        omitted field clears that limit. Since v2.6 the server applies it
        on every device and network — the play decision and transcode
        start treat the resolution as a display limit (a 16:9 box) and
        transcode a video over `max_video_bitrate_kbps` or an audio-only
        file over `max_audio_bitrate_kbps`; every transcode's AAC bitrate
        is held to `max_audio_bitrate_kbps`, and `preferred_video_codec`
        picks a transcode's output codec where the client decodes it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                max_video_bitrate_kbps: { type: integer, nullable: true, minimum: 200 }
                max_audio_bitrate_kbps: { type: integer, nullable: true, minimum: 32 }
                max_video_height: { type: integer, nullable: true, minimum: 144 }
                preferred_video_codec: { type: string, nullable: true, enum: [h264, hevc] }
                forced_subtitles_only: { type: boolean }
      responses:
        '204': { description: Saved. }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/users/me/sessions:
    get:
      summary: Caller's signed-in devices
      tags: [Users]
      description: |
        One row per sign-in (refresh session) that can still refresh: the
        device label recorded at sign-in (the optional `X-Device-Name`
        request header, else derived from the User-Agent), the trusted
        client IP of its latest sign-in or refresh, and `current: true`
        on the caller's own. `last_seen_at` is approximate — it moves on
        sign-in and on each token refresh (about hourly while a device is
        in use), not per request. PIN-switched profile tokens have no
        session of their own and don't appear. v2.6.
      responses:
        '200':
          description: Sessions, most recently used first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SignedInSession' }
    delete:
      summary: Sign out everywhere else
      tags: [Users]
      description: |
        Revokes every sign-in of the caller except the one making the
        request. Their refresh tokens stop working at once, and their
        access / asset / stream tokens are rejected on their next request
        (tokens carry their sign-in's ID; tokens minted before v2.6 lapse
        at their own expiry). 409 `CURRENT_SESSION_UNKNOWN` when the
        caller's token doesn't name its sign-in (minted before v2.6 or a
        PIN-switch token) — refresh and retry. Audited as
        `auth.sessions_revoked` (reason `user_signed_out_others`).
      responses:
        '200':
          description: How many sign-ins were revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      revoked: { type: integer }
        '409':
          description: The caller's current sign-in can't be identified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/users/me/sessions/{id}:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    delete:
      summary: Sign one device out
      tags: [Users]
      description: |
        Revokes one of the caller's sign-ins. Other devices are not
        affected (no session-epoch bump). Revoking the caller's own
        current sign-in is a sign-out: the auth cookies are cleared in the
        response. A session ID that isn't the caller's is a 404. HLS
        segment tokens are per user, not per sign-in, so a transcode
        already streaming to the revoked device runs until it goes idle.
        Audited as `auth.session_revoked`.
      responses:
        '204': { description: Revoked. }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/users/me/api-keys:
    get:
      summary: Caller's personal API keys
      tags: [Users]
      description: |
        The caller's keys, newest first. The key itself is never returned
        after creation; `prefix` is its first characters. Requires a signed-in
        session — an API key can't list, create or delete keys (403
        `API_KEY_NOT_ALLOWED`). v2.6.
      responses:
        '200':
          description: Keys.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/APIKey' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a personal API key
      tags: [Users]
      description: |
        Creates a key and returns it once, in `key` (`osk_` + 43 base62
        characters). Only its SHA-256 is stored. `scope` defaults to `full`;
        `expires_at` is optional and must be in the future. At most 50 keys
        per user (409 `API_KEY_LIMIT`). Audited as `api_key.create`. v2.6.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:       { type: string, maxLength: 100 }
                scope:      { type: string, enum: [full, read_only], default: full }
                expires_at: { type: string, format: date-time, nullable: true }
      responses:
        '201':
          description: The new key, with the secret shown this once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CreatedAPIKey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/users/me/api-keys/{id}:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    delete:
      summary: Revoke one of the caller's API keys
      tags: [Users]
      description: |
        The key stops working on its next request, on every server instance
        (keys are looked up per request, not cached), and so do the stream
        tokens requests made with it were handed. Another user's key id is a
        404. Audited as `api_key.delete`. v2.6.
      responses:
        '204': { description: Revoked. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/users/me/export:
    post:
      summary: Download my data
      tags: [Users]
      description: |
        A ZIP (streamed as an attachment) of JSON files plus a README.txt:
        profile and preferences, signed-in devices (no token material), API
        keys (name, prefix, dates — never the key or its hash), scrobble
        link status (no tokens), watch history (newest 100,000 play
        events), watch progress and marks, watch-status lists, ratings,
        favorites, reading progress, audiobook speeds and bookmarks,
        playlists and other owned collections (with items), requests,
        reported issues and the in-app notification inbox. Items carry
        title and external ids (TMDB, TVDB, IMDb, MusicBrainz, AniList); an
        item the caller can't see now is written as its id with
        `unavailable: true`. Requires a signed-in session: API keys are
        refused (403 `API_KEY_NOT_ALLOWED`). Rate-limited to 5 a minute.
        Audited as `user.data_export`. v2.6.
      responses:
        '200':
          description: The archive.
          content:
            application/zip:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/users/{id}/export:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    post:
      summary: Download a user's data (admin)
      tags: [Users]
      description: |
        `POST /users/me/export` for any user, for answering a data request.
        Admin only; API keys refused. Audited as `user.data_export` with
        `by_admin: true`. 404 for an unknown user. v2.6.
      responses:
        '200':
          description: The archive.
          content:
            application/zip:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/api-keys:
    get:
      summary: Every user's API keys (admin)
      tags: [Users]
      description: Same rows as `GET /users/me/api-keys`, plus `user_id` and `username`. v2.6.
      responses:
        '200':
          description: Keys, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/APIKey' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/api-keys/{id}:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    delete:
      summary: Revoke any user's API key (admin)
      tags: [Users]
      description: Audited as `api_key.delete` with `by_admin`. v2.6.
      responses:
        '204': { description: Revoked. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/items/{id}/reading-progress:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: Caller's reading position in an ebook
      tags: [Items]
      description: |
        Where the caller is in a book (EPUB, CBZ, CBR, PDF), synced across
        their devices. `data` is null when nothing is saved. The item must be
        a book the caller can see (library access, rating ceiling, label
        restriction), else 404. Audiobooks use playback progress instead. v2.6.
      responses:
        '200':
          description: The saved position, or null.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf: [{ $ref: '#/components/schemas/ReadingProgress' }]
                    nullable: true
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Save the caller's reading position
      tags: [Items]
      description: |
        The newest position wins, by the client's `updated_at` (omitted =
        now; a time ahead of the server's clock is clamped to it), so a device
        flushing a stale position late can't rewind a newer one. The response
        is the position the server now holds; `applied: false` means a newer
        one was kept. Progression 0.98 or more marks the book read (the same
        mark as `POST /items/{id}/watched`). v2.6.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locator, progression]
              properties:
                locator:     { type: string, maxLength: 4096, description: 'Opaque to the server: an EPUB CFI, or a page number.' }
                progression: { type: number, minimum: 0, maximum: 1 }
                device_name: { type: string, maxLength: 100 }
                updated_at:  { type: string, format: date-time }
      responses:
        '200':
          description: The stored position.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ReadingProgress' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/settings/subtitle-auto-download:
    get:
      summary: Automatic subtitle download setting (admin)
      tags: [Settings]
      description: |
        The server-wide setting for the `subtitle_auto_download` task, which
        downloads subtitles from OpenSubtitles for movies and episodes that
        have none in a wanted language. Off by default. v2.6.
      responses:
        '200':
          description: The setting.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SubtitleAutoSettings' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      summary: Update the automatic subtitle download setting (admin)
      tags: [Settings]
      description: Every field optional; an omitted one keeps its value. Audited as `settings.update`. v2.6.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:           { type: boolean }
                languages:         { type: string, example: 'en,es' }
                prefer_hash_match: { type: boolean }
                hearing_impaired:  { type: string, enum: [prefer, avoid, any] }
      responses:
        '200':
          description: The saved setting.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SubtitleAutoSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/libraries/{id}/subtitle-auto-download:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: A library's automatic subtitle download override (admin)
      tags: [Libraries]
      description: '`null` fields follow the server-wide setting. v2.6.'
      responses:
        '200':
          description: The override.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LibrarySubtitleAuto' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      summary: Set a library's automatic subtitle download override (admin)
      tags: [Libraries]
      description: Both fields null removes the override. 404 for an unknown library. v2.6.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:   { type: boolean, nullable: true }
                languages: { type: string, nullable: true }
      responses:
        '200':
          description: The override.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LibrarySubtitleAuto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/users/me/scrobble:
    get:
      summary: Caller's scrobble links
      description: |
        What the caller has linked for external scrobbling. No credential is
        ever returned. `*_available` says whether the admin has entered that
        service's API credentials (Settings), i.e. whether the caller can link
        it at all. The Last.fm / Trakt fields are v2.5 (absent before).

        Plays are exported server-side from watch events, so a link made on
        any client covers plays on every client: ListenBrainz and Last.fm get
        music (a listen counts past half the track or 4 minutes, and the
        playing track shows as "now playing"); Trakt gets movies and episodes
        (start / pause / stop; Trakt records a stop at 80%+ as watched).
      tags: [Scrobbling]
      responses:
        '200':
          description: Link status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      listenbrainz_linked: { type: boolean }
                      listenbrainz_enabled: { type: boolean }
                      lastfm_available: { type: boolean }
                      lastfm_linked: { type: boolean }
                      lastfm_username: { type: string }
                      trakt_available: { type: boolean }
                      trakt_linked: { type: boolean }
                      trakt_username: { type: string }

  /api/v1/users/me/scrobble/listenbrainz:
    put:
      summary: Link or unlink ListenBrainz
      description: Stores the caller's ListenBrainz user token (encrypted). An empty token unlinks.
      tags: [Scrobbling]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                enabled: { type: boolean }
      responses:
        '204': { description: Saved. }

  /api/v1/users/me/scrobble/lastfm/link:
    post:
      summary: Start linking Last.fm
      description: |
        Starts Last.fm's token handshake. The client shows `auth_url` for the
        user to approve OnScreen on last.fm, then polls
        `.../lastfm/link/complete` with `pending` (every few seconds). No
        callback URL is involved, so this works for a server that isn't
        reachable from the internet. `pending` is opaque: sealed by the
        server and bound to the caller. Rate-limited per session with the
        other link calls.
      tags: [Scrobbling]
      responses:
        '200':
          description: Approval URL and pending handle.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      auth_url: { type: string }
                      pending: { type: string }
        '409': { description: 'SCROBBLE_NOT_CONFIGURED: no Last.fm API account on this server.' }
        '502': { description: 'SCROBBLE_APP_REJECTED: Last.fm refused the API account; SCROBBLE_UPSTREAM: Last.fm could not be reached.' }

  /api/v1/users/me/scrobble/lastfm/link/complete:
    post:
      summary: Finish linking Last.fm (poll)
      tags: [Scrobbling]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScrobbleLinkComplete' }
      responses:
        '200':
          description: '`pending` until approved, then `linked` (with username); `expired` means start over.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ScrobbleLinkResult' }
        '400': { description: Missing or invalid pending handle. }
        '409': { description: 'SCROBBLE_NOT_CONFIGURED' }
        '502': { description: 'SCROBBLE_APP_REJECTED or SCROBBLE_UPSTREAM' }

  /api/v1/users/me/scrobble/lastfm:
    delete:
      summary: Unlink Last.fm
      description: Forgets the caller's Last.fm session. Last.fm has no revoke call; the user can also remove OnScreen from their Last.fm settings.
      tags: [Scrobbling]
      responses:
        '204': { description: Unlinked. }

  /api/v1/users/me/scrobble/trakt/link:
    post:
      summary: Start linking Trakt
      description: |
        Starts Trakt's device-code flow. The user enters `user_code` at
        `verification_url` on any device; the client polls
        `.../trakt/link/complete` with `pending` every `interval` seconds for
        up to `expires_in` seconds.
      tags: [Scrobbling]
      responses:
        '200':
          description: Device code and pending handle.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user_code: { type: string }
                      verification_url: { type: string }
                      expires_in: { type: integer }
                      interval: { type: integer }
                      pending: { type: string }
        '409': { description: 'SCROBBLE_NOT_CONFIGURED: no Trakt app on this server.' }
        '502': { description: 'SCROBBLE_APP_REJECTED: Trakt refused the app credentials; SCROBBLE_UPSTREAM: Trakt could not be reached.' }

  /api/v1/users/me/scrobble/trakt/link/complete:
    post:
      summary: Finish linking Trakt (poll)
      tags: [Scrobbling]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScrobbleLinkComplete' }
      responses:
        '200':
          description: '`pending` / `slow_down` (poll less often) until settled: `linked`, `expired` or `denied`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ScrobbleLinkResult' }
        '400': { description: Missing or invalid pending handle. }
        '409': { description: 'SCROBBLE_NOT_CONFIGURED' }
        '502': { description: 'SCROBBLE_APP_REJECTED or SCROBBLE_UPSTREAM' }

  /api/v1/users/me/scrobble/trakt:
    delete:
      summary: Unlink Trakt
      description: Revokes the caller's token with Trakt (best-effort) and forgets it.
      tags: [Scrobbling]
      responses:
        '204': { description: Unlinked. }

  /api/v1/users/switchable:
    get:
      summary: List local users the caller can switch into via PIN
      tags: [Users]
      responses:
        '200':
          description: Switchable users.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/UserInfo' }

  /api/v1/users:
    get:
      summary: List all users (admin)
      tags: [Users]
      responses:
        '200':
          description: Users.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/UserInfo' }

  /api/v1/users/{id}:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    delete:
      summary: Delete a user (admin)
      tags: [Users]
      responses:
        '204': { description: Deleted. }
    patch:
      summary: Set admin flag (admin)
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_admin]
              properties:
                is_admin: { type: boolean }
      responses:
        '204': { description: Updated. }

  /api/v1/users/{id}/request-permissions:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    put:
      summary: Set a user's media-request policy (admin)
      description: >
        Per-type auto-approval, the can-request switch and per-type request
        quotas. Every field is optional but at least one is required; an omitted
        field keeps its stored value. The auto-approve toggles are stored as
        given, but inert while the user has a content-rating ceiling (their
        requests always go to the admin queue); admins' own requests are always
        auto-approved and never blocked or limited. A quota is the number of
        requests of that type allowed per rolling window (server setting
        requests.quota_window_days); null resets it to the server default
        (requests.quota_movies / quota_tv), 0 means unlimited. Past the quota a
        request is still created but always waits for an admin. Audited as
        user.request_permissions_change with the fields that were set.
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                auto_approve_movies: { type: boolean }
                auto_approve_tv: { type: boolean }
                can_request: { type: boolean, description: 'false = the user''s new requests are refused (403 REQUESTS_DISABLED).' }
                quota_movies: { type: integer, minimum: 0, maximum: 1000, nullable: true, description: 'null = server default, 0 = unlimited.' }
                quota_tv: { type: integer, minimum: 0, maximum: 1000, nullable: true, description: 'null = server default, 0 = unlimited.' }
      responses:
        '204': { description: Updated. }
        '400': { description: Malformed body or unknown field. }
        '404': { description: No such user. }
        '422': { description: No fields given, a null toggle, or a quota out of range. }

  /api/v1/upcoming:
    get:
      summary: Upcoming releases from Radarr/Sonarr calendars
      description: >
        Movie releases (cinema/digital/physical) and episode air times from every
        enabled *arr service, filtered for the caller: entries above a restricted
        profile's content-rating ceiling (unrated = most restrictive) are omitted,
        and a non-admin sees only entries whose *arr folder (after
        arr_path_mappings) lies in a library they have a grant on — an entry no
        library claims is hidden too. Admins see everything. Cached server-side
        for up to 5 minutes.
      tags: [Requests]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date }, description: 'Default today (UTC).' }
        - { name: to, in: query, schema: { type: string, format: date }, description: 'Default from + 30 days; span at most 62 days.' }
      responses:
        '200':
          description: Upcoming entries, sorted by date, plus per-service status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      from: { type: string, format: date }
                      to: { type: string, format: date }
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            kind: { type: string, enum: [movie, episode] }
                            title: { type: string }
                            subtitle: { type: string }
                            release_type: { type: string, enum: [cinema, digital, physical, airing] }
                            date: { type: string, format: date-time }
                            all_day: { type: boolean }
                            status: { type: string, enum: [downloaded, missing, upcoming] }
                            poster_url: { type: string, nullable: true }
                            year: { type: integer, nullable: true }
                            overview: { type: string }
                            certification: { type: string }
                            network: { type: string }
                            service: { type: string }
                            item_id: { type: string, format: uuid, nullable: true }
                      services:
                        type: array
                        items:
                          type: object
                          properties:
                            name: { type: string }
                            kind: { type: string, enum: [radarr, sonarr] }
                            ok: { type: boolean }
                            error: { type: string }
        '400': { description: Invalid or too wide a date range. }

  /api/v1/users/{id}/sessions:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: A user's signed-in devices (admin)
      tags: [Users]
      description: Same rows as `GET /users/me/sessions`; `current` marks the admin's own sign-in when they list themselves. v2.6.
      responses:
        '200':
          description: Sessions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SignedInSession' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      summary: Sign a user out everywhere (admin)
      tags: [Users]
      description: |
        The full wipe a password reset does: every sign-in deleted, the
        session epoch bumped (all outstanding tokens die), HLS segment
        tokens revoked. Audited as `auth.sessions_revoked` (reason
        `admin_signed_out_all`). v2.6.
      responses:
        '204': { description: Signed out. }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/users/{id}/sessions/{sid}:
    parameters:
      - { $ref: '#/components/parameters/UUID' }
      - { name: sid, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Sign one of a user's devices out (admin)
      tags: [Users]
      description: As `DELETE /users/me/sessions/{id}`, for any user. Audited as `auth.session_revoked` with `by_admin`. v2.6.
      responses:
        '204': { description: Revoked. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/users/{id}/streaming-limits:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: A user's streaming caps (admin)
      tags: [Users]
      responses:
        '200':
          description: The caps; null = no cap.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/StreamingLimits' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      summary: Set a user's streaming caps (admin)
      tags: [Users]
      description: |
        Admin-enforced ceilings, read at each play decision / transcode
        start (no re-login needed). `max_concurrent_streams` and
        `max_stream_bitrate_kbps` are replaced as sent (null / absent =
        no cap). `max_remote_stream_bitrate_kbps` (v2.6) is optional:
        absent keeps the stored value, null clears it. Unknown fields
        are a 400. Audited as `user.streaming_limits_change`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StreamingLimits' }
      responses:
        '204': { description: Saved. }
        '400':
          description: Negative cap or unknown field.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/users/{id}/password:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    put:
      summary: Reset another user's password (admin)
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password, minLength: 8 }
      responses:
        '204': { description: Reset. }

  /api/v1/users/{id}/content-rating:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    put:
      summary: Set max content rating for a user (admin)
      tags: [Users]
      description: |
        The ceiling is enforced server-side on every user-facing
        aggregation surface (`/api/v1/hub` including the trending
        row, `/api/v1/search`, `/collections/{id}/items`,
        `/items/{id}/children`, `/history`). Items above the
        ceiling are filtered out at the SQL layer, not just hidden
        in the UI. Setting the ceiling on the user takes effect on
        their NEXT login — the value is baked into the access-token
        claims at issuance.

        Field name is **`max_content_rating`** (not
        `content_rating`). Unknown fields return HTTP 400
        (DisallowUnknownFields) — without that, a wrong key would
        decode into `null` and silently CLEAR the ceiling, which
        looked like a successful set from the caller's perspective.

        Rank ordering (lower is more restrictive): G/TV-Y/TV-G=0,
        PG/TV-Y7/TV-PG=1, PG-13/TV-14=2, R/NC-17/TV-MA=3, NR/empty=4.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                max_content_rating:
                  type: string
                  nullable: true
                  description: |
                    e.g. "PG-13", "TV-MA", "" or null to clear the
                    ceiling (user sees everything). Omit the field
                    entirely to leave the current value untouched.
      responses:
        '204': { description: Set. }
        '400':
          description: 'Invalid body or unknown field (e.g. "content_rating" instead of "max_content_rating").'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/users/{id}/label-restrictions:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    put:
      summary: Set a user's label restriction (admin)
      tags: [Users]
      description: |
        *(v2.6)* Per-user label filters (Plex's label restrictions,
        Jellyfin's blocked / allowed tags). `blocked_labels`: the user
        never sees an item carrying one of these labels. `allowed_labels`:
        when non-empty, the user sees ONLY items carrying at least one of
        them. An item's labels are its own plus its ancestors' — labelling
        a show covers its seasons and episodes, an artist or album its
        tracks; a label on one episode affects that episode alone. Matched
        against admin labels only (PUT /api/v1/items/{id}/labels), never
        provider keywords, so a metadata refresh can't change who sees what.

        Enforced everywhere the content-rating ceiling is, with the same
        response: refused single items look exactly like over-ceiling ones,
        and listings, counts and search filter in SQL.

        An omitted list keeps its stored value; `[]` clears it. Labels are
        lower-cased and whitespace-collapsed; at most 32 per list, 64
        characters each. Applies to the user and every managed profile
        beneath it, and signs them all out (session epoch bump, as for a
        rating change) so the change takes effect immediately. Unknown
        fields return 400. Audited as user.label_restriction_change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                blocked_labels: { type: array, items: { type: string } }
                allowed_labels: { type: array, items: { type: string } }
      responses:
        '200':
          description: The stored lists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      blocked_labels: { type: array, items: { type: string } }
                      allowed_labels: { type: array, items: { type: string } }
        '400': { description: Malformed body or unknown field. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No such user. }
        '422': { description: A label too long, a control character, or too many labels. }

  /api/v1/labels:
    get:
      summary: Labels in use (admin)
      tags: [Items]
      description: >
        *(v2.6)* Every admin label on a live item with how many items carry
        it, alphabetical — for autocomplete.
      responses:
        '200':
          description: Labels.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        label:      { type: string }
                        item_count: { type: integer, format: int64 }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/labels/apply:
    post:
      summary: Add / remove labels on many items (admin)
      tags: [Items]
      description: >
        *(v2.6)* Bulk label edit for a library selection. Removes first, then
        adds, so a label in both lists ends up present. At most 500 item ids
        (no duplicates). Labels are normalised as for PUT
        /api/v1/items/{id}/labels; an item the add would push past 50 labels
        is left without the added ones. Responds with how many items each
        step changed. Audited as item.labels_change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_ids]
              additionalProperties: false
              properties:
                item_ids: { type: array, maxItems: 500, items: { type: string, format: uuid } }
                add:      { type: array, items: { type: string } }
                remove:   { type: array, items: { type: string } }
      responses:
        '200':
          description: Items changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      added:   { type: integer, format: int64 }
                      removed: { type: integer, format: int64 }
        '400': { description: 'No ids, too many, a malformed / duplicate id, unknown field, or nothing to add or remove.' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: A label too long or containing a control character. }

  /api/v1/items/{id}/labels:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: An item's own labels (admin)
      tags: [Items]
      description: '*(v2.6)* The item''s own labels, not those it inherits.'
      responses:
        '200':
          description: Labels.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      labels: { type: array, items: { type: string } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No such item. }
    put:
      summary: Replace an item's labels (admin)
      tags: [Items]
      description: >
        *(v2.6)* Labels are admin-owned (never written by scans or metadata
        refreshes) and are what per-user label restrictions match. Values are
        lower-cased and whitespace-collapsed, de-duplicated and sorted; at
        most 50, 64 characters each. Audited as item.labels_change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                labels: { type: array, items: { type: string } }
      responses:
        '200':
          description: The stored labels.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      labels: { type: array, items: { type: string } }
        '400': { description: Malformed body or unknown field. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: No such item. }
        '422': { description: A label too long, a control character, or too many labels. }

  /api/v1/users/{id}/libraries:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: List libraries a user can access (admin)
      tags: [Users]
      responses:
        '200':
          description: Library IDs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: string, format: uuid }
    put:
      summary: Set the libraries a user can access (admin)
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [library_ids]
              properties:
                library_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '204': { description: Set. }

  /api/v1/profiles:
    get:
      summary: List managed profiles owned by the caller
      tags: [Users]
      responses:
        '200':
          description: Profiles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ManagedProfile' }
    post:
      summary: Create a managed profile
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ManagedProfile' }

  /api/v1/profiles/{id}:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    patch:
      summary: Update a managed profile
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ManagedProfile' }
    delete:
      summary: Delete a managed profile
      tags: [Users]
      responses:
        '204': { description: Deleted. }

  /api/v1/profiles/{id}/library-inherit:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    put:
      summary: Toggle a managed profile's library inheritance flag (v2.1)
      description: |
        Sets `inherit_library_access` on the profile. When true, the
        profile sees the parent owner's library grants. When false, it
        uses its own `library_access` rows — admins then call
        `PUT /api/v1/users/{id}/libraries` to set the explicit set.

        Auth: parent owner OR admin. The SQL gates by `parent_user_id`
        when the caller isn't admin and returns 0 rows on a mismatch,
        which the handler maps to 404 to avoid leaking profile IDs.
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inherit]
              properties:
                inherit: { type: boolean }
      responses:
        '204': { description: Flag updated. }
        '404': { description: Profile not owned by caller (or not a managed profile). }

  # ── Settings (admin) ───────────────────────────────────────────────────────
  /api/v1/settings:
    get:
      summary: Get server settings (admin)
      description: |
        Returns every server-wide setting in one envelope. Secret-bearing
        fields (tmdb_api_key, opensubtitles password, OIDC client_secret,
        SAML SP private key, SMTP password, Last.fm shared_secret, Trakt
        client_secret) are masked as `****` when set
        and empty when unset; the patcher below echoes back masked values
        unchanged so partial updates don't clobber stored secrets.

        Documented fields (additive — v2.x may add more):
          - `tmdb_api_key`, `tvdb_api_key`, `arr_api_key` (masked)
          - `omdb_api_key` *(v2.6, masked)* — the OMDb key the hourly
            `external_ratings` task uses for IMDb, Rotten Tomatoes and
            Metacritic scores (`ItemDetail.external_ratings`)
          - `omdb_daily_limit` *(v2.6)* — lookups the key allows a day
            (1–1000000, default 1000); the task never exceeds it in any
            24 hours. Out of range is a 422.
          - `fanarttv_api_key` *(v2.6, masked)* — the fanart.tv key used
            for clear logos, banners and disc art at enrichment
            (`ItemDetail.logo_path` / `banner_path` / `disc_art_path`).
            Empty = no fanart.tv lookups.
          - `arr_webhook_url`, `arr_path_mappings`
          - `transcode_encoders`
          - `web_downloads_enabled` *(v2.2)* — admin toggle for the
            watch-page Download button. Default false. Mirrors to
            `features.web_downloads` in `/system/capabilities`.
          - `opensubtitles` (api_key, username, password, languages, enabled)
          - `lastfm` *(v2.5)* (api_key, shared_secret — masked) — the Last.fm
            API account users' Last.fm scrobbling runs under
          - `trakt` *(v2.5)* (client_id, client_secret — masked) — the Trakt
            app users' Trakt scrobbling runs under
          - `oidc`, `ldap`, `saml`, `smtp`, `otel`, `general` (sub-objects)
      tags: [Settings]
      responses:
        '200':
          description: Settings document.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }
    patch:
      summary: Patch server settings (admin)
      description: |
        Partial update — every top-level field is optional, only fields
        present in the body are written. Secret fields are preserved when
        the body sends `****` (the masked sentinel from GET).
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Updated settings document.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }

  /api/v1/settings/encoders:
    get:
      summary: Detected encoder hardware (admin)
      tags: [Settings]
      responses:
        '200':
          description: Encoder list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { type: object, additionalProperties: true } }

  /api/v1/settings/workers:
    get:
      summary: Connected transcode workers (admin)
      tags: [Settings]
      responses:
        '200':
          description: Workers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { type: object, additionalProperties: true } }

  /api/v1/settings/fleet:
    get:
      summary: Get fleet configuration (admin)
      tags: [Settings]
      responses:
        '200':
          description: Config.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }
    put:
      summary: Replace fleet configuration (admin)
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '204': { description: Saved. }

  /api/v1/settings/transcode-config:
    get:
      summary: Get transcode tuning config (admin)
      description: >
        GET fills unset fields with the env-effective running values so the
        admin form is never blank — `0` caps and nil ABR pointers in the
        stored row both get back-filled before the response.
      tags: [Settings]
      responses:
        '200':
          description: Config.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TranscodeConfig' }
    put:
      summary: Replace transcode tuning config (admin)
      description: >
        Restart-required: the server reads these at startup. A saved value
        wins over the env default; nil/zero in the payload reverts to env.
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TranscodeConfig' }
      responses:
        '204': { description: Saved. }

  /api/v1/settings/dvr:
    get:
      summary: Get DVR post-processing settings (admin)
      description: >
        Everything defaults to off (the capture is left as the tuner wrote
        it). `script_configured`, `script_path`, `comskip_configured` and
        `commercial_detector` are read-only: the post-processing script and
        comskip are executables, set only through the environment
        (`ONSCREEN_DVR_POSTPROCESS_SCRIPT`, `ONSCREEN_COMSKIP_PATH`,
        `ONSCREEN_COMSKIP_INI`) and never through the API.
      tags: [Settings, DVR]
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DVRSettings' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Replace DVR post-processing settings (admin)
      description: >
        Applies to the next recording that finishes; no restart. Read-only
        fields in the body are ignored. `commercials: cut` needs `remux` or
        `transcode` (400 otherwise).
      tags: [Settings, DVR]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DVRSettings' }
      responses:
        '204': { description: Saved. }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/tv/recordings/{id}/detect-commercials:
    post:
      summary: Queue commercial detection for a recording (admin)
      description: >
        Runs commercial detection (comskip when configured, otherwise the
        built-in black + silence detector) on a completed recording and
        stores the breaks; the file is not changed. Progress shows on
        `GET /api/v1/tv/recordings` as `postprocess_status`
        (queued | processing | processed | failed) and `postprocess_message`;
        both are absent for recordings never post-processed. The breaks
        reach players as `files[].commercials` on the item detail.
      tags: [DVR]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202': { description: 'Queued. Body `{"data": {"postprocess_status": "queued"}}`.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { description: DVR or post-processing is not enabled on this server. }

  /api/v1/tv/recordings/{id}/postprocess:
    post:
      summary: Re-run post-processing for a recording (admin)
      description: >
        Queues the full post-processing pipeline (remux / transcode,
        commercials, script) with the current settings. Refused (400) for a
        recording already processed, so a file is never transcoded twice; use
        it after a failed run.
      tags: [DVR]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202': { description: 'Queued. Body `{"data": {"postprocess_status": "queued"}}`.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { description: DVR or post-processing is not enabled on this server. }

  /api/v1/settings/remote-access:
    get:
      summary: Remote access — automatic router port mapping (admin)
      description: |
        `map_port` ("Map a port on my router automatically", default off),
        `external_port` (0 = the listen port) and `protocol` (TCP), plus
        the mapping's live status from the node that maps (only the master
        node of a cluster does): router found, method (UPnP IGD, PCP,
        NAT-PMP), external IP and port, lease, last renewal, last error.
        `reachability_hint` suggests what to test next; the server never
        checks its own reachability through an outside service. Not
        available to API keys.
      tags: [Settings]
      responses:
        '200':
          description: Setting and status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/RemoteAccess' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      summary: Change remote access (admin)
      description: |
        Turning `map_port` on exposes the server to the internet. The
        mapping node adds, changes or removes the mapping within seconds.
        Audited as `settings.update`. Not available to API keys.
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                map_port:      { type: boolean }
                external_port: { type: integer, minimum: 0, maximum: 65535, description: '0 = the listen port.' }
                protocol:      { type: string, enum: [TCP] }
      responses:
        '200':
          description: The saved setting and current status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/RemoteAccess' }
        '422': { description: Port out of range, or a protocol other than TCP. }

  /api/v1/settings/system:
    get:
      summary: Get cluster-wide System settings (admin)
      description: >
        Cluster-wide startup toggles that used to be env-only. Restart-required;
        GET fills unset fields with the env-effective running values. The
        adaptive-bitrate ladder (`abr`, `abr_max_height`, `abr_auto_max_height`)
        is **not** here — it moved to `transcode-config` alongside the rest of
        the encoder knobs.
      tags: [Settings]
      responses:
        '200':
          description: Config.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SystemSettings' }
    put:
      summary: Replace System settings (admin)
      description: >
        Restart-required. Stores all fields as explicit overrides; the server
        reads these once at startup and merges them over the env-derived
        defaults.
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemSettings' }
      responses:
        '204': { description: Saved. }

  # ── Webhooks (admin) ───────────────────────────────────────────────────────
  /api/v1/webhooks:
    get:
      summary: List webhooks (admin)
      tags: [Webhooks]
      responses:
        '200':
          description: Webhooks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Webhook' } }
    post:
      summary: Create a webhook (admin)
      tags: [Webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Webhook' }

  /api/v1/webhooks/{id}:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    patch:
      summary: Update a webhook (admin)
      tags: [Webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookCreate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Webhook' }
    delete:
      summary: Delete a webhook (admin)
      tags: [Webhooks]
      responses:
        '204': { description: Deleted. }

  /api/v1/webhooks/{id}/test:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    post:
      summary: Fire a test event (admin)
      tags: [Webhooks]
      responses:
        '200':
          description: Test result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }

  # ── Maintenance (admin) ────────────────────────────────────────────────────
  /api/v1/jobs:
    get:
      summary: Background-job status snapshot
      description: |
        Powers the home banner's 30 s-poll surface. Returns in-flight
        scans plus counts of items missing poster art or unmatched.
        Cheap query — single counts plus the in-process scan registry,
        no file walks.
      tags: [System]
      responses:
        '200':
          description: Snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      scans:
                        type: array
                        items:
                          type: object
                          properties:
                            library_id:   { type: string, format: uuid }
                            library_name: { type: string }
                      missing_art_count: { type: integer }
                      unmatched_count:   { type: integer }

  /api/v1/admin/items/unmatched:
    get:
      summary: List top-level items missing provider IDs (admin)
      description: |
        Powers the Fix Match tray. Returns every top-level movie / show
        with no TMDB / TVDB / IMDB id — auto-enrichment couldn't match
        them. The Set Poster tray has a separate endpoint
        (`/admin/items/missing-art`) for items that have IDs but no
        poster.
      tags: [Admin]
      parameters:
        - { in: query, name: library_id, schema: { type: string, format: uuid }, description: 'Filter to one library (optional).' }
        - { in: query, name: limit, schema: { type: integer, default: 200, maximum: 1000 } }
      responses:
        '200':
          description: Unmatched items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:         { type: string, format: uuid }
                            library_id: { type: string, format: uuid }
                            type:       { type: string, enum: [movie, show] }
                            title:      { type: string }
                            year:       { type: integer, nullable: true }
                      total: { type: integer }

  /api/v1/admin/items/missing-art:
    get:
      summary: List items with provider IDs but no poster (admin)
      description: |
        Powers the Set Poster tray. Returns every top-level row whose
        `poster_path` is null but provider IDs are present — auto-art
        couldn't pull a poster. Includes `tmdb_id` per row so the tray
        can call `/items/{id}/posters` without an extra round-trip.
      tags: [Admin]
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 200, maximum: 1000 } }
      responses:
        '200':
          description: Items missing art.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id:         { type: string, format: uuid }
                            library_id: { type: string, format: uuid }
                            type:       { type: string, enum: [movie, show] }
                            title:      { type: string }
                            year:       { type: integer, nullable: true }
                            tmdb_id:    { type: integer, nullable: true }
                      total: { type: integer }

  /api/v1/admin/items/re-enrich-unmatched:
    post:
      summary: Bulk re-enrich every unmatched top-level item (admin)
      description: |
        Strips `[ReleaseGroup]` prefixes and queues a background
        enrichment for every row returned by the unmatched query.
        `dry_run: true` returns the candidate list + the planned
        title cleanups without applying side effects so the operator
        can preview.
      tags: [Admin]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run: { type: boolean, default: false }
                limit:   { type: integer, default: 200, maximum: 1000 }
      responses:
        '200':
          description: Result summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      found:             { type: integer }
                      titles_cleaned:    { type: integer }
                      enrichment_queued: { type: integer }
                      dry_run:           { type: boolean }

  /api/v1/items/{id}/issues:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: The caller's own problem reports for an item
      description: |
        Newest first, at most 20, any status — lets the Report a problem
        dialog say "You reported this 2 days ago" and show how an admin
        closed an earlier report. Items outside the caller's libraries
        or content-rating ceiling return 404.
      tags: [Items]
      responses:
        '200':
          description: The caller's reports.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MediaIssue' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Report a problem with an item
      description: |
        Any authenticated user who can see the item (library ACL +
        content-rating ceiling; 404 otherwise). Every admin gets an
        `issue_reported` notification. One open report per user, item
        and kind (409 `ALREADY_REPORTED`); non-admins may have at most
        10 open reports (429 `TOO_MANY_OPEN_ISSUES`). Rate limited to
        20 per minute per session. `file_id`, when given, must be one of
        the item's files (422 otherwise).
      tags: [Items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:    { type: string, enum: [video, audio, subtitles, wrong_match, other] }
                note:    { type: string, maxLength: 1000, nullable: true }
                file_id: { type: string, format: uuid, nullable: true }
      responses:
        '201':
          description: Report created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MediaIssue' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: Invalid kind, note, or file_id. }
        '429': { description: Too many open reports (`TOO_MANY_OPEN_ISSUES`) or rate limited. }

  /api/v1/admin/issues:
    get:
      summary: Problem report queue (admin)
      description: |
        Newest first. `status` defaults to `open`; `all` lists every
        status. Rows carry the item's show context (episodes and
        seasons), the reporter, and the reported file's base name (never
        the full server path).
      tags: [Admin]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [open, resolved, dismissed, all], default: open } }
        - { in: query, name: limit, schema: { type: integer, default: 50, maximum: 200 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: One page of reports.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AdminMediaIssue' }
                      total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Unknown status filter. }

  /api/v1/admin/issues/{id}:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    patch:
      summary: Resolve or dismiss a problem report (admin)
      description: |
        Closes an open report. The reporter gets an `issue_resolved`
        notification (with the note, when given) unless the admin closed
        their own report. Audited as `issue.update`. A report that is
        already closed returns 409 `NOT_OPEN`.
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [resolved, dismissed] }
                note:   { type: string, maxLength: 1000, nullable: true }
      responses:
        '200':
          description: The closed report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MediaIssue' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: Invalid status or note. }

  /api/v1/admin/library-health:
    get:
      summary: Library health overview (admin)
      description: |
        Open problem-report count, the files the integrity probe marked
        damaged (active files of live items, most recently checked
        first, paged by `limit` / `offset`), and the Unmatched / Missing
        art counts.
      tags: [Admin]
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 100, maximum: 500 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Library health.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      open_issues:       { type: integer }
                      damaged_files:
                        type: array
                        items: { $ref: '#/components/schemas/DamagedFile' }
                      damaged_total:     { type: integer }
                      unmatched_count:   { type: integer }
                      missing_art_count: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/items/{id}/regrab:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    post:
      summary: Ask Radarr/Sonarr to re-grab an item (admin)
      description: |
        Finds the enabled instance that manages the title — Radarr by
        TMDB id for a movie; Sonarr by the show's TVDB id (or TMDB id
        via Sonarr's lookup) for a show, season or episode, default
        instance first — and queues `MoviesSearch`, `SeriesSearch`,
        `SeasonSearch` or `EpisodeSearch`. With `blocklist: true` the
        grab that produced the current file (else the most recent grab)
        is first marked failed via `POST /api/v3/history/failed/{id}`,
        which blocklists that release. While the *arr app still has a
        file (`has_file`), its search only grabs an upgrade. Audited as
        `item.regrab`. 409 `NOT_MANAGED` when no instance manages the
        title (or the item has no provider ids); 502 `ARR_UNAVAILABLE`
        when an instance could not be reached or refused the command.
      tags: [Admin]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                blocklist: { type: boolean, default: false }
      responses:
        '200':
          description: Search queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      service_id:          { type: string, format: uuid }
                      service_name:        { type: string }
                      service_kind:        { type: string, enum: [radarr, sonarr] }
                      command:             { type: string, enum: [MoviesSearch, SeriesSearch, SeasonSearch, EpisodeSearch] }
                      command_id:          { type: integer }
                      arr_id:              { type: integer, description: 'Movie or series id inside the *arr app.' }
                      title:               { type: string }
                      blocklisted:         { type: boolean }
                      blocklisted_release: { type: string }
                      has_file:            { type: boolean, description: 'Movie / episode only.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { description: Item type has no *arr counterpart (music, photos, books, …). }
        '502': { description: 'An *arr instance was unreachable or refused the command (`ARR_UNAVAILABLE`).' }

  /api/v1/maintenance/refresh-missing-art:
    post:
      summary: Re-enrich items lacking poster art (admin)
      description: |
        Backgrounded — the HTTP request returns immediately (202) and
        the actual TMDB / TVDB calls run in a goroutine with
        `WithoutCancel(ctx)` so the loop survives the request unwind.
        Cloudflare's 30 s edge timeout would otherwise kill the
        request before a long sweep finished. Same scheduled task
        also runs every 2 h via the cron framework.
      tags: [Maintenance]
      parameters:
        - { in: query, name: limit, schema: { type: integer, default: 200, maximum: 1000 } }
      responses:
        '200':
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      candidates: { type: integer, description: 'How many items match the missing-art query.' }
                      queued:     { type: integer, description: 'How many were dispatched to the background goroutine (capped at `limit`).' }

  /api/v1/maintenance/dedupe-shows:
    post:
      summary: Collapse duplicate shows (admin)
      tags: [Maintenance]
      parameters:
        - { in: query, name: library_id, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Dedupe summary.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/v1/maintenance/dedupe-movies:
    post:
      summary: Collapse duplicate movies (admin)
      tags: [Maintenance]
      parameters:
        - { in: query, name: library_id, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Dedupe summary.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  # ── Admin observability ───────────────────────────────────────────────────
  /api/v1/admin/logs:
    get:
      summary: Read recent server log entries (admin)
      tags: [Admin]
      description: |
        v2.1 (Track J). Returns recent slog records from the
        process-local 2000-entry ring buffer attached to the slog
        handler chain at boot. No file tail, no shell. Useful when
        the server runs in a container the operator can't easily
        exec into (TrueNAS Apps, Cloud Run). Newest-last ordering.
      parameters:
        - in: query
          name: level
          schema: { type: string, enum: [debug, info, warn, warning, error] }
          description: Minimum slog level to include (default info).
        - in: query
          name: limit
          schema: { type: integer, default: 200, minimum: 1, maximum: 2000 }
          description: Max entries to return (default 200, hard cap 2000).
      responses:
        '200':
          description: Log entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        time:  { type: string, format: date-time }
                        level: { type: string, enum: [DEBUG, INFO, WARN, ERROR] }
                        msg:   { type: string }
                        attrs: { type: object, additionalProperties: true, description: 'Structured attrs (request_id, library_id, err, etc). Errors are stringified for diagnostic readability.' }
        '503':
          description: Log buffer not configured on this build.

  # ── Notification agents (admin) ────────────────────────────────────────────
  /api/v1/admin/notification-agents:
    get:
      summary: List notification agents (admin)
      description: |
        Server-wide outbound channels (Discord / Telegram / ntfy / Gotify /
        email) and their delivery status. Secrets are write-only — each agent
        reports `secret_configured` instead.
      tags: [Notifications]
      responses:
        '200':
          description: Agents, oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/NotificationAgent' } }
                  meta: { type: object, properties: { total: { type: integer } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create a notification agent (admin, audited)
      tags: [Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationAgentCreate' }
      responses:
        '201':
          description: Created. Audited as `notification_agent.create` (kind, name, events, destination host — never the secret).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/NotificationAgent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: |
            Validation failed: unknown kind or event, a Discord webhook URL
            not on discord.com / discordapp.com, a malformed token or chat id,
            a public server not on https, a server host that resolves to a
            private address without `allow_private_network`, bad recipients.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/admin/notification-agents/events:
    get:
      summary: Subscribable notification-agent events (admin)
      description: The event keys an agent can subscribe to, with labels and the kinds that subscribe by default.
      tags: [Notifications]
      responses:
        '200':
          description: Event catalog.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/NotificationAgentEvent' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/notification-agents/{id}:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    patch:
      summary: Update a notification agent (admin, audited)
      description: |
        Omitted fields are unchanged; `config`, when sent, replaces the whole
        config. A blank or omitted `secret` keeps the stored one;
        `clear_secret` removes an optional one (the ntfy token). The kind
        can't change. Secrets don't follow endpoints: changing an ntfy /
        Gotify `server_url` while keeping the stored token is refused (422)
        — re-enter the token with the new URL.
      tags: [Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationAgentUpdate' }
      responses:
        '200':
          description: Updated. Audited as `notification_agent.update`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/NotificationAgent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Validation failed, or the server URL changed without the token being re-entered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    delete:
      summary: Delete a notification agent (admin, audited)
      tags: [Notifications]
      responses:
        '204': { description: Deleted. Audited as `notification_agent.delete`. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/notification-agents/{id}/test:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    post:
      summary: Send a test message (admin, audited)
      description: |
        Sends the Test event to the agent synchronously — whether or not it is
        enabled — and records the outcome in `last_success_at` / `last_error`.
        A delivery failure is still a 200 with `ok: false`; `error` is
        sanitized (no secret, no webhook URL).
      tags: [Notifications]
      responses:
        '200':
          description: Test result. Audited as `notification_agent.test`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [ok]
                    properties:
                      ok:    { type: boolean }
                      error: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ── Podcast subscriptions (admin) ──────────────────────────────────────────
  /api/v1/admin/podcast-feeds:
    get:
      summary: List podcast subscriptions (admin)
      tags: [Podcasts]
      parameters:
        - name: library_id
          in: query
          required: false
          description: Only this library's feeds.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Feeds by title, each with `episode_count` and `downloaded_count`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PodcastFeed' } }
                  meta: { type: object, properties: { total: { type: integer } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Subscribe a podcast library to a feed (admin, audited)
      description: |
        Fetches and reads the feed (RSS 2.0 with the iTunes tags; `feed://`
        and `pcast://` links are read as https), lists its audio episodes,
        saves its artwork as the show poster and starts downloading the
        newest `download_latest` episodes in the background. The episodes go
        in `<first scan path>/<feed title>/<YYYY-MM-DD> <episode title>.<ext>`.
        `download_latest` is capped at `keep_latest` when that is set.
      tags: [Podcasts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [library_id, feed_url]
              properties:
                library_id:      { type: string, format: uuid, description: A podcast library. }
                feed_url:        { type: string, format: uri }
                auto_download:   { type: boolean, default: true, description: Download new episodes as refreshes find them. }
                keep_latest:     { type: integer, minimum: 0, maximum: 1000, default: 0, description: 'Keep this many downloaded episodes, newest by publish date; 0 keeps all.' }
                download_latest: { type: integer, minimum: 0, maximum: 50, default: 1, description: Newest episodes to download now. }
      responses:
        '201':
          description: Subscribed. Audited as `podcast.subscribe`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PodcastFeed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`ALREADY_SUBSCRIBED` — the library already follows this feed URL.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: |
            Not a podcast library, the library has no folder, the URL isn't
            http(s), the feed has no audio episodes, or a setting is out of
            range.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502':
          description: |
            `FEED_UNAVAILABLE` — the feed couldn't be fetched or isn't an RSS
            podcast feed (the message says which: an HTTP status, a timeout, a
            private address, not a feed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/admin/podcast-feeds/{id}:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: Get a podcast subscription (admin)
      tags: [Podcasts]
      responses:
        '200':
          description: The feed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PodcastFeed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Change auto-download and retention (admin, audited)
      description: Omitted fields are unchanged. A lower `keep_latest` deletes the extra downloads at once.
      tags: [Podcasts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                auto_download: { type: boolean }
                keep_latest:   { type: integer, minimum: 0, maximum: 1000 }
      responses:
        '200':
          description: Updated. Audited as `podcast.update`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PodcastFeed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: keep_latest out of range.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    delete:
      summary: Unsubscribe (admin, audited)
      description: |
        Stops following the feed. With `delete_files=true` its downloaded
        episodes are deleted too; otherwise they stay in the library as
        plain files.
      tags: [Podcasts]
      parameters:
        - name: delete_files
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '204': { description: Unsubscribed. Audited as `podcast.unsubscribe`. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/podcast-feeds/{id}/refresh:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    post:
      summary: Check a feed for new episodes now (admin)
      description: What the hourly refresh does, for one feed.
      tags: [Podcasts]
      responses:
        '200':
          description: Refresh result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      new_episodes: { type: integer }
                      downloading:  { type: integer, description: New episodes auto-download started on. }
                      removed:      { type: integer, description: Downloads retention deleted. }
                      not_modified: { type: boolean, description: The feed answered 304 to its ETag / Last-Modified. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502':
          description: '`FEED_UNAVAILABLE` — the feed couldn''t be fetched or read. Also recorded as the feed''s `last_error`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/admin/podcast-feeds/{id}/episodes:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: List a feed's episodes (admin)
      tags: [Podcasts]
      parameters:
        - { name: limit,  in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Episodes, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PodcastEpisode' } }
                  meta: { type: object, properties: { total: { type: integer } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/podcast-episodes/{id}/download:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    post:
      summary: Download an episode (admin)
      description: |
        Starts the download in the background and answers with the episode
        as `downloading`. Poll the feed's episodes for the outcome.
      tags: [Podcasts]
      responses:
        '202':
          description: Download started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PodcastEpisode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`EPISODE_STATE` — already downloading or downloaded.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    delete:
      summary: Delete an episode's downloaded file (admin)
      description: The episode stays listed as `removed`; auto-download won't fetch it again.
      tags: [Podcasts]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`EPISODE_STATE` — the episode isn''t downloaded.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  # ── Plugins (admin) ────────────────────────────────────────────────────────
  /api/v1/admin/imports/connect:
    post:
      summary: Check a source server and list its accounts (admin)
      description: |
        Reads the server's identity and accounts with the token: Plex needs
        the server owner's X-Plex-Token, Jellyfin and Emby an API key. Each
        account comes with the OnScreen user of the same name (any case) as
        `suggested_user_id`. Nothing is stored.
      tags: [Imports]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportSource' }
      responses:
        '200':
          description: The server and its accounts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ImportConnection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: |
            `IMPORT_SOURCE_UNAUTHORIZED` — the server refused the token; or
            `VALIDATION` — an unknown kind, a URL that isn't plain
            http(s) (no user name, query or fragment), or no token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502':
          description: '`IMPORT_SOURCE_UNAVAILABLE` — unreachable, a refused address, or not the chosen server type.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /api/v1/admin/imports:
    get:
      summary: List recent imports (admin)
      description: The 20 newest, previews included. A running import whose server stopped is failed here.
      tags: [Imports]
      responses:
        '200':
          description: Imports, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ImportJob' } }
                  meta: { type: object, properties: { total: { type: integer } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Start an import or preview (admin, audited)
      description: |
        Runs in the background; poll `GET /admin/imports/{id}`. One import
        runs at a time. A real run (not `dry_run`) is audited as
        `import.start`.

        - Watched state becomes a watched mark dated when the source last saw
          the item watched; an equal or newer mark on OnScreen is kept.
        - A resume point and each past play become watch events
          (`client_name` "Plex (imported)" etc.). Plays older than the
          server's watch-history retention are skipped. Imported events don't
          trigger scrobbles.
        - Ratings and favorites already set on OnScreen are kept.
        - Playlists become playlists of the mapped user; a re-run adds the
          items missing from them.
      tags: [Imports]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ImportSource'
                - type: object
                  required: [mapping, options]
                  properties:
                    mapping:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        required: [account_id, user_id]
                        properties:
                          account_id: { type: string, description: The source account's ID from connect. }
                          user_id:    { type: string, format: uuid, description: The OnScreen user its data goes to. }
                    options: { $ref: '#/components/schemas/ImportOptions' }
                    dry_run: { type: boolean, default: false, description: Match and count without writing. }
      responses:
        '202':
          description: Started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ImportJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`IMPORT_RUNNING` — another import is running.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: |
            As for connect, or: no account mapped, an account that isn't on
            the source, a user that doesn't exist, or nothing selected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '502':
          description: '`IMPORT_SOURCE_UNAVAILABLE`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /api/v1/admin/imports/{id}:
    get:
      summary: An import's progress and outcome (admin)
      tags: [Imports]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The import.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ImportJob' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/admin/imports/{id}/cancel:
    post:
      summary: Cancel a running import (admin, audited)
      description: What it wrote before the cancel stays; a re-run picks up the rest. Audited as `import.cancel`.
      tags: [Imports]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Cancelling. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`IMPORT_NOT_RUNNING` — finished, or running on another server node.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /api/v1/admin/plugins:
    get:
      summary: List plugins (admin)
      tags: [Plugins]
      responses:
        '200':
          description: Plugins.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Plugin' } }
    post:
      summary: Register a plugin (admin)
      tags: [Plugins]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PluginCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Plugin' }

  /api/v1/admin/plugins/{id}:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    patch:
      summary: Update a plugin (admin)
      tags: [Plugins]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PluginCreate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Plugin' }
    delete:
      summary: Delete a plugin (admin)
      tags: [Plugins]
      responses:
        '204': { description: Deleted. }

  /api/v1/admin/plugins/{id}/test:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    post:
      summary: Test plugin connectivity (admin)
      tags: [Plugins]
      responses:
        '200':
          description: Test result.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  # ── Backup (admin) ─────────────────────────────────────────────────────────
  /api/v1/admin/backup:
    get:
      summary: Download a backup archive (admin)
      tags: [Backup]
      responses:
        '200':
          description: tar.gz archive.
          content:
            application/gzip: {}

  /api/v1/admin/restore:
    post:
      summary: Restore from a backup archive (admin)
      tags: [Backup]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archive]
              properties:
                archive: { type: string, format: binary }
      responses:
        '202': { description: Restore enqueued. }

  # ── Tasks (admin) ──────────────────────────────────────────────────────────
  /api/v1/admin/tasks:
    get:
      summary: List scheduled tasks (admin)
      tags: [Tasks]
      responses:
        '200':
          description: Tasks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ScheduledTask' } }
    post:
      summary: Create a scheduled task (admin)
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduledTaskCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ScheduledTask' }

  /api/v1/admin/tasks/types:
    get:
      summary: List registered task types (admin)
      tags: [Tasks]
      responses:
        '200':
          description: Type names.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: string }

  /api/v1/admin/tasks/{id}:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: Get a scheduled task by ID (admin)
      description: >
        Returns the same wire shape as a single row from `List`. The endpoint
        exists so the verify-after-mutate (`POST` / `PATCH` → `GET {id}`) and
        verify-after-delete (`DELETE {id}` → `GET {id}` expecting 404) patterns
        both round-trip cleanly. Without this route chi returned `405 Method Not
        Allowed` on a `GET` to this path (Patch + Delete were registered but
        Get wasn't) — conformant but uninformative.
      tags: [Tasks]
      responses:
        '200':
          description: The task row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ScheduledTask' }
        '400': { description: Invalid id. }
        '404': { description: No such task. }
    patch:
      summary: Update a scheduled task (admin)
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduledTaskUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ScheduledTask' }
    delete:
      summary: Delete a scheduled task (admin)
      tags: [Tasks]
      responses:
        '204': { description: Deleted. }

  /api/v1/admin/tasks/{id}/run:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    post:
      summary: Run a scheduled task on the next tick (admin)
      tags: [Tasks]
      responses:
        '200':
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      queued: { type: boolean }

  /api/v1/admin/tasks/{id}/runs:
    parameters:
      - { $ref: '#/components/parameters/UUID' }
      - { in: query, name: limit, schema: { type: integer, default: 50, maximum: 500 } }
    get:
      summary: List task run history (admin)
      tags: [Tasks]
      responses:
        '200':
          description: Runs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/TaskRun' } }

  # ── Audit, Analytics, Invites, Email, FS, Arr ──────────────────────────────
  /api/v1/audit:
    get:
      summary: Audit log (admin)
      tags: [Audit]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }

  /api/v1/analytics:
    get:
      summary: Usage analytics (admin)
      tags: [Analytics]
      responses:
        '200':
          description: Aggregates.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }

  /api/v1/invites:
    get:
      summary: List invites (admin)
      tags: [Invites]
      responses:
        '200':
          description: Invites.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Invite' } }
    post:
      summary: Create an invite (admin)
      tags: [Invites]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:    { type: string, format: email }
                expires_in_hours: { type: integer }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Invite' }

  /api/v1/invites/{id}:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    delete:
      summary: Revoke an invite (admin)
      tags: [Invites]
      responses:
        '204': { description: Revoked. }

  /api/v1/invites/accept:
    post:
      summary: Accept an invite (creates account)
      tags: [Invites]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, username, password]
              properties:
                token:    { type: string }
                username: { type: string }
                password: { type: string, format: password, minLength: 8 }
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UserInfo' }

  /api/v1/email/test:
    post:
      summary: Send a test email (admin)
      tags: [Email]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, format: email }
      responses:
        '204': { description: Sent. }

  /api/v1/users/me/stats:
    get:
      summary: The caller's own viewing and listening stats
      description: >
        Aggregated from the caller's plays (the analytics play history,
        refreshed every few minutes). Only ever the caller's own; a managed
        profile sees its own. Titles the caller can't see (library access,
        content-rating ceiling, label restrictions) are left out of every
        number. Time is how far into each title a play got (its final
        position, capped at the title's length); a play counts as finished at
        90%. Days, months and the heatmap bucket in `tz`. v2.6.
      tags: [Users]
      parameters:
        - name: range
          in: query
          schema: { type: string, default: 30d, example: 'year:2026' }
          description: '`30d`, `90d`, `365d`, `all` or `year:YYYY` (2000 to the current year).'
        - name: tz
          in: query
          schema: { type: string, default: UTC, example: America/Detroit }
          description: IANA time zone; anything unknown falls back to UTC.
      responses:
        '200':
          description: Stats.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UserStats' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/users/me/year-in-review:
    get:
      summary: The caller's year in review
      description: >
        A curated summary of one calendar year (in `tz`) for the caller, with
        the same visibility rules as `/users/me/stats`. `previous_year` is
        present only when the year before has plays; `first_play`,
        `busiest_day` and `top_device` are null when the year has none.
        "New artists" are artists whose first play by the caller falls in the
        year, as far back as the play history reaches. v2.6.
      tags: [Users]
      parameters:
        - { name: year, in: query, schema: { type: integer, example: 2026 }, description: Defaults to the current year. }
        - { name: tz, in: query, schema: { type: string, default: UTC } }
      responses:
        '200':
          description: Year in review.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/YearInReview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/users/me/digest:
    get:
      summary: The caller's digest email setting
      description: >
        `available` is false while an admin has digests off or SMTP isn't
        configured; `has_email` is false when the account has no email
        address (nothing can be sent until one is added). v2.6.
      tags: [Users, Email]
      responses:
        '200':
          description: Setting.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MyDigest' }
    put:
      summary: Set the caller's digest frequency
      tags: [Users, Email]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [frequency]
              properties:
                frequency: { type: string, enum: [off, weekly, monthly] }
      responses:
        '200':
          description: The saved setting.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MyDigest' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/settings/digest:
    get:
      summary: Get the digest email settings (admin)
      description: >
        Off by default. `weekday` (0 = Sunday) and `hour` are in the server's
        time zone (`server_timezone`): weekly digests go out then and cover
        the seven days before; monthly ones go out on the 1st at `hour` and
        cover the previous month. `smtp_configured`, `base_url` (Settings ▸
        General, used for links) and `server_timezone` are read-only. v2.6.
      tags: [Settings, Email]
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DigestSettings' }
    put:
      summary: Replace the digest email settings (admin)
      description: Read-only fields in the body are ignored. Audit-logged as `settings.update`.
      tags: [Settings, Email]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DigestSettings' }
      responses:
        '200':
          description: The saved settings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DigestSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/settings/digest/test:
    post:
      summary: Send the calling admin a test digest now (admin)
      description: >
        Sends the caller's own digest of the current period to their account's
        email address, even if nothing is new, digests are off, or they haven't
        opted in. Doesn't count as their digest for the period. 400 when SMTP
        isn't configured or the account has no email address.
      tags: [Settings, Email]
      responses:
        '200': { description: 'Sent. Body `{"data": {"message": "Test digest sent to …"}}`.' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/digest/unsubscribe:
    get:
      summary: Digest unsubscribe confirmation page (no sign-in)
      description: >
        The link in every digest email. Returns a small HTML page with an
        Unsubscribe button; it does not unsubscribe by itself (mail scanners
        fetch links). The token is an HMAC-signed user id that can only turn
        that user's digest off. 400 page for an invalid token. Rate-limited per
        IP.
      tags: [Email]
      security: []
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Confirmation page (text/html). }
        '400': { description: Invalid token (text/html). }
    post:
      summary: Unsubscribe from the digest (no sign-in)
      description: >
        Turns the token's user's digest off. Also the target of the email's
        `List-Unsubscribe` / `List-Unsubscribe-Post: List-Unsubscribe=One-Click`
        headers (RFC 8058), so mail apps can unsubscribe in one click.
      tags: [Email]
      security: []
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Done page (text/html). }
        '400': { description: Invalid token (text/html). }

  /api/v1/fs/browse:
    get:
      summary: Browse server filesystem (admin)
      description: Used by the library wizard to pick scan paths.
      tags: [Settings]
      parameters:
        - { in: query, name: path, schema: { type: string }, description: 'Absolute path; empty lists volume roots.' }
      responses:
        '200':
          description: Directory listing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      path:    { type: string }
                      entries:
                        type: array
                        items:
                          type: object
                          properties:
                            name:  { type: string }
                            path:  { type: string }
                            is_dir: { type: boolean }

  /api/v1/arr/webhook:
    post:
      summary: Sonarr/Radarr webhook ingestion
      description: |
        Authenticated by an arr API-key shared secret, not user auth.
        Grab, Download, ImportComplete and ManualInteractionRequired events
        (plus DownloadFailed / DownloadFailure / ImportFailure where a build
        sends them) also trigger a background refresh of the matching
        requests' download state (see RequestDownload); bursts coalesce.
      tags: [Arr]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '204': { description: Accepted. }

  /api/v1/admin/arr-services:
    get:
      summary: List configured arr services
      tags: [ArrServices]
      responses:
        '200':
          description: List of arr services. api_key is never returned; api_key_set indicates whether one is stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ArrService' }
                  meta: { $ref: '#/components/schemas/ListMeta' }
    post:
      summary: Add a new arr service
      tags: [ArrServices]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArrServiceCreate' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/ArrService' } }
        '400': { description: Validation error. }

  /api/v1/admin/arr-services/probe:
    post:
      summary: Probe an arr instance for connection metadata + dropdown options
      description: |
        Calls Ping + QualityProfiles + RootFolders + Tags (+ LanguageProfiles for sonarr)
        in one round-trip. Used by the admin UI to populate the create/edit form. Pass
        service_id to reuse the stored API key when editing a saved row.
      tags: [ArrServices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:        { type: string, enum: [radarr, sonarr] }
                base_url:    { type: string }
                api_key:     { type: string }
                service_id:  { type: string, format: uuid, nullable: true }
      responses:
        '200':
          description: Probe result.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/ArrProbeResult' } }
        '400': { description: Validation or upstream error. }

  /api/v1/admin/arr-services/{id}:
    parameters:
      - $ref: '#/components/parameters/UUID'
    get:
      summary: Get one arr service
      tags: [ArrServices]
      responses:
        '200':
          description: Service.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/ArrService' } }
        '404': { description: Not found. }
    patch:
      summary: Update an arr service
      description: |
        Partial update — every field is optional. Send `api_key` only when rotating
        the credential; an omitted or empty `api_key` keeps the existing value.
        `is_default` is intentionally not settable here — use /set-default.
      tags: [ArrServices]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArrServiceUpdate' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/ArrService' } }
        '404': { description: Not found. }
    delete:
      summary: Delete an arr service
      description: |
        In-flight requests bound to this service have their service_id set NULL via
        FK ON DELETE SET NULL — they survive but the admin must re-route them.
      tags: [ArrServices]
      responses:
        '204': { description: Deleted. }

  /api/v1/admin/arr-services/{id}/set-default:
    parameters:
      - $ref: '#/components/parameters/UUID'
    post:
      summary: Mark this service as the default for its kind
      description: |
        Atomically clears any existing default for this kind, then sets the flag on
        this row. The unique partial index on (kind) WHERE is_default enforces the
        invariant of at most one default per kind.
      tags: [ArrServices]
      responses:
        '200':
          description: Updated service.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/ArrService' } }

  /api/v1/admin/arr-services/{id}/health:
    parameters:
      - $ref: '#/components/parameters/UUID'
    get:
      summary: Instance health — reachability, health checks, disk space, queue size
      description: |
        Admin only. Calls the instance's system/status, health, diskspace,
        rootfolder and queue endpoints (10 s budget). An unreachable instance
        is still a 200 with `reachable: false` and a generic `error`; each
        other section degrades on its own (empty checks / disks, null
        queue_count).
      tags: [ArrServices]
      responses:
        '200':
          description: Health snapshot.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/ArrServiceHealth' } }
        '400': { description: Invalid id. }
        '404': { description: Not found. }

  /api/v1/discover/search:
    get:
      summary: TMDB search-multi enriched with library + request state
      description: |
        Returns up to `limit` titles from TMDB. Each row is decorated with whether
        the title is already in the user's library (`in_library`, `library_item_id`)
        and whether the calling user already has an open request for it
        (`has_active_request`, `active_request_id`, `active_request_status`).
        Returns 503 with code TMDB_UNAVAILABLE when no TMDB key is configured
        (`features.requests` is false), and 403 REQUESTS_DISABLED for a
        non-admin account an admin has switched requesting off for.
      tags: [Discover]
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Discover results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DiscoverItem' }
        '400': { description: Missing query. }
        '403': { description: 'REQUESTS_DISABLED: an admin turned requesting off for this account.' }
        '503': { description: 'TMDB_UNAVAILABLE: no TMDB key is configured.' }

  /api/v1/discover/tv/{tmdb_id}/seasons:
    get:
      summary: A show's seasons for the request season picker
      description: |
        The show's seasons from TMDB in season order with specials (season 0)
        last. Each row carries how many of its episodes have aired, how many
        are on disk in the libraries the caller can see (their library grants
        and content-rating ceiling apply; unrated counts as the most
        restrictive rating), and the status of the caller's own active
        request covering the season, if any. An all-seasons request covers
        every regular season but not specials. Returns 503 TMDB_UNAVAILABLE
        when no TMDB key is configured, 403 REQUESTS_DISABLED for a non-admin
        account that may not request, and 502 TMDB_LOOKUP_FAILED when TMDB
        couldn't be read.
      tags: [Discover]
      parameters:
        - in: path
          name: tmdb_id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Seasons.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SeasonInfo' }
        '400': { description: Invalid tmdb id. }
        '401': { description: Not signed in. }
        '404': { description: TMDB has no such show. }
        '502': { description: TMDB lookup failed. }
        '503': { description: TMDB not configured. }

  /api/v1/requests:
    get:
      summary: List requests
      description: |
        Default scope is the calling user's own history. Admins may pass
        `scope=all` to see the full server queue. Optional `status` filter narrows
        to a single state.
      tags: [Requests]
      parameters:
        - in: query
          name: scope
          schema: { type: string, enum: [mine, all], default: mine }
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, declined, downloading, available, failed] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: List of requests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MediaRequest' }
                  meta: { $ref: '#/components/schemas/ListMeta' }
        '403': { description: scope=all is admin-only. }
    post:
      summary: Submit a new request
      tags: [Requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, tmdb_id]
              properties:
                type:                  { type: string, enum: [movie, show] }
                tmdb_id:               { type: integer }
                seasons:
                  description: >
                    Optional season numbers for show requests (0 = specials);
                    omit for every regular season. Each must be listed on
                    TMDB (422 otherwise). A user may hold several active
                    requests for one show as long as their seasons don't
                    overlap. A show request counts once against the TV quota
                    however many seasons it names.
                  type: array
                  items: { type: integer, minimum: 0 }
                requested_service_id:  { type: string, format: uuid, nullable: true, description: User's preferred arr service (e.g. 4K vs 1080p). Admin can override at approve time. }
                quality_profile_id:    { type: integer, nullable: true }
                root_folder:           { type: string,  nullable: true }
      responses:
        '201':
          description: >
            Request created. over_quota is true when the request took the user
            past their quota for its type — it was still created, but waits for
            an admin instead of being auto-approved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/MediaRequest'
                      - type: object
                        properties:
                          over_quota: { type: boolean }
        '400': { description: Validation error. }
        '403': { description: 'REQUESTS_DISABLED: an admin turned requesting off for this account.' }
        '409': { description: 'ALREADY_REQUESTED: an active request for this movie, or for an overlapping set of seasons of this show.' }
        '422': { description: 'Invalid season list (e.g. a season TMDB does not list).' }
        '429': { description: 'TOO_MANY_PENDING_REQUESTS: 25 requests already waiting for review.' }

  /api/v1/requests/quota:
    get:
      summary: The caller's request allowance
      description: >
        Whether the caller may request at all, and per media type the limit
        (the user's own quota, else the server default; 0 = unlimited), how many
        non-declined requests they made in the current rolling window, and how
        many remain (null when unlimited). Admins are always allowed and
        unlimited.
      tags: [Requests]
      responses:
        '200':
          description: Allowance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [can_request, window_days, movies, tv]
                    properties:
                      can_request: { type: boolean }
                      window_days: { type: integer }
                      movies: { $ref: '#/components/schemas/RequestQuotaUsage' }
                      tv: { $ref: '#/components/schemas/RequestQuotaUsage' }
        '401': { description: Not signed in. }

  /api/v1/requests/pending-count:
    get:
      summary: Number of requests waiting for approval (admin)
      description: Backs the admin nav badge.
      tags: [Requests]
      responses:
        '200':
          description: Pending count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [count]
                    properties:
                      count: { type: integer }
        '403': { description: Not an admin. }

  /api/v1/requests/{id}:
    parameters:
      - $ref: '#/components/parameters/UUID'
    get:
      summary: Get a request (owner or admin)
      tags: [Requests]
      responses:
        '200':
          description: Request.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/MediaRequest' } }
        '403': { description: Not the owner. }
        '404': { description: Not found. }

  /api/v1/requests/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/UUID'
    post:
      summary: Withdraw a still-pending request (owner only)
      tags: [Requests]
      responses:
        '204': { description: Cancelled. }
        '403': { description: Not the owner. }
        '409': { description: Request is already decided and cannot be cancelled. }

  /api/v1/admin/requests/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/UUID'
    post:
      summary: Approve a pending request and dispatch it to the arr service
      description: |
        Body fields override the per-request and per-service defaults at approval
        time — useful when redirecting a request to a different arr instance than
        the user originally chose.
      tags: [Requests]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                service_id:         { type: string, format: uuid, nullable: true }
                quality_profile_id: { type: integer, nullable: true }
                root_folder:        { type: string,  nullable: true }
      responses:
        '200':
          description: Approved.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/MediaRequest' } }
        '400': { description: No arr service configured / mismatched / disabled / arr add failed. }
        '409': { description: Request is no longer pending. }

  /api/v1/admin/requests/{id}/decline:
    parameters:
      - $ref: '#/components/parameters/UUID'
    post:
      summary: Decline a pending request
      tags: [Requests]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, description: Optional message shown to the requester. }
      responses:
        '200':
          description: Declined.
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/MediaRequest' } }
        '409': { description: Request is no longer pending. }

  /api/v1/admin/requests/{id}:
    parameters:
      - $ref: '#/components/parameters/UUID'
    delete:
      summary: Hard-delete a request (admin escape hatch)
      description: Does not contact the upstream arr instance — only the OnScreen row goes away.
      tags: [Requests]
      responses:
        '204': { description: Deleted. }

  # ── OPDS (outside /api/v1) ─────────────────────────────────────────────────
  /opds/:
    get:
      summary: OPDS root navigation feed
      tags: [OPDS]
      description: |
        "Recently added" plus one entry per book library the caller can
        open. Links `search` to `/opds/opensearch.xml`. v2.6.
      security: [{ opdsBasic: [] }, { bearerAuth: [] }, { cookieAuth: [] }, { apiKeyHeader: [] }]
      responses:
        '200':
          description: Navigation feed.
          content:
            application/atom+xml;profile=opds-catalog;kind=navigation:
              schema: { type: string }
        '401': { description: "No or bad credentials; carries `WWW-Authenticate: Basic`." }
        '403': { description: Downloads are disabled on the server (`DOWNLOADS_DISABLED`). }
        '429': { description: Too many failed Basic sign-ins from this address. }

  /opds/libraries/{id}:
    parameters: [{ $ref: '#/components/parameters/UUID' }]
    get:
      summary: OPDS acquisition feed of one book library
      tags: [OPDS]
      description: |
        Books by title, 50 per page (`?page=N`, `rel="next"` / `previous`
        links). Each entry has author, year, genres, summary, an
        acquisition link to `/media/download/{fileId}?token=…` with the
        book's media type (EPUB, PDF, CBZ, CBR …), and cover + thumbnail
        links. The `token` is a stream token bound to that one file (24 h,
        revoked with the key or session that listed it). Only books under
        the caller's rating ceiling and label restriction. 404 for a library
        that isn't a book library the caller can open. v2.6.
      security: [{ opdsBasic: [] }, { bearerAuth: [] }, { cookieAuth: [] }, { apiKeyHeader: [] }]
      parameters:
        - { in: query, name: page, required: false, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200':
          description: Acquisition feed.
          content:
            application/atom+xml;profile=opds-catalog;kind=acquisition:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /opds/recent:
    get:
      summary: OPDS feed of recently added books
      tags: [OPDS]
      description: Newest books across the caller's book libraries, paged like a library feed. v2.6.
      security: [{ opdsBasic: [] }, { bearerAuth: [] }, { cookieAuth: [] }, { apiKeyHeader: [] }]
      parameters:
        - { in: query, name: page, required: false, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200':
          description: Acquisition feed.
          content:
            application/atom+xml;profile=opds-catalog;kind=acquisition:
              schema: { type: string }

  /opds/search:
    get:
      summary: OPDS search
      tags: [OPDS]
      description: Books matching `q` (title, author, full text), paged like a library feed. v2.6.
      security: [{ opdsBasic: [] }, { bearerAuth: [] }, { cookieAuth: [] }, { apiKeyHeader: [] }]
      parameters:
        - { in: query, name: q, required: true, schema: { type: string, maxLength: 200 } }
        - { in: query, name: page, required: false, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200':
          description: Acquisition feed.
          content:
            application/atom+xml;profile=opds-catalog;kind=acquisition:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }

  /opds/opensearch.xml:
    get:
      summary: OpenSearch description for the OPDS catalog
      tags: [OPDS]
      security: [{ opdsBasic: [] }, { bearerAuth: [] }, { cookieAuth: [] }, { apiKeyHeader: [] }]
      responses:
        '200':
          description: OpenSearch description (template `/opds/search?q={searchTerms}`).
          content:
            application/opensearchdescription+xml:
              schema: { type: string }

  /opds/files/{fileId}/cover:
    parameters:
      - { in: path, name: fileId, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Cover of the book a file belongs to
      tags: [OPDS]
      description: |
        Same library, rating and label checks as the file. Besides the
        catalog's credentials, accepts the file-bound `?token=` stream
        token the feed puts on its links. 404 when hidden or missing. v2.6.
      security: [{ opdsBasic: [] }, { bearerAuth: [] }, { cookieAuth: [] }, { apiKeyHeader: [] }]
      responses:
        '200':
          description: The cover image.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: paseto-v4
    cookieAuth:
      type: apiKey
      in: cookie
      name: onscreen_at
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        A personal API key (`osk_…`, v2.6). The same key is also accepted as
        `Authorization: Bearer osk_…`. Not accepted on the credential and
        account-security endpoints (403 `API_KEY_NOT_ALLOWED`).
    opdsBasic:
      type: http
      scheme: basic
      description: |
        `/opds/` only (v2.6): HTTP Basic whose password is a personal API key
        (`osk_…`); the username is ignored. The account password is never
        accepted. Ten failed attempts from one address lock it out for 15
        minutes (429).

  parameters:
    UUID:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
    SubtitleStartMS:
      in: query
      name: start_ms
      schema: { type: integer, minimum: 0, maximum: 172800000 }
      description: |
        v2.6. Rebase the cues onto a player timeline that starts at this
        content position (ms): every cue moves this much earlier, on top of
        the track's saved offset, and cues that end before it are dropped.
        For a player whose stream starts mid-title on a timeline of its own,
        such as a Chromecast playing a cast HLS session. Missing, malformed
        or out-of-range values mean no rebase.
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Offset:
      in: query
      name: offset
      schema: { type: integer, minimum: 0, default: 0 }
    WatchFilter:
      in: query
      name: watch
      required: false
      description: |
        Narrow to the caller's watch state (400 for any other value).
        Playable videos: watched (finished or marked played, sticky
        across a rewatch), in_progress (started, not finished),
        unwatched (never started, or marked unplayed since). Shows and
        seasons roll up their episodes within the caller's ceiling:
        watched = at least one episode and all watched; in_progress =
        some watched or started but not all watched; unwatched = none
        watched or started. Other types count as unwatched.
      schema: { type: string, enum: [unwatched, in_progress, watched] }
    ViewAs:
      in: query
      name: view_as
      required: false
      description: |
        v2.1 Track G item 5. Admin "view as" — when an admin appends
        `?view_as=<uuid>` to any GET request the auth middleware swaps
        the request's claims for the target user's, so handlers see
        exactly what the target would see (own grants, content-rating
        ceiling, IsAdmin downgraded). Read-only by design — non-GET
        requests with the param return 403. Unknown target IDs return
        404 to prevent ID-probing. Useful for verifying the per-user
        policy stack end-to-end without PIN-switching.
      schema: { type: string, format: uuid }

  responses:
    BoolEnabled:
      description: Boolean visibility flag.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  enabled: { type: boolean }
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Caller is authenticated but not allowed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Duplicate or state conflict.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NoWatchState:
      description: The item type has no watch state for this operation (tracks, photos, books, …).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    AudiobookBookmark:
      type: object
      properties:
        id: { type: string, format: uuid }
        item_id: { type: string, format: uuid, description: The playable item the position is in. }
        item_title: { type: string }
        item_index: { type: integer, description: 'Chapter number; absent for a single-file book.' }
        position_ms: { type: integer }
        note: { type: string }
        created_at: { type: string, format: date-time }
    ScrobbleLinkComplete:
      type: object
      required: [pending]
      properties:
        pending: { type: string, description: The opaque handle from the matching link call. }
    ScrobbleLinkResult:
      type: object
      properties:
        status: { type: string, enum: [pending, slow_down, linked, expired, denied] }
        username: { type: string, description: Set once linked. }
    # ── Envelopes ──────────────────────────────────────────────────────────
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:       { type: string, description: 'UPPER_SNAKE_CASE machine code.' }
            message:    { type: string }
            request_id: { type: string }
    # ── Problem reports ("Report a problem") ────────────────────────────────
    MediaIssue:
      type: object
      properties:
        id:              { type: string, format: uuid }
        item_id:         { type: string, format: uuid }
        file_id:         { type: string, format: uuid }
        kind:            { type: string, enum: [video, audio, subtitles, wrong_match, other] }
        note:            { type: string }
        status:          { type: string, enum: [open, resolved, dismissed] }
        created_at:      { type: string, format: date-time }
        resolved_at:     { type: string, format: date-time }
        resolution_note: { type: string }
    AdminMediaIssue:
      allOf:
        - { $ref: '#/components/schemas/MediaIssue' }
        - type: object
          properties:
            library_id:           { type: string, format: uuid }
            item_type:            { type: string }
            item_title:           { type: string }
            item_year:            { type: integer }
            show_title:           { type: string, description: 'Episodes and seasons.' }
            season_number:        { type: integer }
            episode_number:       { type: integer }
            poster_path:          { type: string, description: 'Falls back to the season / show poster.' }
            reporter_id:          { type: string, format: uuid }
            reporter_username:    { type: string }
            resolved_by_username: { type: string }
            file_name:            { type: string, description: 'Base name of the reported file.' }
    DamagedFile:
      type: object
      properties:
        file_id:          { type: string, format: uuid }
        item_id:          { type: string, format: uuid }
        library_id:       { type: string, format: uuid }
        item_type:        { type: string }
        title:            { type: string }
        year:             { type: integer }
        show_title:       { type: string }
        season_number:    { type: integer }
        episode_number:   { type: integer }
        path_basename:    { type: string }
        integrity_detail: { type: string }
        checked_at:       { type: string, format: date-time }
    ListEnvelope:
      type: object
      properties:
        data:
          type: array
          items: {}
        meta:
          type: object
          properties:
            total:  { type: integer, format: int64, description: '`-1` when total is unknown (load-more pagination).' }
            cursor: { type: string }

    # ── Auth ───────────────────────────────────────────────────────────────
    TokenPair:
      type: object
      properties:
        access_token:  { type: string }
        refresh_token: { type: string }
        expires_at:    { type: string, format: date-time }
        user_id:       { type: string, format: uuid }
        username:      { type: string }
        is_admin:      { type: boolean }
    TokenPairEnvelope:
      type: object
      properties:
        data: { $ref: '#/components/schemas/TokenPair' }
    UserInfo:
      type: object
      properties:
        id:       { type: string, format: uuid }
        username: { type: string }
        is_admin: { type: boolean }
        blocked_labels:
          type: array
          items: { type: string }
          description: 'GET /api/v1/users only *(v2.6)*: the user never sees an item carrying one of these labels (its own or inherited). Always present, [] when none.'
        allowed_labels:
          type: array
          items: { type: string }
          description: 'GET /api/v1/users only *(v2.6)*: when non-empty, the user sees only items carrying one of these labels. Always present, [] when none.'

    # ── Pairing ────────────────────────────────────────────────────────────
    PairCodeResponse:
      type: object
      properties:
        pin:           { type: string, minLength: 6, maxLength: 6 }
        device_token:  { type: string, format: uuid }
        expires_in:    { type: integer, description: 'Seconds until expiry.' }
        poll_interval: { type: integer, description: 'Suggested poll interval, seconds.' }
    PairPollResponse:
      type: object
      properties:
        status: { type: string, enum: [pending, claimed, expired] }
        tokens: { $ref: '#/components/schemas/TokenPair' }

    # ── System ─────────────────────────────────────────────────────────────
    SetupStatusEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            user_count:  { type: integer, format: int64 }
            initialized: { type: boolean }
    CapabilitiesEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            server:
              type: object
              properties:
                name:        { type: string }
                machine_id:  { type: string }
                version:     { type: string }
                api_version: { type: string, description: 'Stable API contract version (currently `v1`).' }
            features:
              type: object
              description: |
                Feature flags reflect runtime availability — `trickplay`,
                `subtitles_ocr`, `intro_markers`, and `backup` AND-gate
                against boot-time `LookPath` probes for ffmpeg /
                tesseract / fpcalc / pg_dump, so a `false` here means
                the feature genuinely won't work even if the codebase
                supports it.
              properties:
                transcode:          { type: boolean, description: 'Hardware + software transcode pipeline; false when ffmpeg is missing.' }
                trickplay:          { type: boolean, description: 'Sprite-sheet seekbar previews; rides on ffmpeg.' }
                subtitles_external: { type: boolean, description: 'OpenSubtitles search + download: enabled in Settings and a key available (the operator''s or a bundled one). When false, search and download answer 503 SUBTITLES_NOT_CONFIGURED.' }
                subtitles_ocr:      { type: boolean, description: 'PGS / VOBSUB → text WebVTT via Tesseract; needs ffmpeg + tesseract.' }
                oidc:               { type: boolean }
                ldap:               { type: boolean }
                device_pairing:     { type: boolean, description: 'PIN-based native client device pairing.' }
                plugins:            { type: boolean, description: 'Outbound MCP plugin host.' }
                backup:             { type: boolean, description: 'pg_dump-backed backup endpoint; false when pg_dump is missing.' }
                people_credits:     { type: boolean, description: 'TMDB-sourced cast / crew; needs a TMDB API key (Settings, TMDB_API_KEY, or a bundled key).' }
                photos:             { type: boolean }
                music:              { type: boolean }
                webhooks:           { type: boolean }
                notifications:      { type: boolean, description: 'Real-time SSE notifications + in-app inbox.' }
                requests:           { type: boolean, description: 'TMDB discover + media-request workflow with Sonarr/Radarr fan-out; needs a TMDB API key (Settings, TMDB_API_KEY, or a bundled key). Whether the signed-in account may request is per user: GET /api/v1/requests/quota.' }
                upcoming:           { type: boolean, description: 'At least one enabled Radarr or Sonarr feeds GET /api/v1/upcoming. Follows admin configuration within about 30 s.' }
                live_tv:            { type: boolean, description: 'The Live TV subsystem is built in and wired. Says nothing about tuners; see live_tv_configured.' }
                dvr:                { type: boolean, description: 'Recording rules + retention; rides Live TV.' }
                live_tv_configured: { type: boolean, description: 'live_tv, and at least one enabled tuner is set up. Clients may hide their Live TV / DVR entry points when false. Follows admin configuration within about 30 s; absent on older servers.' }
                lyrics:             { type: boolean, description: 'Embedded USLT extraction + LRCLIB / .lrc fallback.' }
                intro_markers:      { type: boolean, description: 'AcoustID intro detection + ffmpeg blackdetect credits; needs fpcalc + ffmpeg.' }
                chapters:           { type: boolean }
                web_downloads:      { type: boolean, description: 'Server-wide admin toggle for the watch-page Download button. Default false; admin opt-in via Settings → General → Sharing.' }
                progress_without_duration: { type: boolean, description: 'PUT /items/{id}/progress may omit duration_ms: the server fills it from the file when it knows it and otherwise keeps the stored duration. False until the database has migration 00035_watch_progress_keep_duration applied (re-read every minute and at each /health/ready probe); clients omit duration_ms only when it is true.' }
            codecs:
              type: object
              properties:
                video:       { type: array, items: { type: string }, description: 'Output video codecs the transcoder can target.' }
                audio:       { type: array, items: { type: string }, description: 'Output audio codecs the transcoder can target.' }
                containers:  { type: array, items: { type: string }, description: 'Output containers (mp4, mkv, ts, webm).' }
                hardware:    { type: array, items: { type: string }, description: 'Active hardware encoders (h264_nvenc, hevc_amf, etc.) — empty when running software-only.' }
                hdr_tonemap: { type: boolean }
            limits:
              type: object
              properties:
                max_upload_bytes:           { type: integer, format: int64 }
                max_transcode_bitrate_kbps: { type: integer }
                max_transcode_width:        { type: integer }
                max_transcode_height:       { type: integer }
                max_concurrent_transcodes:  { type: integer }
                live_tv_tune_count:         { type: integer, description: 'Total tuner-slot count across configured tuners.' }
            discovery:
              type: object
              properties:
                udp_port: { type: integer, description: 'LAN discovery beacon port; omitted when discovery is disabled.' }

    # ── Libraries / items ──────────────────────────────────────────────────
    Library:
      type: object
      properties:
        id:           { type: string, format: uuid }
        name:         { type: string }
        type:
          type: string
          enum: [movie, show, anime, music, photo, mixed, audiobook, podcast, music_video, home_video, book, dvr]
        scan_paths:   { type: array, items: { type: string } }
        item_count:   { type: integer, format: int64 }
        is_private:
          type: boolean
          description: |
            v2.1. When false (default) every authenticated user can see
            this library. When true, access requires an explicit row in
            `library_access`. Admins always bypass the check.
        auto_grant_new_users:
          type: boolean
          description: |
            v2.1. When true on a private library, every newly-created
            non-admin user (invite accept, OIDC/SAML/LDAP JIT
            provisioning, admin-create) is automatically granted
            access. No-op on public libraries — the UI hides the
            toggle there since the grant is meaningless.
        trickplay_enabled:
          type: boolean
          description: |
            v2.5. Automatic seek-bar thumbnail (trickplay) generation: after
            each scan the library's video items without sprites are queued,
            and the nightly `trickplay_backfill` task works through the rest.
            On by default for movie/show/anime/cartoons/home_video libraries.
        nfo_collections:
          type: string
          enum: ['off', sets, sets_and_tags]
          description: |
            v2.6. Import movie.nfo groupings as manual collections: `sets`
            makes a collection per `<set>`, `sets_and_tags` also per `<tag>`.
            Movies join as they're enriched, the daily `nfo_collections` task
            re-reads the NFO files, and turning it on imports the existing
            ones in the background. Membership is only ever added. A `<set>`
            that is a TMDB collection the server already tracks as a film series
            (by its `tmdbSet` / `tmdbcolid` id or name) is skipped. Default off.
        episode_order:
          type: string
          enum: [aired, dvd, absolute]
          description: |
            v2.6. The order the library's shows are numbered in unless a show
            sets its own (`PUT /items/{id}/episode-order`): `aired` (default),
            `dvd` or `absolute`. Only meaningful for show / anime / cartoons
            libraries.
        save_nfo:
          type: boolean
          description: |
            v2.6. Write Kodi-compatible NFO files next to the media after
            enrichment, a manual metadata edit or Fix Match: `<file>.nfo` (or
            the `movie.nfo` already there) for movies, `tvshow.nfo` for shows,
            `<episode file>.nfo` for episodes. Only files OnScreen wrote
            (marked `<!-- written by OnScreen -->`) are replaced; local
            storage only. Default off.
        created_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time }
    LibraryListEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Library' }
    LibraryCreate:
      type: object
      required: [name, type, scan_paths]
      properties:
        name:       { type: string }
        type:
          type: string
          enum: [movie, show, anime, music, photo, mixed, audiobook, podcast, music_video, home_video, book, dvr]
        scan_paths: { type: array, items: { type: string } }
        is_private: { type: boolean, default: false }
        auto_grant_new_users:
          type: boolean
          default: false
          description: Server silently drops to false on public libraries (is_private=false).
        trickplay_enabled:
          type: boolean
          description: Omit for the per-type default (on for video library types, off otherwise).
        nfo_collections: { type: string, enum: ['off', sets, sets_and_tags], default: 'off' }
        episode_order:   { type: string, enum: [aired, dvd, absolute], default: aired }
        save_nfo:        { type: boolean, default: false }
    LibraryUpdate:
      type: object
      description: |
        True PATCH semantics (since 2026-05-03): every field is
        optional and falls back to the current row's value. Sending
        `{"is_private": true}` alone is sufficient to flip the flag;
        no need to round-trip the whole library. Unknown fields are
        rejected with HTTP 400 (DisallowUnknownFields) so a typo
        like `is-private` returns a clear error instead of silently
        being dropped.
      properties:
        name:       { type: string }
        scan_paths: { type: array, items: { type: string } }
        agent:      { type: string, description: 'Metadata agent slug (e.g. tmdb, tvdb, musicbrainz, openlibrary, none).' }
        language:   { type: string, description: 'ISO 639-1 code, e.g. "en" / "ja". Used by the metadata agent.' }
        scan_interval_minutes:        { type: integer, description: 'Minutes between auto-scans. Mutually exclusive with scan_interval_ns; minutes wins if both set.' }
        scan_interval_ns:             { type: integer, format: int64, description: 'Scan interval in nanoseconds (Go time.Duration).' }
        metadata_refresh_interval_ns: { type: integer, format: int64, description: 'Metadata refresh interval in nanoseconds (Go time.Duration).' }
        is_private:
          type: boolean
          nullable: true
          description: PATCH semantics — omit to preserve current value, send true/false to flip.
        auto_grant_new_users:
          type: boolean
          nullable: true
        trickplay_enabled:
          type: boolean
          nullable: true
          description: PATCH semantics — omit to preserve current value.
        nfo_collections:
          type: string
          enum: ['off', sets, sets_and_tags]
          description: Omit to preserve. Changing it to sets or sets_and_tags starts a background import of the library's movie.nfo files.
        episode_order:
          type: string
          enum: [aired, dvd, absolute]
          description: Omit to preserve. Changing it on a show / anime / cartoons library re-enriches, in the background, every show that follows the library's order.
        save_nfo:
          type: boolean
          nullable: true
          description: Omit to preserve. NFO files are written as titles are next enriched, edited or re-matched.
    GenreCount:
      type: object
      properties:
        name:  { type: string }
        count: { type: integer, format: int64 }
    YearCount:
      type: object
      properties:
        year:  { type: integer }
        count: { type: integer, format: int64 }
    MediaItem:
      type: object
      properties:
        id:           { type: string, format: uuid }
        library_id:   { type: string, format: uuid }
        title:        { type: string }
        type:         { type: string }
        year:         { type: integer, nullable: true }
        summary:      { type: string, nullable: true }
        rating:       { type: number, format: float, nullable: true }
        duration_ms:  { type: integer, format: int64, nullable: true }
        poster_path:  { type: string, nullable: true }
        thumb_path:   { type: string, nullable: true }
        content_rating: { type: string, nullable: true }
        parent_id:
          type: string
          format: uuid
          description: Library listing only, rows below the top level (via `type`). The parent item — an album's artist.
        parent_title:
          type: string
          description: Library listing only, alongside `parent_id`. The parent's title — an album's artist name.
        watch_state:
          type: string
          enum: [watched, in_progress, unwatched]
          description: Library listing only, playable videos only. The caller's watch state.
        view_offset_ms:
          type: integer
          format: int64
          description: Library listing only, playable videos only. Resume point, when there is one.
        leaf_count:
          type: integer
          format: int64
          description: Library listing only, shows and seasons only. Episodes within the caller's content-rating ceiling.
        unwatched_count:
          type: integer
          format: int64
          description: Library listing only, shows and seasons only. How many of those episodes the caller has not watched.
    MediaItemListEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/MediaItem' }
        meta:
          type: object
          properties:
            total:  { type: integer, format: int64 }
            cursor: { type: string }
    AudioStream:
      type: object
      properties:
        index:    { type: integer }
        codec:    { type: string }
        channels: { type: integer }
        language: { type: string }
        title:    { type: string }
        profile:
          type: string
          description: |
            v2.6. ffprobe's codec profile, which tells the lossless and
            object-audio variants from their core codec: "DTS-HD MA",
            "Dolby TrueHD + Dolby Atmos", "Dolby Digital Plus + Dolby Atmos",
            "LC". Absent when ffprobe gives none, and on files probed before
            the field until a metadata reprobe.
    SubtitleStream:
      type: object
      properties:
        index:    { type: integer }
        codec:    { type: string }
        language: { type: string }
        title:    { type: string }
        forced:   { type: boolean }
        sdh:      { type: boolean }
        default:
          type: boolean
          description: |
            v2.5. The file marks this track default (ffprobe disposition).
            Clients with no subtitle-language preference show it. False on
            files probed before the field until a metadata reprobe
            (POST /api/v1/maintenance/reprobe-metadata).
        offset_ms:
          type: integer
          description: |
            v2.6. The admin's server-wide timing correction in ms
            (positive = later), already applied to the cues
            /media/subtitles/{fileId}/{index} serves. Informational:
            clients must not shift by it again. 0 when none.
        image_based:
          type: boolean
          description: |
            v2.6. A picture subtitle (PGS, VobSub, DVB, XSUB), which
            /media/subtitles can't serve as text. Play it through its OCR'd
            text version (`text_version_id`) or burn it into a transcode
            (`burn_subtitle_stream_index` on POST /items/{id}/transcode).
        text_version_id:
          type: string
          description: |
            v2.6. The id of this stream's OCR'd text version among the file's
            `external_subtitles` (source "ocr", source_id "stream_<index>").
            Absent until one has been made.
    ExternalSubtitle:
      type: object
      properties:
        id:       { type: string, format: uuid }
        language: { type: string }
        format:   { type: string }
        url:      { type: string }
        offset_ms:
          type: integer
          description: |
            v2.6. The admin's server-wide timing correction in ms
            (positive = later), already applied to the cues `url` serves.
            Informational: clients must not shift by it again.
    Chapter:
      type: object
      properties:
        title:    { type: string }
        start_ms: { type: integer, format: int64 }
        end_ms:   { type: integer, format: int64 }
        thumb_url:
          type: string
          description: |
            The chapter's thumbnail, `/trickplay/{item_id}/chapter_NNN.jpg`
            (320 px wide, taken at the chapter start plus min(5 s, 10% of
            its length)). Present only on the chapters of the file the item's
            seek-bar sprites were cut from, once they exist; same auth as the
            sprites (Bearer / cookie, or an asset `?token=`). Added in
            migration 00051.
    Marker:
      type: object
      properties:
        kind:     { type: string, enum: [intro, recap, credits] }
        start_ms: { type: integer, format: int64 }
        end_ms:   { type: integer, format: int64 }
        source:   { type: string }
    ItemFile:
      type: object
      properties:
        id:                { type: string, format: uuid }
        stream_url:        { type: string }
        stream_token:
          type: string
          description: |
            v2.1. PASETO v4.local token, 24 h TTL, file_id-bound, with
            `purpose="stream"` claim. Native players (ExoPlayer, Roku
            Video, Tizen AVPlay, mpv) bypass the OkHttp / fetch token-
            refresh paths, so a 1 h access token used to expire mid-
            stream and surface as ERROR_CODE_IO_BAD_HTTP_STATUS on the
            next range request — this token replaces it on
            `?token=…` query auth (no Bearer header on the asset
            routes). Boundaries enforced server-side: (1) the embedded
            file_id claim must match the URL `{id}`, so a leaked URL
            can't be repurposed across files; (2) the purpose=stream
            claim is rejected on `/api/v1/*` Bearer auth, so a leaked
            stream URL grants only file-scoped read, not general API
            access. A fresh token is minted on every `/items/{id}`
            response (no server-side caching) so clients can refresh
            without a server restart.
        container:         { type: string, nullable: true }
        video_codec:       { type: string, nullable: true }
        audio_codec:       { type: string, nullable: true }
        resolution_w:      { type: integer, nullable: true }
        resolution_h:      { type: integer, nullable: true }
        bitrate:           { type: integer, format: int64, nullable: true }
        hdr_type:          { type: string, nullable: true, description: 'What a player without Dolby Vision has to handle: hdr10, hlg, dolby_vision (profile 5 only, no compatible base layer), or absent for SDR. A Dolby Vision file with an HDR10 / HLG / SDR base layer reports that base layer.' }
        dv_profile:        { type: integer, nullable: true, description: 'v2.5.1. Dolby Vision profile from the file''s configuration record (5, 7, 8, ...); absent when the file has none.' }
        frame_rate:        { type: number, format: double, nullable: true, description: 'Video frames per second as probed (e.g. 23.976, 25, 59.94). TV clients match the display refresh rate to it.' }
        duration_ms:       { type: integer, format: int64, nullable: true, description: 'This file''s own length. For one part of a multi-part movie it is that part''s length; the item''s duration_ms is the whole movie''s.' }
        edition:           { type: string, nullable: true, description: 'v2.6. Edition label from the file name ("Director''s Cut", "Extended", a Jellyfin "1080p" version suffix, Plex {edition-…}); absent when the name gives none. Show it in a version picker in place of the resolution/codec description.' }
        part_index:        { type: integer, nullable: true, description: 'v2.6. 1-based part number when this file is one part of a multi-part (stacked) movie, e.g. "cd1" + "cd2"; absent for every other file, including a lone "cd1". The server streams all parts as one movie: a transcode or playback decision for any part''s file_id covers the whole movie from part 1, and such a file is never direct-played. Each part still downloads on its own.' }
        faststart:         { type: boolean }
        bit_depth:             { type: integer, nullable: true, description: 'Audio bit depth (e.g. 16, 24). Music files only.' }
        sample_rate:           { type: integer, nullable: true, description: 'Audio sample rate in Hz (e.g. 44100, 96000). Music files only.' }
        channel_layout:        { type: string, nullable: true, description: 'Channel layout label (mono, stereo, 5.1, …). Music files only.' }
        lossless:              { type: boolean, nullable: true, description: 'True for FLAC/ALAC/WAV/etc. Music files only.' }
        replaygain_track_gain: { type: number, format: double, nullable: true, description: 'ReplayGain track gain in dB. Music files only.' }
        replaygain_track_peak: { type: number, format: double, nullable: true, description: 'ReplayGain track peak (linear; can exceed 1.0). Music files only.' }
        replaygain_album_gain: { type: number, format: double, nullable: true, description: 'ReplayGain album gain in dB. Music files only.' }
        replaygain_album_peak: { type: number, format: double, nullable: true, description: 'ReplayGain album peak (linear; can exceed 1.0). Music files only.' }
        replaygain_source:
          type: string
          enum: [tags, analyzed]
          description: |
            Where the replaygain_* values came from: the file's own tags, or
            the opt-in loudness_analysis task (EBU R128 integrated loudness and
            true peak, ReplayGain 2.0 at −18 LUFS; album gain from the album's
            tracks together). Tag values are never replaced by an analysis.
            Omitted when the file has no ReplayGain. Additive (v2.6).
        audio_streams:     { type: array, items: { $ref: '#/components/schemas/AudioStream' } }
        subtitle_streams:  { type: array, items: { $ref: '#/components/schemas/SubtitleStream' } }
        external_subtitles: { type: array, items: { $ref: '#/components/schemas/ExternalSubtitle' } }
        chapters:          { type: array, items: { $ref: '#/components/schemas/Chapter' } }
        commercials:
          type: array
          description: >
            Ad breaks DVR commercial detection found in this file; absent when
            none are stored. Kept out of the item's `markers` on purpose:
            clients render every marker as Skip intro / Skip credits.
          items: { $ref: '#/components/schemas/CommercialMarker' }
    CommercialMarker:
      type: object
      properties:
        start_ms: { type: integer, format: int64 }
        end_ms:   { type: integer, format: int64 }
        source:   { type: string, enum: [comskip, heuristic] }
    DVRSettings:
      type: object
      properties:
        remux:               { type: boolean, description: 'Stream-copy the capture into remux_container with regenerated timestamps.' }
        remux_container:     { type: string, enum: [mkv, mp4], default: mkv }
        transcode:           { type: boolean, description: 'Re-encode video to save space (audio copied). Hardware encoders the transcode settings allow are tried first; software is the fallback.' }
        transcode_codec:     { type: string, enum: [h264, hevc], default: h264 }
        transcode_quality:   { type: string, enum: [high, balanced, small], default: balanced }
        delete_original:     { type: boolean, description: 'Delete the capture once the processed copy passes verification (duration within 2%, streams present). Off keeps it in a .dvr-originals folder the scanner skips.' }
        commercials:         { type: string, enum: ['off', mark, cut], default: 'off' }
        script_configured:   { type: boolean, readOnly: true }
        script_path:         { type: string, readOnly: true }
        comskip_configured:  { type: boolean, readOnly: true }
        commercial_detector: { type: string, enum: [comskip, builtin], readOnly: true }
    ItemDetail:
      type: object
      properties:
        id:             { type: string, format: uuid }
        library_id:     { type: string, format: uuid }
        title:          { type: string }
        type:           { type: string }
        year:           { type: integer, nullable: true }
        summary:        { type: string, nullable: true }
        rating:         { type: number, format: float, nullable: true }
        external_ratings:
          type: object
          description: 'Movies and shows only *(v2.6)*, omitted until the server (with an OMDb key) has fetched scores for the title''s IMDb ID. Each score is omitted when OMDb has none.'
          properties:
            imdb_id:         { type: string }
            imdb_rating:     { type: number, minimum: 0, maximum: 10 }
            imdb_votes:      { type: integer }
            rotten_tomatoes: { type: integer, minimum: 0, maximum: 100, description: "Critics' Tomatometer, percent." }
            metacritic:      { type: integer, minimum: 0, maximum: 100 }
        duration_ms:    { type: integer, format: int64, nullable: true, description: 'Running time. For a multi-part movie whose first version is stacked (files[].part_index), the parts'' combined length — the timeline its stream and progress use.' }
        poster_path:    { type: string, nullable: true }
        fanart_path:    { type: string, nullable: true }
        logo_path:      { type: string, description: 'v2.6, omitted when none. A transparent clear logo (PNG), served via /artwork/ like poster_path. Fetch it without ?w=/?h=: a resize re-encodes as JPEG and loses the transparency.' }
        banner_path:    { type: string, description: 'v2.6, omitted when none. A wide banner image (movies, shows, artists).' }
        disc_art_path:  { type: string, description: 'v2.6, omitted when none. Disc / CD art (movies, albums), usually a transparent PNG.' }
        studios:
          type: array
          description: 'v2.6. Movies: production companies; shows: networks; in the provider''s order. Omitted when none.'
          items:
            type: object
            properties:
              id:   { type: string, format: uuid }
              name: { type: string }
              kind: { type: string, enum: [studio, network] }
        content_rating: { type: string, nullable: true }
        genres:         { type: array, items: { type: string } }
        parent_id:      { type: string, nullable: true, format: uuid }
        grandparent_id: { type: string, nullable: true, format: uuid, description: 'Parent of the parent: for an episode this is the show id (episode -> season -> show), so a client can open the show page directly instead of replaying history. Best-effort; may be unset when unresolved.' }
        index:          { type: integer, nullable: true }
        index_end:      { type: integer, description: 'v2.6. Episodes only, omitted for a single episode: the last episode a multi-episode file covers ("S01E01-E02" is one episode with index 1, index_end 2).' }
        episode_order:  { type: string, enum: [aired, dvd, absolute], description: 'v2.6. Shows only: the show''s own episode order. Omitted when the show follows its library''s episode_order.' }
        view_offset_ms: { type: integer, format: int64, description: 'Resume point, including a rewatch in progress of a watched title.' }
        watch_state:    { type: string, enum: [watched, in_progress, unwatched], description: 'Playable videos only (omitted otherwise). The caller''s watch state, manual marks included.' }
        is_favorite:    { type: boolean }
        updated_at:     { type: integer, format: int64 }
        files:          { type: array, items: { $ref: '#/components/schemas/ItemFile' } }
        markers:        { type: array, items: { $ref: '#/components/schemas/Marker' } }
        optimized_versions:
          type: array
          items: { $ref: '#/components/schemas/OptimizedVersion' }
          description: Pre-made MP4 copies (admin "Optimize…"), highest bitrate first. Never part of `files`. Omitted when none (v2.6).
        musicbrainz_id:               { type: string, format: uuid, nullable: true, description: 'Primary MBID for the row''s type (recording for tracks, release-group for albums, artist for artists).' }
        musicbrainz_release_id:       { type: string, format: uuid, nullable: true }
        musicbrainz_release_group_id: { type: string, format: uuid, nullable: true }
        musicbrainz_artist_id:        { type: string, format: uuid, nullable: true }
        musicbrainz_album_artist_id:  { type: string, format: uuid, nullable: true }
        disc_total:    { type: integer, nullable: true }
        track_total:   { type: integer, nullable: true }
        original_year: { type: integer, nullable: true, description: 'Original work release year, distinct from `year` (which may reflect a reissue).' }
        compilation:   { type: boolean, description: 'True for various-artists compilations.' }
        release_type:  { type: string, nullable: true, description: 'MusicBrainz vocabulary: album, single, ep, live, soundtrack, …' }
        collection:
          type: object
          description: 'Movies only, omitted when none: the franchise collection the movie belongs to. part_count is how many films of the franchise the caller would see on the collection page (owned + visible missing parts); owned_count how many of those are in the server and visible to the caller.'
          properties:
            id:          { type: string, format: uuid }
            name:        { type: string }
            part_count:  { type: integer }
            owned_count: { type: integer }
        collections:
          type: array
          description: 'Movies and shows, omitted when none (v2.6): the manual collections the item is in.'
          items:
            type: object
            properties:
              id:   { type: string, format: uuid }
              name: { type: string }
        sort_title: { type: string, description: '*(v2.6)* Omitted when empty.' }
        tagline:    { type: string, nullable: true, description: '*(v2.6)*' }
        locked_fields:
          type: array
          items: { type: string }
          description: '*(v2.6)* Metadata fields an admin edited, which refreshes leave alone ([] when none). See PATCH /api/v1/items/{id} for the names; `originally_available_at` is `taken_at`.'
        labels:
          type: array
          items: { type: string }
          description: 'Admins only, omitted otherwise and when the item has none *(v2.6)*: the item''s own admin labels (not those inherited from its show / album), which per-user label restrictions match. See PUT /api/v1/items/{id}/labels.'
    SimilarArtist:
      type: object
      required: [id, title, updated_at, score, shared_genres, co_listened]
      properties:
        id:            { type: string, format: uuid }
        title:         { type: string }
        poster_path:   { type: string }
        updated_at:    { type: integer, format: int64, description: 'Unix ms; artwork cache-buster.' }
        score:         { type: number, format: double, minimum: 0, maximum: 1 }
        shared_genres: { type: array, items: { type: string }, description: 'Genres shared with the artist asked about (lower-case).' }
        co_listened:   { type: boolean, description: 'People who listen to one listen to the other.' }

    ArtistAppearance:
      type: object
      required: [id, title, role, album_id, album_title, album_updated_at]
      properties:
        id:                 { type: string, format: uuid, description: 'The track.' }
        title:              { type: string }
        index:              { type: integer }
        disc_number:        { type: integer }
        duration_ms:        { type: integer, format: int64 }
        role:               { type: string, enum: [featured, artist], description: '"featured" for a feat. credit; "artist" for another credit (a compilation track''s performer).' }
        album_id:           { type: string, format: uuid }
        album_title:        { type: string }
        album_year:         { type: integer }
        album_poster_path:  { type: string }
        album_updated_at:   { type: integer, format: int64 }
        album_artist_id:    { type: string, format: uuid }
        album_artist_title: { type: string }

    MixTrack:
      type: object
      required: [id, title, album_id, album_title, file_id]
      properties:
        id:                    { type: string, format: uuid }
        title:                 { type: string }
        duration_ms:           { type: integer, format: int64 }
        index:                 { type: integer }
        album_id:              { type: string, format: uuid }
        album_title:           { type: string }
        album_poster_path:     { type: string }
        artist_id:             { type: string, format: uuid, description: 'The album artist.' }
        artist_title:          { type: string }
        file_id:               { type: string, format: uuid, description: 'The file to stream (/media/stream/{file_id}): lossless first, then highest bitrate.' }
        replaygain_track_gain: { type: number, format: double }
        replaygain_track_peak: { type: number, format: double }
        replaygain_album_gain: { type: number, format: double }
        replaygain_album_peak: { type: number, format: double }

    ChildItem:
      type: object
      properties:
        id:             { type: string, format: uuid }
        title:          { type: string }
        type:           { type: string }
        year:           { type: integer, nullable: true }
        summary:        { type: string, nullable: true }
        rating:         { type: number, format: float, nullable: true }
        duration_ms:    { type: integer, format: int64, nullable: true }
        poster_path:    { type: string, nullable: true }
        thumb_path:     { type: string, nullable: true }
        index:          { type: integer, nullable: true }
        index_end:      { type: integer, description: 'v2.6. Episodes only, omitted for a single episode: the last episode a multi-episode file covers.' }
        disc_number:
          type: integer
          nullable: true
          description: >-
            Tracks only: the disc within the album (`index` is the track on
            that disc). Absent means no disc tag — read it as disc 1.
            Children are returned in (disc, index) order.
        originally_available_at:
          type: string
          format: date
          description: Release date when known — a podcast episode's publish date.
        view_offset_ms: { type: integer, format: int64 }
        watched:        { type: boolean }
        created_at:     { type: string, format: date-time }
        updated_at:     { type: integer, format: int64 }
    MatchCandidate:
      type: object
      properties:
        tmdb_id:    { type: integer }
        title:      { type: string }
        year:       { type: integer }
        summary:    { type: string }
        poster_url: { type: string }
        rating:     { type: number, format: float }
    PhotoEXIF:
      type: object
      properties:
        taken_at:        { type: string, format: date-time, nullable: true }
        camera_make:     { type: string, nullable: true }
        camera_model:    { type: string, nullable: true }
        lens_model:      { type: string, nullable: true }
        focal_length_mm: { type: number, format: float, nullable: true }

    # ── Search / Hub / History / Favorites ─────────────────────────────────
    SearchResult:
      type: object
      properties:
        id:          { type: string, format: uuid }
        library_id:  { type: string, format: uuid }
        title:       { type: string }
        type:        { type: string }
        year:        { type: integer, nullable: true }
        poster_path: { type: string, nullable: true }
        thumb_path:  { type: string, nullable: true }
    Hub:
      type: object
      description: |
        Home-hub aggregation. v2.1 split Continue-Watching into three
        kinds (TV / movies / other) so clients can render the per-
        kind rows the test plan + native clients expect. The legacy
        combined `continue_watching` is retained on the response for
        older clients; new clients should prefer the per-kind arrays.
        `cooccurrence` / `because_you_watched` were built then
        removed before v2.1 ship — the response will not surface
        them; the absence is locked behind an e2e contract test.
        Every hub section honours the caller's `max_content_rating`
        ceiling (set via PUT /users/{id}/content-rating).
      properties:
        continue_watching:
          type: array
          items: { $ref: '#/components/schemas/ChildItem' }
          description: Legacy combined feed (movies + episodes interleaved). Kept for older clients.
        continue_watching_tv:
          type: array
          items: { $ref: '#/components/schemas/ChildItem' }
          description: |
            v2.1. TV-only continue-watching, deduped to one tile per
            series (the most recently watched episode).
        continue_watching_movies:
          type: array
          items: { $ref: '#/components/schemas/ChildItem' }
          description: v2.1. Movies-only continue-watching.
        continue_watching_other:
          type: array
          items: { $ref: '#/components/schemas/ChildItem' }
          description: v2.1. Audiobooks / podcasts / home video / other types.
        recently_added:
          type: array
          items: { $ref: '#/components/schemas/MediaItem' }
        recently_added_by_library:
          type: array
          items: { $ref: '#/components/schemas/HubLibraryRow' }
          description: |
            v2.1. One row per visible library, latest-N items each.
            Lets clients render a "Recently added in <Library>"
            shelf without a separate per-library API call.
        trending:
          type: array
          items: { $ref: '#/components/schemas/ChildItem' }
          description: |
            v2.1. Global "what others are watching" row over the last
            7 days. Same content for every user (no personalisation),
            filtered by the caller's library access + parental
            ceiling. 30 raw rows narrowed to 12 after access-filter.
        next_up:
          type: array
          items: { $ref: '#/components/schemas/NextUpItem' }
          description: |
            The next unwatched episode of each show the caller has
            finished at least one episode of and has nothing resumable
            in (resumable shows are on continue_watching_tv). Most
            recent activity first, at most 20. Excludes dismissed shows
            and episodes/shows over the caller's ceiling. Always present
            (possibly empty); per-user layout key `next_up`.
        plan_to_watch:
          type: array
          items: { $ref: '#/components/schemas/ChildItem' }
          description: |
            Items the caller set to Plan to Watch (watch-status), most
            recently set first, at most 20, minus anything now fully
            watched. Always present (possibly empty); per-user layout
            key `plan_to_watch`.
        collection_rows:
          type: array
          description: |
            v2.6. The manual collections an admin put on the home screen
            (`promoted`), each with up to 20 members the caller can see, in
            the collection's order; a collection with none visible is left
            out. Always present (possibly empty); per-user layout key
            `collection:<collection_id>`.
          items:
            type: object
            properties:
              collection_id: { type: string, format: uuid }
              name:          { type: string }
              items:
                type: array
                items: { $ref: '#/components/schemas/ChildItem' }
    NextUpItem:
      type: object
      description: An episode tile. Art is the show's (poster / fanart); thumb_path is the episode still when there is one.
      properties:
        id:             { type: string, format: uuid, description: Episode id. }
        title:          { type: string, description: Episode title. }
        type:           { type: string, enum: [episode] }
        show_id:        { type: string, format: uuid }
        show_title:     { type: string }
        season_number:  { type: integer, description: '0 when unknown.' }
        episode_number: { type: integer, description: '0 when unknown.' }
        episode_number_end: { type: integer, description: 'v2.6. The last episode of a multi-episode file; omitted for a single episode.' }
        year:           { type: integer, nullable: true, description: Show year. }
        poster_path:    { type: string, nullable: true }
        fanart_path:    { type: string, nullable: true }
        thumb_path:     { type: string, nullable: true }
        duration_ms:    { type: integer, format: int64, nullable: true }
        updated_at:     { type: integer, format: int64 }
    UpNext:
      type: object
      properties:
        mode: { type: string, enum: [resume, next, start, rewatch, none] }
        episode:
          type: object
          description: Omitted when mode is none.
          properties:
            id:             { type: string, format: uuid }
            title:          { type: string }
            season_id:      { type: string, format: uuid }
            season_number:  { type: integer }
            episode_number: { type: integer }
            episode_number_end: { type: integer, description: 'v2.6. The last episode of a multi-episode file; omitted for a single episode.' }
            view_offset_ms: { type: integer, format: int64, description: 'Set in resume mode.' }
            duration_ms:    { type: integer, format: int64 }
            thumb_path:     { type: string }
    HubLibraryRow:
      type: object
      properties:
        library_id:   { type: string, format: uuid }
        library_name: { type: string }
        items:        { type: array, items: { $ref: '#/components/schemas/ChildItem' } }
    WatchHistoryItem:
      type: object
      properties:
        id:           { type: string, format: uuid }
        media_id:     { type: string, format: uuid }
        title:        { type: string }
        type:         { type: string }
        year:         { type: integer, nullable: true }
        thumb_path:   { type: string, nullable: true }
        client_name:  { type: string, nullable: true }
        duration_ms:  { type: integer, format: int64, nullable: true }
        occurred_at:  { type: string, format: date-time }
    FavoriteItem:
      type: object
      properties:
        id:           { type: string, format: uuid }
        library_id:   { type: string, format: uuid }
        type:         { type: string }
        title:        { type: string }
        year:         { type: integer, nullable: true }
        summary:      { type: string, nullable: true }
        poster_path:  { type: string, nullable: true }
        thumb_path:   { type: string, nullable: true }
        duration_ms:  { type: integer, format: int64, nullable: true }
        favorited_at: { type: integer, format: int64, description: 'Unix milliseconds.' }

    WatchStatusBody:
      type: object
      description: |
        `GET` / `PUT /api/v1/items/{id}/watch-status`. The status fields
        appear twice: at the top level (the shape the handler answered with
        until v2.6, which the Android phone app reads) and under `data` (the
        house envelope the web and Android TV apps read). Both carry the
        same values.
      properties:
        status:
          type: string
          enum: ['', plan_to_watch, watching, completed, on_hold, dropped]
          description: Empty string = no status set yet.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        data:
          type: object
          properties:
            status:
              type: string
              enum: ['', plan_to_watch, watching, completed, on_hold, dropped]
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    WatchlistItem:
      type: object
      properties:
        id:                { type: string, format: uuid }
        library_id:        { type: string, format: uuid }
        type:              { type: string }
        title:             { type: string }
        year:              { type: integer, nullable: true }
        index:             { type: integer, nullable: true, description: 'Episode / season / track number.' }
        parent_id:         { type: string, format: uuid, nullable: true }
        parent_title:      { type: string, nullable: true, description: 'Season for an episode, album for a track, show for a season.' }
        parent_index:      { type: integer, nullable: true, description: 'Season number for an episode.' }
        grandparent_id:    { type: string, format: uuid, nullable: true }
        grandparent_title: { type: string, nullable: true, description: 'Show for an episode, artist for a track.' }
        poster_path:       { type: string, nullable: true, description: "The item's poster, else its parent's, else its grandparent's." }
        fanart_path:       { type: string, nullable: true }
        thumb_path:        { type: string, nullable: true }
        duration_ms:       { type: integer, format: int64, nullable: true }
        watch_state:       { type: string, enum: [watched, in_progress, unwatched], description: 'A show / season rolls up its episodes.' }
        status:            { type: string, enum: [plan_to_watch, watching, on_hold, completed, dropped] }
        status_created_at: { type: string, format: date-time, description: 'When the item first got a status.' }
        status_updated_at: { type: string, format: date-time, description: 'When it entered the current status.' }
      example:
        id: 7d0c1f9e-3a51-4c43-9d55-0a2b9f6c1e10
        library_id: 2b1f5d8a-6c2e-4b7a-8f0e-91c4d3e2a7b5
        type: episode
        title: The Rains of Castamere
        index: 9
        parent_id: 5c3e7a1b-9d2f-4e8a-b6c1-0f4d2e9a8b73
        parent_title: Season 3
        parent_index: 3
        grandparent_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
        grandparent_title: Game of Thrones
        poster_path: shows/got/poster.jpg
        watch_state: unwatched
        status: plan_to_watch
        status_created_at: '2026-10-01T18:22:04Z'
        status_updated_at: '2026-10-01T18:22:04Z'

    # ── People ─────────────────────────────────────────────────────────────
    PersonSummary:
      type: object
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string }
        photo_path:  { type: string, nullable: true }
    Credit:
      type: object
      properties:
        person_id:  { type: string, format: uuid }
        name:       { type: string }
        role:       { type: string, enum: [actor, director, writer] }
        character:  { type: string, nullable: true }
        photo_path: { type: string, nullable: true }
    Person:
      type: object
      properties:
        id:         { type: string, format: uuid }
        name:       { type: string }
        biography:  { type: string, nullable: true }
        birth_date: { type: string, format: date, nullable: true }
        photo_path: { type: string, nullable: true }
    Studio:
      type: object
      description: v2.6. A studio (production company) or TV network.
      properties:
        id:         { type: string, format: uuid }
        name:       { type: string }
        kind:       { type: string, enum: [studio, network] }
        tmdb_id:    { type: integer, description: 'TMDB company / network id, when known.' }
        item_count: { type: integer, format: int64, description: 'Titles the caller can see (within library_id when given).' }
    FilmographyEntry:
      type: object
      properties:
        item_id:     { type: string, format: uuid }
        title:       { type: string }
        year:        { type: integer, nullable: true }
        role:        { type: string }
        character:   { type: string, nullable: true }
        poster_path: { type: string, nullable: true }

    # ── Subtitles / Trickplay ──────────────────────────────────────────────
    SubtitleSearchResult:
      type: object
      properties:
        provider:         { type: string }
        provider_file_id: { type: string }
        language:         { type: string }
        release:          { type: string }
        downloads:        { type: integer }
        rating:           { type: number, format: float }
    DownloadOptions:
      type: object
      properties:
        file_id: { type: string, format: uuid, description: "The file a conversion would encode (a stacked movie's first part)." }
        bitrate_cap_kbps: { type: integer, description: 'The cap applied to this request; absent = none.' }
        qualities:
          type: array
          items:
            type: object
            properties:
              id:           { type: string, enum: [1080p_8mbps, 720p_4mbps, 720p_2mbps, 480p_1mbps] }
              label:        { type: string, example: '720p · 4 Mbps' }
              bitrate_kbps: { type: integer }
              max_height:   { type: integer }
              allowed:      { type: boolean }
    DownloadJob:
      type: object
      properties:
        id:            { type: string, format: uuid }
        item_id:       { type: string, format: uuid }
        file_id:       { type: string, format: uuid }
        title:         { type: string }
        item_type:     { type: string }
        quality:       { type: string }
        quality_label: { type: string }
        status:        { type: string, enum: [queued, running, ready, failed, expired] }
        progress:      { type: number, description: 'Encode progress, 0..1.' }
        error:         { type: string }
        size_bytes:    { type: integer, format: int64 }
        created_at:    { type: string, format: date-time }
        completed_at:  { type: string, format: date-time }
        expires_at:    { type: string, format: date-time, description: 'When a ready file may leave the cache.' }
        file_url:      { type: string, description: 'Present when ready: `/api/v1/downloads/{id}/file`.' }
    OptimizedVersion:
      type: object
      description: A playable optimized version (item detail, play decision).
      properties:
        id:             { type: string, format: uuid }
        file_id:        { type: string, format: uuid, description: The source file it was made from. }
        profile:        { type: string, enum: [mobile_720p, tv_1080p, original_compatible] }
        label:          { type: string }
        container:      { type: string, example: mp4 }
        video_codec:    { type: string, example: h264 }
        audio_codec:    { type: string, example: aac }
        audio_channels: { type: integer, example: 2 }
        width:          { type: integer }
        height:         { type: integer }
        bitrate_kbps:   { type: integer }
        size_bytes:     { type: integer, format: int64 }
        duration_ms:    { type: integer, format: int64 }
        stream_url:     { type: string, description: '`/media/optimized/{id}`' }
        stream_token:   { type: string, description: 24 h token bound to this version, for players that authenticate through the URL. }
    OptimizeJob:
      type: object
      properties:
        id:            { type: string, format: uuid }
        item_id:       { type: string, format: uuid }
        file_id:       { type: string, format: uuid }
        library_id:    { type: string, format: uuid }
        title:         { type: string }
        item_type:     { type: string }
        show_title:    { type: string }
        season_index:  { type: integer }
        episode_index: { type: integer }
        profile:       { type: string, enum: [mobile_720p, tv_1080p, original_compatible] }
        profile_label: { type: string }
        status:        { type: string, enum: [queued, running, ready, failed] }
        progress:      { type: number, description: 'Encode progress, 0..1.' }
        error:         { type: string }
        size_bytes:    { type: integer, format: int64 }
        width:         { type: integer }
        height:        { type: integer }
        bitrate_kbps:  { type: integer }
        duration_ms:   { type: integer, format: int64 }
        created_at:    { type: string, format: date-time }
        started_at:    { type: string, format: date-time }
        completed_at:  { type: string, format: date-time }
    RemoteAccess:
      type: object
      properties:
        map_port:          { type: boolean }
        external_port:     { type: integer, description: 0 = the listen port. }
        protocol:          { type: string, enum: [TCP] }
        listen_addr:       { type: string, example: ':7070' }
        listen_port:       { type: integer }
        loopback_only:     { type: boolean, description: The server listens on loopback only; nothing is ever mapped. }
        https:             { type: boolean, description: This server serves HTTPS itself. }
        reachability_hint: { type: string }
        status:
          type: object
          properties:
            enabled:       { type: boolean }
            state:         { type: string, enum: [disabled, loopback_only, standby, no_gateway, mapped, error] }
            gateway_found: { type: boolean }
            method:        { type: string, enum: [upnp, pcp, nat-pmp] }
            gateway_addr:  { type: string }
            local_ip:      { type: string }
            internal_port: { type: integer }
            external_ip:   { type: string }
            external_port: { type: integer }
            lease_seconds: { type: integer }
            permanent:     { type: boolean, description: The router only grants permanent mappings (re-asserted every 30 min). }
            last_renewal:  { type: string, format: date-time }
            expires_at:    { type: string, format: date-time }
            last_error:    { type: string }
            last_error_at: { type: string, format: date-time }
            node:          { type: string, description: The cluster node doing the mapping. }
            updated_at:    { type: string, format: date-time }
    TrickplayStatus:
      type: object
      description: |
        Per-item trickplay state. The per-item GET/POST responses carry it
        under `data` (the standard envelope) and, for older callers, also
        repeat the same fields at the top level of the body.
      properties:
        status:        { type: string, enum: [not_started, pending, done, failed, skipped] }
        sprite_count:  { type: integer }
        interval_sec:  { type: integer }
        thumb_width:   { type: integer }
        thumb_height:  { type: integer }
        last_error:    { type: string }
    TrickplayLibraryStatus:
      type: object
      description: |
        Per-library progress over the library's video items that have a
        playable file. pending = not generated yet (including in progress);
        failed includes items skipped for having no usable file.
      properties:
        enabled: { type: boolean, description: "The library's trickplay_enabled toggle." }
        total:   { type: integer, format: int64 }
        done:    { type: integer, format: int64 }
        pending: { type: integer, format: int64 }
        failed:  { type: integer, format: int64 }

    # ── Transcode ──────────────────────────────────────────────────────────
    TranscodeStartRequest:
      type: object
      description: |
        Body may be an empty object `{}` for "use defaults" — the
        server picks file_id (item's primary file), height (source
        height), and codec preferences from the source. Fields below
        are all optional.
      properties:
        file_id:
          type: string
          format: uuid
          description: 'Optional — defaults to the item''s primary file (highest-quality version per ADR-031).'
        height:
          type: integer
          description: 'Output height cap. 0 = no constraint (use source height).'
        position_ms:
          type: integer
          format: int64
          description: 'Resume position in milliseconds. The audio-picker re-issue path uses this so the new session lands at the same point.'
        video_copy:
          type: boolean
          description: |
            v2.1. Force the remux path (video stream copied unchanged,
            audio re-encoded if needed). Required for AV1 source remux —
            without it the server picks H.264 NVENC/QSV/AMF re-encode
            for browser compat, even on AV1-capable clients. The AV1
            fMP4 e2e test sets this true to validate the `#EXT-X-MAP`
            + `.m4s` segment shape.
        audio_stream_index:
          type: integer
          description: 'Audio track to play, counted among audio streams only: its position in the file''s `audio_streams` array (0 = first), not that entry''s absolute `index`. nil/omitted = default (first) audio stream. Past the last audio track: 400. On a remux (`video_copy`) this track is passed through untouched only when it is AAC, AC3, E-AC3 or MP3, the client declares that codec, and its channels fit the client''s maximum, or (v2.6) when the client lists its codec in the `audioPassthrough` capability, whatever its channels: AC3, E-AC3, TrueHD or DTS, the last two packaged as fMP4 segments (not for an audio-only file or a `segment_container: ts` request); otherwise it is re-encoded to AAC. Re-issuing the session with a different index drives the in-player audio picker.'
        supports_hevc:
          type: boolean
          description: 'Client can decode HEVC (H.265). Server uses this to pick HEVC output when transcoding (saves bandwidth) and to enable the HEVC-source remux path.'
        supports_av1:
          type: boolean
          description: |
            v2.1. Client can decode AV1. When the source is AV1 and
            this is true, the server picks the AV1 fMP4 remux path
            (av01 tag, .m4s segments, #EXT-X-MAP) over an H.264
            re-encode. Equivalent to setting `video_copy:true` for
            the AV1-source case but works generically: the server
            decides remux vs. re-encode from the source codec + this
            flag.
        segment_container:
          type: string
          enum: [ts]
          description: |
            v2.5. `ts` asks for MPEG-TS segments where the server would
            otherwise package HEVC output (an HEVC remux or HEVC re-encode)
            as fMP4: `.ts` segments, no `#EXT-X-MAP`, no `hvc1` tag. For
            players that decode HEVC but can't read the server's fMP4 HLS
            (Samsung AVPlay). Browsers must not send it (MSE can't take HEVC
            in TS). AV1 output stays fMP4 (MPEG-TS has no AV1 stream type);
            an Auto (ABR) start keeps the H.264 ladder. Absent = unchanged.
        audio_rate:
          type: number
          minimum: 0.5
          maximum: 3
          description: |
            v2.5. Speeds an audio-only source up (or down) on the server,
            pitch kept (ffmpeg atempo): for players that ignore playbackRate
            (Samsung's webview), e.g. an audiobook at 1.5x. Clamped to 0.5-3;
            ignored for a video source. The stream's clock then runs at
            content / rate; the response's audio_rate says what was applied.
        burn_subtitle_stream_index:
          type: integer
          nullable: true
          description: |
            v2.6. Paint a picture subtitle stream (PGS, VobSub, DVB, XSUB)
            into the video: the stream's ABSOLUTE index, the same number as
            the file's `subtitle_streams[].index`. null/omitted = no burn-in.
            A burn-in is always a full video re-encode on a single rendition:
            `video_copy` is ignored, and neither the adaptive ladder nor a
            pre-encoded one is used. The stream's timing offset applies (its
            own, else its OCR'd text version's). Validated before the
            caller's current session for the item is replaced, so a refusal
            leaves it playing: 400 `INVALID_SUBTITLE_STREAM` (not one of the
            file's subtitle streams), 400 `SUBTITLE_NOT_IMAGE` (a text track;
            the player renders those itself), 400 `BURN_IN_UNSUPPORTED` (a
            movie stored in several parts), 503 `BURN_IN_UNAVAILABLE` (no
            transcode worker advertises the burn-in feature yet). Seeking:
            a cue already showing at the start position may be skipped,
            depending on where the container seek lands; subtitles show from
            the next cue at the latest. Output is 8-bit.
    TranscodeStartResponse:
      type: object
      description: |
        DASH was removed 2026-04-30; this response **does not** contain
        a `manifest_url` field. The contract is HLS-only: callers use
        `playlist_url` + `token` to fetch the M3U8 and segments. Locked
        behind an e2e regression test that asserts `playlist_url` is
        present AND `manifest_url` is absent.
      properties:
        session_id:   { type: string, format: uuid }
        playlist_url:
          type: string
          description: |
            Already includes `?token=…` — clients pass the URL through
            unchanged to fetch the M3U8. Relative path; clients
            prepend the server base URL.
        token:
          type: string
          description: 'Per-session token for segment fetches. Different from the per-file ItemFile.stream_token; this one is bound to the session id, not a file id.'
        start_offset_sec:
          type: number
          format: double
          description: |
            v2.1. Content position the stream actually opens at —
            keyframe-aligned. May be earlier than the requested
            `position_ms` when video is being stream-copied (input-
            side `-ss` snaps back to the previous keyframe). Use this
            for scrubber-time mapping so the seek bar matches what's
            on screen instead of advertising an exact resume the
            codec can't honour.
        seg0_audio_gap_sec:
          type: number
          format: double
          description: |
            v2.1. Skip this many seconds of segment 0 on startup.
            With AC3 → AAC re-encode after a mid-stream `-ss`, the
            AAC encoder's first valid frame lands a few seconds
            after video's first packet — starting playback here
            gets A/V synced from the first audible frame instead of
            showing silent video while the audio pipeline warms up.
            0 when no gap was measurable.
        audio_rate:
          type: number
          format: double
          description: |
            v2.5. The playback speed the server applied to an audio-only
            session (request `audio_rate`). Absent or 0 when none was
            applied: a client that asked for a speed and gets 0 back is
            on a server without it, and plays at 1x.
        burned_subtitle_stream_index:
          type: integer
          description: |
            v2.6. Echoes `burn_subtitle_stream_index` when the session paints
            that subtitle stream into the picture. Absent otherwise, which is
            also what a server without burn-in answers: a client that asked
            and gets no echo should show the track another way.
        segment_format:
          type: string
          enum: [ts, fmp4]
          description: |
            v2.6. The container of the session's HLS segments: `ts`
            (MPEG-TS `.ts`) or `fmp4` (`.m4s` with an `EXT-X-MAP` init
            segment). For a player that must be told up front instead of
            reading the playlist: a Chromecast's Default Media Receiver needs
            it as `hlsSegmentFormat` / `hlsVideoSegmentFormat` in the LOAD
            (see docs/capability-profiles.md, "Chromecast (Default Media
            Receiver)"). Exact for a remux and for an ABR ladder. For a
            single-rendition re-encode that preferred HEVC or AV1 it is the
            prediction: a worker without that encoder falls back to H.264 in
            `.ts`, which the media playlist then shows (the playlist is
            authoritative once served). Absent on a pre-encoded (static)
            ladder, whose master playlist lists its CODECS.

    # ── Notifications / Sessions ───────────────────────────────────────────
    Notification:
      type: object
      properties:
        id:         { type: string, format: uuid }
        type:       { type: string }
        title:      { type: string }
        body:       { type: string }
        item_id:    { type: string, format: uuid, nullable: true }
        read:       { type: boolean }
        created_at: { type: integer, format: int64, description: 'Unix milliseconds.' }
    Session:
      type: object
      properties:
        id:           { type: string }
        user_id:      { type: string, format: uuid }
        username:
          type: string
          description: The viewer's account — for a managed profile, the owning account (see profile_name).
        profile_name: { type: string, description: Managed profile name when the viewer is one. }
        client_name:  { type: string }
        client_ip:    { type: string, description: Viewer's address. Admin callers only. }
        location:     { type: string, enum: [lan, remote], description: Same local-address rule as the first-run setup gate. }
        item_id:      { type: string, format: uuid }
        title:        { type: string }
        year:         { type: integer }
        type:         { type: string }
        poster_path:  { type: string }
        parent_title: { type: string }
        position_ms:  { type: integer, format: int64 }
        duration_ms:  { type: integer, format: int64 }
        bitrate_kbps: { type: integer }
        selected_rendition: { type: string, description: ABR rung the player settled on. }
        decision:     { type: string, enum: [directPlay, directStream, remux, transcode] }
        started_at:   { type: string, format: date-time }
        source:       { $ref: '#/components/schemas/StreamFormat' }
        output:
          allOf: [{ $ref: '#/components/schemas/StreamFormat' }]
          description: What the viewer receives. Absent for a direct play (the output is the source).
        transcode_reasons:
          type: array
          items: { type: string }
          description: Why a remux/transcode isn't a direct play, in words (e.g. "HEVC not supported by client").
        can_stop:
          type: boolean
          description: Whether POST /api/v1/sessions/{id}/stop can act on this card.
        optimized_version:
          type: object
          description: Set when the direct play is of an optimized version, not the source; `output` is then the version (v2.6).
          properties:
            id:      { type: string, format: uuid }
            profile: { type: string }
            label:   { type: string }
    StreamFormat:
      type: object
      description: One side of a Now Playing card's source → output. Codec/container values are scanner identifiers ("hevc", "truehd", "matroska"; "hls" for a server session's output).
      properties:
        container:      { type: string }
        video_codec:    { type: string }
        audio_codec:    { type: string }
        width:          { type: integer }
        height:         { type: integer }
        bitrate_kbps:   { type: integer }
        audio_channels: { type: integer }
        hdr:            { type: string }

    # ── Users / preferences / profiles ─────────────────────────────────────
    Preferences:
      type: object
      additionalProperties: true
      description: Free-form per-user preferences (subtitle defaults, theme, etc.).
    ManagedProfile:
      type: object
      properties:
        id:         { type: string, format: uuid }
        owner_id:   { type: string, format: uuid }
        name:       { type: string }
        max_content_rating:
          type: string
          nullable: true
          description: Parental ceiling — null/empty means unrestricted.
        inherit_library_access:
          type: boolean
          description: |
            v2.1 Track G item 3. When true (default), the profile sees
            its parent owner's library grants. When false, the profile
            uses its own `library_access` rows so admins can narrow
            per-profile (kid sees Family Movies only even though parent
            has 4K Movies too).
        blocked_labels:
          type: array
          items: { type: string }
          description: '*(v2.6)* Label restriction, inherited from the owner at creation and cascaded on the owner''s changes. See PUT /api/v1/users/{id}/label-restrictions.'
        allowed_labels:
          type: array
          items: { type: string }
          description: '*(v2.6)* See blocked_labels.'
        created_at: { type: string, format: date-time }

    # ── Photos: faces, people, memories (v2.6, migration 00057) ────────────
    PhotoFace:
      type: object
      description: A face on a photo; the box is normalised to 0..1 of the upright photo.
      properties:
        id:          { type: string, format: uuid }
        item_id:     { type: string, format: uuid }
        x:           { type: number }
        y:           { type: number }
        w:           { type: number }
        h:           { type: number }
        score:       { type: number, description: Detector confidence. }
        source:      { type: string, enum: [auto, manual] }
        person_id:   { type: string, format: uuid, nullable: true }
        person_name: { type: string, nullable: true }
    PhotoFaceThumb:
      type: object
      description: A face to show cropped from its photo (GET /api/v1/items/{item_id}/image).
      properties:
        id:      { type: string, format: uuid }
        item_id: { type: string, format: uuid }
        x:       { type: number }
        y:       { type: number }
        w:       { type: number }
        h:       { type: number }
        score:   { type: number }
    PhotoPerson:
      type: object
      properties:
        id:          { type: string, format: uuid }
        library_id:  { type: string, format: uuid }
        name:        { type: string }
        photo_count: { type: integer, description: Photos visible to the caller. }
        cover:       { $ref: '#/components/schemas/PhotoFaceThumb' }
        can_edit:    { type: boolean, description: Whether the caller may rename / remove people and name faces. }
    PhotoLibrarySettings:
      type: object
      properties:
        library_id:       { type: string, format: uuid, readOnly: true }
        raw_jpeg_pairing: { type: boolean, default: true }
    MemoryPhoto:
      type: object
      properties:
        id:          { type: string, format: uuid }
        library_id:  { type: string, format: uuid }
        title:       { type: string }
        poster_path: { type: string, nullable: true }
        taken_at:    { type: string, format: date-time }
        width:       { type: integer, nullable: true }
        height:      { type: integer, nullable: true }
        orientation: { type: integer, nullable: true }
        updated_at:  { type: string, format: date-time }

    # ── Collections / Playlists ────────────────────────────────────────────
    Collection:
      type: object
      properties:
        id:         { type: string, format: uuid }
        name:       { type: string }
        summary:    { type: string, nullable: true }
        type:
          type: string
          enum: [playlist, smart_playlist, auto_genre, event_folder, photo_album, franchise, manual]
          description: v2.1 — `smart_playlist` resolves items at query time from `rules`. `franchise` is a TMDB collection the server holds at least two films of (read-only). `manual` (v2.6) is an admin-curated movie / TV collection shared with everyone who can see its members.
        rules:
          type: object
          nullable: true
          description: |
            v2.1 Track F item 1. JSON rule schema for smart playlists
            ("all 4K HDR movies from 2020+", "songs not played in
            6 months"). Evaluated at query time so newly-imported
            items matching the rules appear without a rebuild. Null
            for static playlists / collections. On a `manual` collection
            (v2.6) it is a CollectionRules object: the collection is smart.
          additionalProperties: true
        item_count: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        tmdb_collection_id: { type: integer, description: Franchise collections only. }
        item_order:     { type: string, enum: [custom, release, title], description: 'Manual collections only: how the items listing orders members.' }
        poster_item_id: { type: string, format: uuid, description: 'Manual collections only: the member whose poster is the cover; absent = the first member''s.' }
        promoted:       { type: boolean, description: 'v2.6, manual collections: on the home screen.' }
        poster_version: { type: integer, format: int64, description: 'v2.6, manual collections: set when an admin uploaded a cover, served at /collections/{id}/poster?v=<poster_version>; wins over poster_path.' }
        source:         { type: string, enum: [nfo], description: 'v2.6: set on a manual collection imported from movie.nfo files.' }
        poster_url:   { type: string, description: 'Franchise collections only: TMDB collection poster (absolute URL).' }
        backdrop_url: { type: string, description: 'Franchise detail only: TMDB collection backdrop.' }
        parts:
          type: array
          description: Franchise detail (GET /collections/{id}) only; see that operation.
          items: { $ref: '#/components/schemas/FranchisePart' }
    CollectionRules:
      type: object
      description: |
        v2.6. A smart manual collection's rules: what it holds is every movie
        and/or show matching all of them, best-sorted by title.
      required: [types]
      properties:
        types:       { type: array, items: { type: string, enum: [movie, show] }, minItems: 1 }
        genres:      { type: array, items: { type: string }, description: 'A member must have the first genre.' }
        year_min:    { type: integer }
        year_max:    { type: integer }
        rating_min:  { type: number, minimum: 0, maximum: 10 }
        library_ids: { type: array, items: { type: string, format: uuid }, description: 'Only these libraries; empty = all.' }
        limit:       { type: integer, minimum: 1, maximum: 500, default: 200 }
    FranchisePart:
      type: object
      properties:
        tmdb_id:        { type: integer }
        title:          { type: string }
        year:           { type: integer }
        release_date:   { type: string, description: YYYY-MM-DD }
        poster_url:     { type: string }
        overview:       { type: string }
        item_id:        { type: string, format: uuid, nullable: true, description: Set when the film is in the server and visible to the caller. }
        item_ids:       { type: array, items: { type: string, format: uuid }, description: "Every visible copy of the film (e.g. 4K and 1080p libraries), lowest id first; omitted when none." }
        request_status: { type: string, nullable: true, enum: [pending, approved, downloading], description: The caller's own open request for a missing part. }
    CollectionItem:
      type: object
      properties:
        id:         { type: string, format: uuid }
        title:      { type: string }
        type:       { type: string }
        year:       { type: integer, nullable: true }
        poster_path: { type: string, nullable: true }
    Playlist:
      type: object
      properties:
        id:         { type: string, format: uuid }
        owner_id:   { type: string, format: uuid }
        name:       { type: string }
        summary:    { type: string, nullable: true }
        item_count: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    M3UImportResult:
      type: object
      description: Result of POST /playlists/import (v2.6).
      properties:
        playlist: { $ref: '#/components/schemas/Playlist' }
        total:     { type: integer, description: Media lines in the file. }
        matched:   { type: integer }
        unmatched: { type: integer }
        added:     { type: integer, description: Distinct items in the new playlist. }
        by_method:
          type: object
          description: Matched lines per method.
          properties:
            path:     { type: integer }
            relative: { type: integer }
            suffix:   { type: integer }
            tags:     { type: integer }
        matches:
          type: array
          description: Matched lines (first 500).
          items:
            type: object
            properties:
              line:    { type: integer }
              entry:   { type: string }
              item_id: { type: string, format: uuid }
              title:   { type: string }
              method:  { type: string, enum: [path, relative, suffix, tags] }
        matches_truncated: { type: boolean }
        unmatched_entries:
          type: array
          description: Unmatched lines (first 500).
          items:
            type: object
            properties:
              line:   { type: integer }
              entry:  { type: string }
              reason: { type: string, enum: [url, not_found] }
        unmatched_truncated: { type: boolean }
    PlaylistItem:
      type: object
      properties:
        id:          { type: string, format: uuid }
        item_id:     { type: string, format: uuid }
        position:    { type: integer }
        title:       { type: string }
        type:        { type: string }
        poster_path: { type: string, nullable: true }

    # ── Webhooks / Plugins / Tasks / Audit / Invites ───────────────────────
    Webhook:
      type: object
      properties:
        id:           { type: string, format: uuid }
        name:         { type: string }
        url:          { type: string, format: uri }
        events:       { type: array, items: { type: string } }
        enabled:      { type: boolean }
        secret_set:   { type: boolean }
        created_at:   { type: string, format: date-time }
    WebhookCreate:
      type: object
      required: [name, url, events]
      properties:
        name:    { type: string }
        url:     { type: string, format: uri }
        events:  { type: array, items: { type: string } }
        secret:  { type: string }
        enabled: { type: boolean }
    Plugin:
      type: object
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string }
        endpoint:    { type: string, format: uri }
        enabled:     { type: boolean }
        capabilities: { type: array, items: { type: string } }
        last_seen:   { type: string, format: date-time, nullable: true }
    PluginCreate:
      type: object
      required: [name, endpoint]
      properties:
        name:     { type: string }
        endpoint: { type: string, format: uri }
        api_key:  { type: string }
        enabled:  { type: boolean }
    # ── Notification agents ─────────────────────────────────────────────────
    NotificationAgentKind:
      type: string
      enum: [discord, telegram, ntfy, gotify, email]
    NotificationAgentConfig:
      type: object
      description: Non-secret per-kind fields; only the agent's kind's fields are set.
      properties:
        chat_id:    { type: string, description: 'Telegram: numeric chat id (groups are negative) or @channel.' }
        server_url: { type: string, format: uri, description: 'ntfy / Gotify server. https unless allow_private_network.' }
        topic:      { type: string, description: 'ntfy topic ([A-Za-z0-9_-], at most 64).' }
        recipients: { type: array, items: { type: string, format: email }, maxItems: 10, description: 'Email addresses.' }
    ImportSource:
      type: object
      required: [kind, url, token]
      properties:
        kind:  { type: string, enum: [plex, jellyfin, emby] }
        url:   { type: string, format: uri, example: 'http://192.168.1.10:32400' }
        token: { type: string, description: "Plex: the server owner's X-Plex-Token. Jellyfin / Emby: an API key. Never stored." }
    ImportConnection:
      type: object
      properties:
        kind:        { type: string, enum: [plex, jellyfin, emby] }
        server_name: { type: string }
        version:     { type: string }
        accounts:
          type: array
          items:
            type: object
            properties:
              id:                { type: string }
              name:              { type: string }
              full_state:        { type: boolean, description: "The source shows this account's resume points, ratings and playlists (on Plex only the owner's; other Plex accounts bring their play history)." }
              suggested_user_id: { type: string, format: uuid, description: The OnScreen user with the same name. }
    ImportOptions:
      type: object
      properties:
        watched:   { type: boolean, description: Watched marks and resume points. }
        ratings:   { type: boolean }
        favorites: { type: boolean, description: Jellyfin / Emby only. }
        playlists: { type: boolean }
        history:   { type: boolean, description: "Every past play as a play event (Jellyfin / Emby: one per watched item, on its last-played date)." }
    ImportCounts:
      type: object
      properties:
        watched:        { type: integer }
        resume_points:  { type: integer }
        plays:          { type: integer }
        ratings:        { type: integer }
        favorites:      { type: integer }
        playlists:      { type: integer }
        playlist_items: { type: integer }
    ImportJob:
      type: object
      properties:
        id:          { type: string, format: uuid }
        source_kind: { type: string, enum: [plex, jellyfin, emby] }
        source_url:  { type: string }
        server_name: { type: string }
        status:      { type: string, enum: [running, succeeded, failed, cancelled] }
        dry_run:     { type: boolean }
        options:     { $ref: '#/components/schemas/ImportOptions' }
        mapping:
          type: array
          items:
            type: object
            properties:
              account_id:   { type: string }
              account_name: { type: string }
              user_id:      { type: string, format: uuid }
        phase:       { type: string, description: What a running import is doing, for display. }
        stats:
          type: object
          properties:
            source_items:            { type: integer, description: Items read from the source. }
            referenced:              { type: integer, description: Items a mapped account did something with. }
            matched:                 { type: integer }
            unmatched:               { type: integer }
            plays_outside_retention: { type: integer }
            planned:                 { $ref: '#/components/schemas/ImportCounts' }
            written:                 { $ref: '#/components/schemas/ImportCounts' }
            write_progress:          { type: number, minimum: 0, maximum: 1 }
        unmatched:   { type: array, items: { type: string }, description: Up to 100 source items nothing here matched. }
        error:       { type: string }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    PodcastFeed:
      type: object
      properties:
        id:               { type: string, format: uuid }
        library_id:       { type: string, format: uuid }
        feed_url:         { type: string, format: uri }
        title:            { type: string }
        author:           { type: string }
        description:      { type: string }
        image_url:        { type: string, format: uri }
        site_url:         { type: string, format: uri }
        language:         { type: string }
        folder:           { type: string, description: Folder the episodes download into. }
        auto_download:    { type: boolean }
        keep_latest:      { type: integer, description: 'Downloaded episodes kept, newest first; 0 keeps all.' }
        last_checked_at:  { type: string, format: date-time }
        last_error:       { type: string, description: 'Why the last refresh failed; absent after a good one.' }
        show_item_id:     { type: string, format: uuid, description: 'The podcast item, once an episode has been scanned.' }
        episode_count:    { type: integer, description: List responses only. }
        downloaded_count: { type: integer, description: List responses only. }
        created_at:       { type: string, format: date-time }
    PodcastEpisode:
      type: object
      properties:
        id:               { type: string, format: uuid }
        feed_id:          { type: string, format: uuid }
        title:            { type: string }
        description:      { type: string, description: Show notes as plain text. }
        published_at:     { type: string, format: date-time }
        duration_ms:      { type: integer, format: int64 }
        enclosure_length: { type: integer, format: int64, description: 'Size the feed gives, in bytes.' }
        season:           { type: integer }
        episode:          { type: integer }
        status:
          type: string
          enum: [available, downloading, downloaded, failed, removed]
          description: |
            `removed`: the file was deleted (retention or by hand);
            auto-download leaves it alone, a manual download brings it back.
        error:            { type: string, description: Why the last download failed. }
        media_item_id:    { type: string, format: uuid, description: 'The library item, once the file has been scanned.' }
        downloaded_at:    { type: string, format: date-time }
    NotificationAgent:
      type: object
      properties:
        id:                    { type: string, format: uuid }
        kind:                  { $ref: '#/components/schemas/NotificationAgentKind' }
        name:                  { type: string }
        enabled:               { type: boolean }
        events:                { type: array, items: { type: string } }
        config:                { $ref: '#/components/schemas/NotificationAgentConfig' }
        secret_configured:     { type: boolean, description: 'Whether a secret is stored. The secret itself is never returned.' }
        allow_private_network: { type: boolean }
        last_success_at:       { type: string, format: date-time, nullable: true }
        last_error:            { type: string, nullable: true, description: 'Last delivery failure, sanitized.' }
        last_error_at:         { type: string, format: date-time, nullable: true }
        created_at:            { type: string, format: date-time }
        updated_at:            { type: string, format: date-time }
    NotificationAgentCreate:
      type: object
      required: [kind, name]
      properties:
        kind:    { $ref: '#/components/schemas/NotificationAgentKind' }
        name:    { type: string, maxLength: 100 }
        enabled: { type: boolean, default: true }
        events:
          type: array
          items: { type: string }
          description: Event keys (GET …/events). Omitted = the kind's defaults.
        config:  { $ref: '#/components/schemas/NotificationAgentConfig' }
        secret:
          type: string
          writeOnly: true
          description: |
            Discord: the webhook URL (https://discord.com|discordapp.com/api/webhooks/…).
            Telegram: the bot token. ntfy: an access token (optional).
            Gotify: the app token. Email: none. Encrypted at rest.
        allow_private_network:
          type: boolean
          default: false
          description: ntfy / Gotify only — permit a server on the LAN / this machine (never link-local).
    NotificationAgentUpdate:
      type: object
      properties:
        kind:         { $ref: '#/components/schemas/NotificationAgentKind' }
        name:         { type: string, maxLength: 100 }
        enabled:      { type: boolean }
        events:       { type: array, items: { type: string } }
        config:       { $ref: '#/components/schemas/NotificationAgentConfig' }
        secret:       { type: string, writeOnly: true, description: 'Blank or omitted keeps the stored secret.' }
        clear_secret: { type: boolean, description: 'Remove an optional stored secret (the ntfy token).' }
        allow_private_network: { type: boolean }
    NotificationAgentEvent:
      type: object
      properties:
        key:         { type: string, enum: [request_pending, request_approved, request_available, request_season_available, request_failed, issue_reported, new_content, task_failed, backup_failed, worker_fleet_down] }
        label:       { type: string }
        description: { type: string }
        group:       { type: string, enum: [requests, library, server] }
        default_for: { type: array, items: { $ref: '#/components/schemas/NotificationAgentKind' } }
    # ── Settings ▸ System (cluster-wide startup toggles) ─────────────────
    SystemSettings:
      type: object
      description: >
        Cluster-wide knobs that used to be env-only. Restart-required.
        GET fills unset fields with the env-effective running value.
        Adaptive bitrate fields live on `TranscodeConfig`, not here.
      properties:
        server_name:                { type: string,  description: 'Advertised over LAN discovery + capabilities.' }
        retain_months:              { type: integer, description: 'Watch-history retention in months.' }
        tmdb_rate_limit:            { type: integer, description: 'TMDB API requests per second.' }
        public_asset_cache:         { type: boolean, description: '`Cache-Control: public` on immutable artwork so a CDN can cache it.' }
        static_abr_enabled:         { type: boolean, description: 'Pre-encode popular titles'' ABR ladders to object storage.' }
        missing_file_grace_minutes: { type: integer, description: 'Minutes a missing file waits before being marked unavailable.' }
        scan_file_concurrency:      { type: integer, description: 'Concurrent file-scan goroutines (0 = NumCPU * 2).' }
        scan_library_concurrency:   { type: integer, description: 'Concurrent library scans.' }
        discovery_enabled:          { type: boolean, description: 'Whether the server broadcasts itself over UDP LAN discovery.' }
        discovery_port:             { type: integer, description: 'UDP port for LAN discovery announcements.' }

    # ── Settings ▸ Transcode (encoder tuning + output caps + ABR ladder) ─
    TranscodeConfig:
      type: object
      description: >
        Encoder tuning (NVENC preset / tune / rate-control), global output
        ceilings, AND the adaptive-bitrate HLS ladder. ABR fields moved here
        from `SystemSettings` so all the encoder knobs are managed from one
        UI surface (Settings ▸ Transcode). Restart-required.
      properties:
        # NVENC tuning (hot-reloadable via SIGHUP)
        nvenc_preset:  { type: string,  enum: [p1, p2, p3, p4, p5, p6, p7], description: 'Speed vs quality. p4 = balanced default.' }
        nvenc_tune:    { type: string,  enum: [hq, ll, ull], description: 'High quality / low latency / ultra-low latency.' }
        nvenc_rc:      { type: string,  enum: [vbr, cbr, constqp], description: 'Rate-control mode.' }
        maxrate_ratio: { type: number,  description: 'Peak-to-target bitrate multiplier; maxrate = bitrate * ratio.' }
        # Global output ceilings (restart-required)
        max_bitrate_kbps: { type: integer, description: 'Upper bound on transcode target bitrate (kbps).' }
        max_width:        { type: integer, description: 'Max transcode output width.' }
        max_height:       { type: integer, description: 'Max transcode output height.' }
        # Adaptive-bitrate ladder (moved from SystemSettings; restart-required)
        abr:                 { type: boolean, description: 'Enable multi-rendition HLS ladder (the player picks rungs on real-time bandwidth).' }
        abr_max_height:      { type: integer, description: 'Hard cap on rung height (0 = source).' }
        abr_auto_max_height: { type: integer, description: 'Soft cap on rung height for AUTO playback (0 = source). An explicit quality pick can still exceed this up to abr_max_height.' }
        # Internet streaming limit (v2.6; read live, no restart)
        remote_max_bitrate_kbps:
          type: integer
          description: >
            Bitrate ceiling (kbps) for streams to clients outside the home
            network; 0 / absent = unlimited. A remote client whose video
            source exceeds it is transcoded down to it. Not restart-required.
        local_networks:
          type: array
          items: { type: string }
          description: >
            Extra CIDRs (or bare IPs) treated as the home network, on top of
            the built-in loopback, RFC 1918 / unique-local, link-local,
            100.64.0.0/10 (Tailscale / CGNAT) and the server's own IPv6
            prefixes. An entry that isn't an IP or CIDR is a 400.

    SignedInSession:
      type: object
      description: One sign-in (refresh session). Never carries a token or its hash.
      properties:
        id:           { type: string, format: uuid }
        client_name:  { type: string, description: 'Device label ("Chrome on Windows", "Roku", or the X-Device-Name the client sent). Empty for sign-ins made before v2.6 until their next refresh.' }
        platform:     { type: string, enum: [web, android, ios, roku, tizen, webos, xbox], description: 'Omitted when unrecognised.' }
        ip_address:   { type: string, description: 'Trusted client IP of the latest sign-in / refresh.' }
        created_at:   { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time, description: 'Approximate: sign-in or latest refresh.' }
        current:      { type: boolean, description: "True on the caller's own sign-in." }
    APIKey:
      type: object
      description: A personal API key. Never carries the key or its hash.
      properties:
        id:           { type: string, format: uuid }
        name:         { type: string }
        prefix:       { type: string, description: 'The first characters of the key, e.g. "osk_AbC12xYz".' }
        scope:        { type: string, enum: [full, read_only] }
        created_at:   { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true, description: 'Approximate: written at most every 5 minutes.' }
        expires_at:   { type: string, format: date-time, nullable: true }
        expired:      { type: boolean }
        user_id:      { type: string, format: uuid, description: 'Admin list only.' }
        username:     { type: string, description: 'Admin list only.' }
    CreatedAPIKey:
      allOf:
        - { $ref: '#/components/schemas/APIKey' }
        - type: object
          properties:
            key: { type: string, description: 'The key itself, shown only in this response.' }
    ReadingProgress:
      type: object
      properties:
        locator:     { type: string }
        progression: { type: number, minimum: 0, maximum: 1 }
        device_name: { type: string, description: 'Where the position was saved; omitted when unknown.' }
        updated_at:  { type: string, format: date-time, description: 'Client time the position was reached (clamped to the server clock).' }
        applied:     { type: boolean, description: 'PUT only: false when a newer stored position was kept.' }
    SubtitleAutoSettings:
      type: object
      properties:
        enabled:             { type: boolean }
        languages:           { type: string, description: 'Comma-separated language codes, normalised (e.g. "en,es,pt-br").' }
        only_missing:        { type: boolean, description: 'Always true: a language the file already has is never downloaded.' }
        prefer_hash_match:   { type: boolean }
        hearing_impaired:    { type: string, enum: [prefer, avoid, any] }
        provider_configured: { type: boolean, description: 'Read-only: whether OpenSubtitles is set up.' }
    LibrarySubtitleAuto:
      type: object
      properties:
        library_id: { type: string, format: uuid }
        enabled:    { type: boolean, nullable: true }
        languages:  { type: string, nullable: true }
    StreamingLimits:
      type: object
      properties:
        max_concurrent_streams:         { type: integer, nullable: true }
        max_stream_bitrate_kbps:        { type: integer, nullable: true, description: 'Applies on the home network and over the internet.' }
        max_remote_stream_bitrate_kbps: { type: integer, nullable: true, description: 'Internet-only cap (v2.6); combined with the server-wide internet limit, lowest wins.' }

    ScheduledTask:
      type: object
      properties:
        id:           { type: string, format: uuid }
        name:         { type: string }
        task_type:    { type: string }
        config:       { type: object, additionalProperties: true }
        cron_expr:    { type: string }
        enabled:      { type: boolean }
        last_run_at:  { type: string, format: date-time, nullable: true }
        next_run_at:  { type: string, format: date-time }
        last_status:  { type: string }
        last_error:   { type: string }
        created_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time }
    ScheduledTaskCreate:
      type: object
      required: [name, task_type, cron_expr]
      properties:
        name:      { type: string }
        task_type: { type: string }
        config:    { type: object, additionalProperties: true }
        cron_expr: { type: string }
        enabled:   { type: boolean }
    ScheduledTaskUpdate:
      type: object
      properties:
        name:      { type: string }
        task_type: { type: string }
        config:    { type: object, additionalProperties: true }
        cron_expr: { type: string }
        enabled:   { type: boolean }
    TaskRun:
      type: object
      properties:
        id:         { type: string, format: uuid }
        task_id:    { type: string, format: uuid }
        started_at: { type: string, format: date-time }
        ended_at:   { type: string, format: date-time, nullable: true }
        status:     { type: string, enum: [running, success, failure, skipped] }
        output:     { type: string }
        error:      { type: string }
    AuditEntry:
      type: object
      properties:
        id:         { type: string, format: uuid }
        user_id:    { type: string, format: uuid, nullable: true }
        action:
          type: string
          description: |
            Stable action code. Known values:
              - `auth.login_success`, `auth.login_failed`, `auth.sessions_revoked`,
                `auth.refresh_reuse_tolerated`
              - `user.create`, `user.delete`, `user.role_change`, `user.password_reset`
              - `invite.create`
              - `library.create`, `library.delete`, `library.scan`
              - `settings.update`
              - `item.enrich`, `item.match_apply`, `item.delete`
              - `transcode.start`, `transcode.stop`
              - `backup.download`, `backup.restore`
              - `arr_service.create` / `.update` / `.delete` / `.set_default`
              - `request.approve`, `request.decline`, `request.delete`
              - `webhook.create`, `webhook.update`, `webhook.delete`
              - `admin.impersonate`
            Unknown values are passed through verbatim — never reject on
            this field. New actions arrive without a schema bump.
        target:     { type: string, nullable: true, description: 'Resource id or name; shape varies per action.' }
        detail:
          type: object
          additionalProperties: true
          description: 'Action-specific JSON detail. Webhook CRUD entries carry only the URL host (not the full URL) plus events + has_secret/secret_changed flags so path tokens never end up in the audit trail.'
        ip_addr:    { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    Invite:
      type: object
      properties:
        id:         { type: string, format: uuid }
        email:      { type: string, format: email, nullable: true }
        token:      { type: string, description: 'Only present on create.' }
        expires_at: { type: string, format: date-time }
        used_at:    { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    ListMeta:
      type: object
      properties:
        total:  { type: integer, format: int64, description: '`-1` when total is unknown (load-more pagination).' }
        cursor: { type: string }

    ArrService:
      type: object
      description: |
        A single Radarr/Sonarr instance. Multi-instance is supported per kind —
        is_default flags the one OnScreen will use when no per-request override
        is supplied.
      properties:
        id:                          { type: string, format: uuid }
        name:                        { type: string }
        kind:                        { type: string, enum: [radarr, sonarr] }
        base_url:                    { type: string }
        api_key_set:                 { type: boolean, description: api_key value is never returned; this flag indicates whether one is stored. }
        default_quality_profile_id:  { type: integer, nullable: true }
        default_root_folder:         { type: string,  nullable: true }
        default_tags:                { type: array, items: { type: integer } }
        minimum_availability:        { type: string, nullable: true, description: 'Radarr only: announced | inCinemas | released' }
        series_type:                 { type: string, nullable: true, description: 'Sonarr only: standard | daily | anime' }
        season_folder:               { type: boolean, nullable: true, description: Sonarr only. }
        language_profile_id:         { type: integer, nullable: true, description: Sonarr only (legacy v3). }
        is_default:                  { type: boolean }
        enabled:                     { type: boolean }
        created_at:                  { type: string, format: date-time }
        updated_at:                  { type: string, format: date-time }

    ArrServiceCreate:
      type: object
      required: [name, kind, base_url, api_key]
      properties:
        name:                        { type: string }
        kind:                        { type: string, enum: [radarr, sonarr] }
        base_url:                    { type: string }
        api_key:                     { type: string }
        default_quality_profile_id:  { type: integer, nullable: true }
        default_root_folder:         { type: string,  nullable: true }
        default_tags:                { type: array, items: { type: integer } }
        minimum_availability:        { type: string, nullable: true }
        series_type:                 { type: string, nullable: true }
        season_folder:               { type: boolean, nullable: true }
        language_profile_id:         { type: integer, nullable: true }
        is_default:                  { type: boolean, default: false }
        enabled:                     { type: boolean, default: true }

    ArrServiceUpdate:
      type: object
      description: |
        Every field is optional. Send `api_key` only when rotating the credential —
        an omitted or empty `api_key` keeps the existing value. is_default is not
        settable here; use POST /api/v1/admin/arr-services/{id}/set-default.
      properties:
        name:                        { type: string }
        base_url:                    { type: string }
        api_key:                     { type: string }
        default_quality_profile_id:  { type: integer, nullable: true }
        default_root_folder:         { type: string,  nullable: true }
        default_tags:                { type: array, items: { type: integer } }
        minimum_availability:        { type: string, nullable: true }
        series_type:                 { type: string, nullable: true }
        season_folder:               { type: boolean, nullable: true }
        language_profile_id:         { type: integer, nullable: true }
        enabled:                     { type: boolean }

    ArrProbeResult:
      type: object
      properties:
        status:    { type: string, example: ok }
        version:   { type: string }
        app_name:  { type: string }
        quality_profiles:
          type: array
          items:
            type: object
            properties: { id: { type: integer }, name: { type: string } }
        root_folders:
          type: array
          items:
            type: object
            properties:
              id:         { type: integer }
              path:       { type: string }
              free_space: { type: integer, format: int64 }
        tags:
          type: array
          items:
            type: object
            properties: { id: { type: integer }, label: { type: string } }
        language_profiles:
          type: array
          items:
            type: object
            properties: { id: { type: integer }, name: { type: string } }

    DiscoverItem:
      type: object
      properties:
        type:                  { type: string, enum: [movie, show] }
        tmdb_id:               { type: integer }
        title:                 { type: string }
        year:                  { type: integer }
        overview:              { type: string }
        rating:                { type: number, format: float }
        poster_url:            { type: string }
        fanart_url:            { type: string }
        in_library:            { type: boolean }
        library_item_id:       { type: string, format: uuid, nullable: true }
        has_active_request:    { type: boolean }
        active_request_id:     { type: string, format: uuid, nullable: true }
        active_request_status: { type: string, nullable: true }
        missing_seasons:
          type: array
          items: { type: integer }
          description: >
            Shows in the caller's library only: the aired regular seasons the
            library doesn't fully hold ("Request more seasons"). Empty when
            nothing is missing; absent for movies, shows not in the library,
            and when the season list couldn't be read.
        partially_available:
          type: boolean
          description: The show is in the caller's library with aired seasons missing. in_library keeps its meaning.

    SeasonInfo:
      type: object
      properties:
        season_number:  { type: integer, description: '0 = specials.' }
        name:           { type: string }
        episode_count:  { type: integer, description: Episodes TMDB lists for the season (aired or not). }
        aired_episodes: { type: integer }
        air_date:       { type: string, format: date, nullable: true }
        poster_url:     { type: string }
        owned_episodes: { type: integer, description: Distinct episodes on disk in libraries the caller can see. }
        requested:      { type: string, nullable: true, enum: [pending, approved, downloading], description: "Status of the caller's active request covering the season; null when none." }
        request_id:     { type: string, format: uuid }

    RequestQuotaUsage:
      type: object
      required: [limit, used, remaining]
      properties:
        limit:     { type: integer, description: 'Requests allowed per window; 0 = unlimited.' }
        used:      { type: integer, description: 'Non-declined requests of this type created in the window.' }
        remaining: { type: integer, nullable: true, description: 'limit - used, floored at 0; null when unlimited.' }

    MediaRequest:
      type: object
      properties:
        id:                    { type: string, format: uuid }
        user_id:               { type: string, format: uuid }
        type:                  { type: string, enum: [movie, show] }
        tmdb_id:               { type: integer }
        title:                 { type: string }
        year:                  { type: integer, nullable: true }
        poster_url:            { type: string, nullable: true }
        overview:              { type: string, nullable: true }
        status:                { type: string, enum: [pending, approved, declined, downloading, available, failed] }
        seasons:               { type: array, items: { type: integer }, description: 'Show requests: the seasons asked for; absent = every regular season.' }
        seasons_available:
          type: array
          items: { type: integer }
          description: >
            Show requests only: the requested seasons already complete in the
            library while the rest are still coming ("partially available" —
            the status stays approved / downloading / failed until every
            requested season is complete, then becomes available). The
            requester is notified once per season (request_season_available).
        requested_service_id:  { type: string, format: uuid, nullable: true, description: User's preferred arr service. }
        quality_profile_id:    { type: integer, nullable: true }
        root_folder:           { type: string,  nullable: true }
        service_id:            { type: string, format: uuid, nullable: true, description: Bound at approve time; nulled if the service is later deleted. }
        decline_reason:        { type: string, nullable: true }
        decided_by:            { type: string, format: uuid, nullable: true }
        decided_at:            { type: string, format: date-time, nullable: true }
        fulfilled_item_id:     { type: string, format: uuid, nullable: true, description: Set when the matching media_item appears post-import. }
        fulfilled_at:          { type: string, format: date-time, nullable: true }
        created_at:            { type: string, format: date-time }
        updated_at:            { type: string, format: date-time }
        username:              { type: string, description: "The requester's username. Present on GET /requests listings (both scopes) and GET /requests/{id}." }
        download:
          $ref: '#/components/schemas/RequestDownload'

    RequestDownload:
      type: object
      description: |
        Live Radarr/Sonarr download state of an approved / downloading / failed
        request, refreshed by the arr_request_sync task (every 5 min) and by
        the arr webhook on Grab / Download / ImportComplete /
        ManualInteractionRequired. Omitted from the request until its first
        sync, and cleared once the request is available. A show aggregates its
        episodes (size-weighted progress, worst meaningful state). For
        non-admin callers the message of a stalled or failed download is a
        plain phrase — the *arr text can name internal hosts and paths.
      required: [state, updated_at]
      properties:
        state:
          type: string
          enum: [searching, queued, downloading, import_pending, stalled, failed]
          description: |
            searching — monitored, nothing grabbed yet; queued — grabbed,
            waiting in the download client; downloading — transferring;
            import_pending — downloaded, waiting for the import / library
            scan; stalled — the client or *arr app reports a problem;
            failed — the grab failed and nothing newer was grabbed (the
            request's status is then `failed`, and the requester and admins
            were notified once).
        progress:   { type: number, minimum: 0, maximum: 1, description: Downloaded fraction. }
        eta:        { type: string, format: date-time }
        size_bytes: { type: integer, format: int64 }
        message:    { type: string }
        updated_at: { type: string, format: date-time, description: When the sync last evaluated the request. }

    ArrServiceHealth:
      type: object
      properties:
        reachable: { type: boolean }
        version:   { type: string }
        error:     { type: string, description: 'Short generic reason when reachable is false (details are server-logged only).' }
        checks:
          type: array
          description: "The instance's own health checks (ok rows omitted)."
          items:
            type: object
            properties:
              type:     { type: string, enum: [notice, warning, error] }
              source:   { type: string }
              message:  { type: string }
              wiki_url: { type: string, description: 'http(s) only; omitted otherwise.' }
        disks:
          type: array
          description: 'Mounts backing the root folders (every sized mount when root folders are unreadable).'
          items:
            type: object
            properties:
              path:        { type: string }
              label:       { type: string }
              free_bytes:  { type: integer, format: int64 }
              total_bytes: { type: integer, format: int64 }
        queue_count: { type: integer, nullable: true, description: Downloads the instance is tracking; null when the queue could not be read. }

    StatsTotals:
      type: object
      properties:
        plays:          { type: integer, format: int64 }
        watch_ms:       { type: integer, format: int64, description: 'Time watched: movies, episodes, music videos, home videos.' }
        listen_ms:      { type: integer, format: int64, description: 'Time listened: tracks, audiobooks, podcasts.' }
        hours_watched:  { type: number, description: watch_ms in hours, one decimal. }
        hours_listened: { type: number, description: listen_ms in hours, one decimal. }
        items_finished: { type: integer, format: int64, description: Distinct titles played to 90% or more. }
        books_read:     { type: integer, format: int64, description: Ebooks/comics marked read plus audiobooks finished. }
        active_days:    { type: integer, format: int64 }

    StatsTitle:
      type: object
      properties:
        id:           { type: string, format: uuid, description: 'The movie, show, artist or album (never the episode or track).' }
        title:        { type: string }
        year:         { type: integer }
        poster_path:  { type: string, description: 'Artwork path for /artwork/{path}.' }
        parent_title: { type: string, description: "An album's artist." }
        plays:        { type: integer, format: int64, description: 'Plays (for a show, episodes played).' }
        ms:           { type: integer, format: int64 }

    StatsCount:
      type: object
      properties:
        plays: { type: integer, format: int64 }
        ms:    { type: integer, format: int64 }

    UserStats:
      type: object
      properties:
        range:    { type: string, example: 30d }
        since:    { type: string, format: date-time }
        until:    { type: string, format: date-time }
        timezone: { type: string }
        totals:   { $ref: '#/components/schemas/StatsTotals' }
        by_type:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/StatsCount' }
              - { type: object, properties: { type: { type: string, example: episode } } }
        top_genres:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/StatsCount' }
              - { type: object, properties: { genre: { type: string } } }
        top_titles:
          type: object
          description: Up to 10 per list, by plays then time.
          properties:
            movies:  { type: array, items: { $ref: '#/components/schemas/StatsTitle' } }
            shows:   { type: array, items: { $ref: '#/components/schemas/StatsTitle' } }
            artists: { type: array, items: { $ref: '#/components/schemas/StatsTitle' } }
            albums:  { type: array, items: { $ref: '#/components/schemas/StatsTitle' } }
        by_month:
          type: array
          description: Every month of the range (zero-filled); for `all`, from the first month with plays.
          items:
            allOf:
              - { $ref: '#/components/schemas/StatsCount' }
              - { type: object, properties: { month: { type: string, example: '2026-10' } } }
        heatmap:
          type: array
          description: Sparse; cells without plays are absent.
          items:
            type: object
            properties:
              weekday: { type: integer, minimum: 1, maximum: 7, description: 1 = Monday. }
              hour:    { type: integer, minimum: 0, maximum: 23 }
              plays:   { type: integer, format: int64 }
        longest_streak:
          type: object
          properties:
            days:  { type: integer }
            start: { type: string, format: date }
            end:   { type: string, format: date }
        devices:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/StatsCount' }
              - { type: object, properties: { device: { type: string } } }

    YearInReview:
      type: object
      properties:
        year:           { type: integer }
        timezone:       { type: string }
        has_data:       { type: boolean }
        totals:         { $ref: '#/components/schemas/StatsTotals' }
        longest_streak: { $ref: '#/components/schemas/UserStats/properties/longest_streak' }
        top_movies:     { type: array, maxItems: 5, items: { $ref: '#/components/schemas/StatsTitle' } }
        top_shows:      { type: array, maxItems: 5, items: { $ref: '#/components/schemas/StatsTitle' } }
        top_artists:    { type: array, maxItems: 5, items: { $ref: '#/components/schemas/StatsTitle' } }
        top_albums:     { type: array, maxItems: 5, items: { $ref: '#/components/schemas/StatsTitle' } }
        top_genres:     { $ref: '#/components/schemas/UserStats/properties/top_genres' }
        top_device:
          nullable: true
          allOf:
            - { $ref: '#/components/schemas/StatsCount' }
            - { type: object, properties: { device: { type: string } } }
        first_play:
          type: object
          nullable: true
          properties:
            id:           { type: string, format: uuid }
            type:         { type: string }
            title:        { type: string }
            year:         { type: integer }
            parent_title: { type: string }
            poster_path:  { type: string }
            occurred_at:  { type: string, format: date-time }
        busiest_day:
          type: object
          nullable: true
          properties:
            date:  { type: string, format: date }
            plays: { type: integer, format: int64 }
            ms:    { type: integer, format: int64 }
        new_artists:
          type: object
          properties:
            count: { type: integer, format: int64 }
            top:   { type: array, maxItems: 5, items: { $ref: '#/components/schemas/StatsTitle' } }
        by_month: { $ref: '#/components/schemas/UserStats/properties/by_month' }
        previous_year:
          type: object
          nullable: true
          properties:
            year:   { type: integer }
            totals: { $ref: '#/components/schemas/StatsTotals' }

    MyDigest:
      type: object
      properties:
        frequency:    { type: string, enum: [off, weekly, monthly] }
        last_sent_at: { type: string, format: date-time }
        has_email:    { type: boolean }
        available:    { type: boolean, description: False while digests are off server-wide or SMTP isn't configured. }

    DigestSettings:
      type: object
      properties:
        enabled:                   { type: boolean, default: false }
        weekday:                   { type: integer, minimum: 0, maximum: 6, default: 1, description: 0 = Sunday. Weekly send day. }
        hour:                      { type: integer, minimum: 0, maximum: 23, default: 8 }
        include_continue_watching: { type: boolean, default: true }
        include_stats:             { type: boolean, default: true }
        smtp_configured:           { type: boolean, readOnly: true }
        base_url:                  { type: string, readOnly: true, description: 'Settings ▸ General Base URL; "" when unset.' }
        server_timezone:           { type: string, readOnly: true }
