version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # Pin the CUDA base deliberately. CUDA 13 requires NVIDIA driver >= 580
      # (mid-2025) and drops every GPU older than Turing, so an auto-bump
      # silently breaks GPU acceleration for most self-hosters (this is exactly
      # how the image landed on 13.2.1 before). Bump CUDA_VERSION in
      # docker/Dockerfile.ffmpeg by hand once a 580+ driver is broadly deployed.
      - dependency-name: "nvidia/cuda"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
