name: Kodi add-on

# Lint, tests and the installable zip for the Kodi add-on (clients/kodi).
# Path-filtered like the other client workflows. Windows is in the matrix on
# purpose: Kodi on Windows is common, and the token file lock behaves
# differently there (PermissionError while a lock file is being deleted).
on:
  push:
    branches: [main]
    paths:
      - 'clients/kodi/**'
      - '.github/workflows/kodi.yml'
  pull_request:
    paths:
      - 'clients/kodi/**'
      - '.github/workflows/kodi.yml'

permissions:
  contents: read

concurrency:
  group: kodi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: clients/kodi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Kodi 21 bundles Python 3.11 on Windows and Android; ruff's py38
          # target keeps the code to what Kodi 20 runs.
          python-version: "3.11"

      - name: Tools
        run: python -m pip install pytest==9.2.0 ruff==0.17.5

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Strings in step
        run: python scripts/strings.py --check

      - name: Tests
        run: python -m pytest -q -W error

  package:
    name: package + addon checker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Build the zip and the repository
        working-directory: clients/kodi
        run: |
          python scripts/package.py
          python scripts/build_repo.py

      # Kodi's own checker (what the official repository runs on a
      # submission), on both add-ons as their zips ship them.
      - name: kodi-addon-checker
        run: |
          python -m pip install kodi-addon-checker==0.0.36
          mkdir -p "$RUNNER_TEMP/addon"
          for z in clients/kodi/dist/repo/*/*.zip; do
            python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$z" "$RUNNER_TEMP/addon"
          done
          cd "$RUNNER_TEMP/addon"
          kodi-addon-checker --branch omega plugin.video.onscreen repository.onscreen

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin.video.onscreen
          path: clients/kodi/dist/plugin.video.onscreen-*.zip
          if-no-files-found: error

      # The repository tree to publish at https://on-screen.tv/kodi/.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kodi-repository
          path: clients/kodi/dist/repo/
          if-no-files-found: error
