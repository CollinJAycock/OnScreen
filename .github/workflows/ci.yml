name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job here only reads the repo. Without this block the
# token falls back to the repository default, which is write-all on older
# repos, and it would be exposed to npm lifecycle scripts and dependency test
# code. Jobs that need more must request it explicitly.
permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (for embed)
        run: |
          cd web
          npm ci --no-audit --no-fund
          npm run build
          mkdir -p ../internal/webui/dist
          cp -r dist/* ../internal/webui/dist/

      - name: Build
        run: go build ./cmd/... ./internal/...

      - name: Test
        run: go test ./cmd/... ./internal/... ./test/...

      # Integration tests spin up real Postgres via testcontainers. Gated
      # behind a build tag so contributors without Docker can still run the
      # default suite, but every PR exercises the SQL paths against pg.
      - name: Integration tests
        run: go test -tags=integration -timeout 10m ./internal/...

      # Race detector on the concurrency-heavy packages — broker pubsub,
      # transcode dispatcher, scheduler, valkey lock + master-election,
      # streaming session tracker. -race needs cgo so we install gcc;
      # scoping to the packages that actually exercise goroutines keeps
      # CI time bounded vs running -race across the whole repo.
      - name: Race detector
        run: |
          go test -race -timeout 5m \
            ./internal/notification/... \
            ./internal/streaming/... \
            ./internal/scheduler/... \
            ./internal/valkey/... \
            ./internal/worker/... \
            ./internal/transcode/...

  lint:
    name: Lint (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (for embed)
        run: |
          cd web
          npm ci --no-audit --no-fund
          npm run build
          mkdir -p ../internal/webui/dist
          cp -r dist/* ../internal/webui/dist/

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned (was "latest") so a new linter release can't change what
          # runs in CI without a reviewed bump.
          version: v2.14.0

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Svelte check
        run: npm run check

      - name: Test
        run: npx vitest run

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # nginx inherits proxy_set_header / add_header into a location ONLY if the
      # location sets none of its own. One stray per-location header silently
      # dropped X-Forwarded-For/Proto + Host for that route in the HA sample,
      # making every client look local (first-run setup gate, rate limits,
      # cookie Secure). Keep all of them at server level.
      - name: nginx sample keeps proxy/security headers at server level
        run: |
          awk '/^[[:space:]]*location[[:space:]]/{inloc=1}
               inloc && /^[[:space:]]*(proxy_set_header|add_header)[[:space:]]/{print FILENAME":"FNR": "$0; bad=1}
               inloc && /^[[:space:]]*}[[:space:]]*$/{inloc=0}
               END{exit bad}' docker/nginx.conf

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  govulncheck:
    name: govulncheck (Go)
    runs-on: ubuntu-latest
    # Advisory only: Dependabot drives the actual fixes; we still want the
    # report visible on every PR so reviewers know if a change pulls in a new
    # known-vulnerable transitive dep.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0  # pinned; bump deliberately

      - name: Scan
        run: govulncheck ./...

  npm-audit:
    name: npm audit (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Fail only on high/critical advisories — moderate/low get reviewed
      # by Dependabot PRs without blocking unrelated CI runs.
      - name: Audit
        run: npm audit --omit=dev --audit-level=high
