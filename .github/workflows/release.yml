name: Release

on:
  push:
    tags:
      - "v*"

# Least privilege by default. The build/test job runs `npm ci` (dependency
# lifecycle scripts) and `go test ./...` (all dependency test code); it used to
# share one job with contents:write + packages:write, so any compromised
# dependency or action could replace release binaries, checksums.txt or a
# ghcr tag. Write scopes are now granted only to the small publish jobs below,
# which run no project/dependency code.
permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta2.outputs.VERSION }}
      build_time: ${{ steps.meta2.outputs.BUILD_TIME }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # Keep in lockstep with ci.yml — shipping binaries must be built by
          # the same toolchain CI tests (this was 1.25 vs CI's 1.26 until the
          # v2.4.0 cut).
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Build frontend
      - name: Install frontend deps
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Copy frontend to embed dir
        run: |
          rm -rf internal/webui/dist
          cp -r web/dist internal/webui/dist

      # A release must never ship untested: run the unit suite with the real
      # embedded frontend in place (the webui embed requires dist to exist).
      # Integration suites need Postgres/Valkey and stay in ci.yml — this is
      # the last-line gate against tagging a broken tree.
      - name: Run tests
        run: go test ./...

      # Build Go binaries for multiple platforms
      - name: Set build metadata
        id: meta2
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        env:
          VERSION: ${{ steps.meta2.outputs.VERSION }}
          BUILD_TIME: ${{ steps.meta2.outputs.BUILD_TIME }}
        run: |
          LDFLAGS="-X main.version=${VERSION} -X main.buildTime=${BUILD_TIME}"

          # Linux amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/onscreen-linux-amd64 ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/onscreen-worker-linux-amd64 ./cmd/worker

          # Linux arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/onscreen-linux-arm64 ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/onscreen-worker-linux-arm64 ./cmd/worker

          # macOS amd64
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/onscreen-darwin-amd64 ./cmd/server

          # macOS arm64 (Apple Silicon)
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/onscreen-darwin-arm64 ./cmd/server

          # Windows amd64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/onscreen-windows-amd64.exe ./cmd/server

      - name: Create checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Upload release binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  image:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    # packages:write to push to ghcr; id-token + attestations to publish a
    # signed SLSA provenance attestation for the pushed image digest.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build & push Docker image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.build.outputs.version }}
            BUILD_TIME=${{ needs.build.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      # Registry names must be lowercase; github.repository keeps the owner's
      # case. Computed in the shell from the env var (no ${{ }} in run:).
      - name: Image name for attestation
        id: imgname
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Lets users verify the image came from this workflow:
      #   gh attestation verify oci://ghcr.io/<owner>/<repo>:<tag> --repo <owner>/<repo>
      - name: Attest image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ steps.imgname.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: Publish GitHub Release
    needs: [build, image]
    runs-on: ubuntu-latest
    # The only job holding contents:write. It runs no project or dependency
    # code: it downloads the artifacts built above, attests them and uploads.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-dist
          path: dist

      # Signed SLSA provenance for every shipped binary, so checksums.txt is no
      # longer the only (same-pipeline, unsigned) integrity signal. Verify with:
      #   gh attestation verify onscreen-linux-amd64 --repo <owner>/<repo>
      - name: Attest binary provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            dist/onscreen-*
            dist/checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/onscreen-*
            dist/checksums.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
