name: Desktop client

# Tauri builds are slow (~5-10 min per platform on a cold cache), so the
# installer builds run on demand and on tag push only. They exist to produce
# real installers: they're kept as workflow artifacts, and when the run is
# for a v* tag (its push, or a manual run on the tag) the publish job also
# attaches them to that tag's GitHub release.
#
# PRs that touch the desktop client (including Dependabot's Cargo.lock
# bumps) or this workflow get only the check job: `cargo check --locked`
# with the pinned Rust, so a dependency that no longer compiles, or that
# needs a newer Rust than RUST_VERSION, fails on the PR instead of on the
# next release tag. ci.yml doesn't build the desktop client.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'clients/desktop/**'
      - '.github/workflows/desktop-client.yml'

# One run per ref at a time; a newer run cancels the older one's builds and
# publish. A re-pushed (moved) tag starts a second run for the same ref, so
# the run for the tag's current commit is the one that finishes and
# publishes. (A job-level group on publish alone would cancel whichever
# publish started first, which can be the newer run's.) The tag check in
# publish still guards the upload. A manual run on a tag also cancels a
# run in progress for that tag; on a PR, a new push cancels the old check.
concurrency:
  group: desktop-client-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: builds run npm lifecycle scripts, cargo build scripts and
# proc-macros from ~300 crates; none of that should hold a write token. Only
# the publish job below, which runs no project or dependency code, gets
# contents:write.
permissions:
  contents: read

# Toolchain pins. clients/desktop/linux-build/Dockerfile carries the same
# values (ARG RUST_VERSION / TAURI_CLI_VERSION), and the Makefile
# (client-deps) and clients/desktop/build.ps1 the same CLI version: change
# them together. Bump RUST_VERSION when the check job fails because a
# dependency raised its minimum Rust. Move the CLI when Dependabot moves the
# tauri crate to a new minor in src-tauri/Cargo.lock (the CLI holds the
# bundler; the crate the runtime). Not below 2.12: older CLIs fetch a
# linuxdeploy that bundles libwayland-client into the AppImage, which
# breaks EGL on distros with a newer Mesa (blank window on Fedora 44).
env:
  RUST_VERSION: 1.93.0
  TAURI_CLI_VERSION: 2.12.1

jobs:
  # PRs only: compile the desktop client against the committed Cargo.lock
  # with the pinned Rust. No frontend, no bundling, no artifacts.
  check:
    name: cargo check (Linux)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Linux deps
        # The -dev subset of the build job's list (no GStreamer, patchelf or
        # file: those are only for bundling). Keep the two in step.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, pinned; toolchain set below
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: clients/desktop/src-tauri

      # --locked: fail if Cargo.lock doesn't match Cargo.toml, as the
      # release builds would. Without the custom-protocol feature Tauri
      # compiles in dev mode (devUrl), so web/dist isn't needed.
      - name: cargo check --locked
        working-directory: clients/desktop/src-tauri
        run: cargo check --locked

  build:
    name: ${{ matrix.os-name }}
    # Tag pushes and manual runs; PRs get the check job above instead.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        # Git Bash on Windows, so every step reads the same on both legs.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # macOS is left out until the client compiles there: every tag build
        # through v2.4.1 failed in cpal (impl_platform_host) with
        # E0277 "(dyn FnMut() + 'static) cannot be sent between threads
        # safely". Restore a macos-latest leg (bundle/dmg/*.dmg) with that fix.
        include:
          - os: windows-latest
            os-name: Windows
            # One pattern per line: upload-artifact doesn't expand {a,b}.
            artifact-path: |
              clients/desktop/src-tauri/target/release/bundle/msi/*.msi
              clients/desktop/src-tauri/target/release/bundle/nsis/*.exe
          # Pinned (not ubuntu-latest) so the glibc floor of the .deb/.rpm/
          # .AppImage only moves on purpose, in step with the Docker recipe in
          # clients/desktop/linux-build (ubuntu:24.04).
          - os: ubuntu-24.04
            os-name: Linux
            artifact-path: |
              clients/desktop/src-tauri/target/release/bundle/deb/*.deb
              clients/desktop/src-tauri/target/release/bundle/rpm/*.rpm
              clients/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Linux deps
        if: runner.os == 'Linux'
        # Keep in lockstep with clients/desktop/linux-build/Dockerfile.
        #   webkit2gtk-4.1 / gtk3 / soup3 / rsvg  Tauri 2 webview + GLib stack
        #   ayatana-appindicator                  system tray (loaded at runtime)
        #   asound2                               cpal's ALSA backend (alsa-sys)
        #   dbus-1                                keyring's Secret Service + souvlaki's MPRIS
        #   xdo                                   Tauri's menu/shortcut stack
        #   file                                  linuxdeploy (AppImage bundling)
        #   gstreamer1.0-* + patchelf             the AppImage's GStreamer plugins
        #                                         (linux-build/stage-gst-plugins.sh)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            file \
            patchelf \
            pkg-config \
            gstreamer1.0-alsa \
            gstreamer1.0-gl \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, pinned; toolchain set below
        with:
          toolchain: ${{ env.RUST_VERSION }}

      # Cache cargo registry + the desktop client's target dir. cpal +
      # claxon + ureq + tauri together pull ~300+ crates; the cache
      # cuts cold builds from ~10 min to ~90 s on cache hits.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: clients/desktop/src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked --version "$TAURI_CLI_VERSION"

      - name: Build SvelteKit frontend
        run: |
          cd web
          npm ci --no-audit --no-fund
          npm run build

      # A v* tag stamps its version on the installers; any other ref keeps
      # tauri.conf.json's. Only the numeric X.Y.Z core is used: WiX (the MSI)
      # takes numbers only, so v2.5.0-rc1 builds 2.5.0 installers, the same
      # version (and file names) as the final v2.5.0.
      - name: Desktop version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          full=${TAG#v}
          core=${full%%[-+]*}
          if [[ ! "$core" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag $TAG has no X.Y.Z version core"
            exit 1
          fi
          # MSI ProductVersion limits: major and minor <= 255, patch <= 65535.
          if (( 10#${BASH_REMATCH[1]} > 255 || 10#${BASH_REMATCH[2]} > 255 || 10#${BASH_REMATCH[3]} > 65535 )); then
            echo "::error::$core is outside the MSI version range (255.255.65535)"
            exit 1
          fi
          core="$((10#${BASH_REMATCH[1]})).$((10#${BASH_REMATCH[2]})).$((10#${BASH_REMATCH[3]}))"
          if [[ "$core" != "$full" ]]; then
            echo "::notice::$TAG is a pre-release/build tag; its installers are versioned $core, like the final $core release's."
          fi
          # The stamp covers the installers and the .exe's version resource;
          # the Rust crate's own version (env!("CARGO_PKG_VERSION"), which
          # get_app_version reports) still comes from Cargo.toml.
          src=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' clients/desktop/src-tauri/Cargo.toml | head -n 1)
          if [[ "$src" != "$core" ]]; then
            echo "::warning::clients/desktop is at $src (Cargo.toml, tauri.conf.json); bump it to $core for this release cycle."
          fi
          echo "DESKTOP_VERSION=$core" >> "$GITHUB_ENV"
          echo "Desktop installers version: $core"

      - name: Stage GStreamer plugins for the AppImage
        if: runner.os == 'Linux'
        run: |
          bash clients/desktop/linux-build/stage-gst-plugins.sh "$RUNNER_TEMP/gst-plugins"
          echo "GSTREAMER_PLUGINS_DIR=$RUNNER_TEMP/gst-plugins" >> "$GITHUB_ENV"

      # bundle.targets is "all": MSI + NSIS on Windows, deb + rpm + AppImage
      # on Linux. --locked: build exactly what src-tauri/Cargo.lock pins.
      - name: Build Tauri bundle
        working-directory: clients/desktop/src-tauri
        env:
          # linuxdeploy (AppImage) is itself an AppImage; extract-and-run
          # avoids needing FUSE on the runner. Ignored on Windows.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          # Only this build's installers: the upload globs would also pick up
          # any older ones left in the bundle dir.
          rm -rf target/release/bundle
          if [[ -n "${DESKTOP_VERSION:-}" ]]; then
            cargo tauri build --config "{\"version\":\"$DESKTOP_VERSION\"}" -- --locked
          else
            cargo tauri build -- --locked
          fi

      # Same AppImage checks as linux-build/build-in-container.sh.
      - name: Check the AppImage
        if: runner.os == 'Linux'
        run: |
          appimage=$(ls clients/desktop/src-tauri/target/release/bundle/appimage/*.AppImage)
          cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null
          root=$RUNNER_TEMP/squashfs-root
          staged=$(find "$GSTREAMER_PLUGINS_DIR" -mindepth 1 | wc -l)
          bundled=$(find "$root/usr/lib/gstreamer-1.0" -name 'libgst*.so' | wc -l)
          echo "GStreamer plugins: $bundled bundled, $staged staged"
          if [[ "$bundled" -ne "$staged" || ! -f "$root/apprun-hooks/linuxdeploy-plugin-gstreamer.sh" ]]; then
            echo "::error::The AppImage is missing its GStreamer plugins or their AppRun hook"
            exit 1
          fi
          # Host Mesa needs the host's libwayland-client; a bundled copy
          # breaks EGL on newer distros (blank window).
          if compgen -G "$root/usr/lib/libwayland-client.so*" >/dev/null; then
            echo "::error::The AppImage bundles libwayland-client"
            exit 1
          fi

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: onscreen-desktop-${{ matrix.os-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach installers to the release
    needs: build
    # Any run on a v* tag: the tag push, or a manual run on the tag (Run
    # workflow, "Use workflow from" the tag), which rebuilds and re-attaches,
    # e.g. after the artifacts expired. A manual run on a branch keeps its
    # installers as artifacts only.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Up to 60 min waiting for release.yml, plus the upload.
    timeout-minutes: 75
    # No job-level concurrency: the workflow-level group (top of the file)
    # cancels a superseded run, builds and publish together. The tag check
    # below covers anything that slips past it.
    # The only job holding contents:write. It runs no project or dependency
    # code: it downloads the installers built above and uploads them.
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: onscreen-desktop-*
          path: artifacts

      - name: Collect installers and checksums
        run: |
          mkdir installers
          find artifacts -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.AppImage' \) -exec mv -t installers {} +
          cd installers
          sha256sum -- * > onscreen-desktop-checksums.txt
          ls -l
          cat onscreen-desktop-checksums.txt

      # release.yml owns the release: its last job creates it
      # (softprops/action-gh-release) only after the tests and the image
      # pass, ~30 min after the tag push, and these builds usually finish
      # first. So wait for that release instead of creating one, which would
      # publish a tag whose server build failed. If it never shows up,
      # fail; re-run this job once release.yml has published (the
      # artifacts are kept 14 days; after that, run the workflow on the tag).
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # These installers were built from $GITHUB_SHA. If the tag has
          # moved since (re-tagged) or is gone, they're stale: upload nothing
          # and leave the release to the run for the tag's current commit.
          check_tag() {
            local current
            if ! current=$(gh api "repos/$GH_REPO/commits/refs/tags/$TAG" --jq .sha 2>/dev/null); then
              echo "::error::Tag $TAG no longer exists; not uploading."
              exit 1
            fi
            if [[ "$current" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $TAG now points at $current, but this run built $GITHUB_SHA. Not uploading stale installers; the run for $current publishes its own."
              exit 1
            fi
          }
          check_tag
          for attempt in $(seq 1 120); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            echo "Release $TAG not published yet (check $attempt/120); waiting 30 s"
            sleep 30
          done
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::No GitHub release for $TAG after 60 min. Check the Release workflow for this tag, then re-run this job."
            exit 1
          fi
          check_tag
          # --clobber: a re-run replaces the assets instead of failing on them.
          gh release upload "$TAG" installers/* --clobber
