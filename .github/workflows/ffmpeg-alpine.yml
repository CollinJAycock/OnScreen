name: ffmpeg-alpine base image

# Publishes ghcr.io/collinjaycock/onscreen-ffmpeg-alpine: Alpine's ffmpeg
# packages rebuilt with OnScreen's Dolby Vision patch (see
# docker/ffmpeg-alpine/Dockerfile), which the standard image installs in place
# of Alpine's stock ffmpeg. Each platform builds natively on its own runner
# (ffmpeg compiled under QEMU takes hours), then one manifest joins them.
#
# Runs when the base image's inputs change on main, by hand, and as a build
# check (no push) on pull requests that touch them. A new tag also needs
# docker/Dockerfile's COPY --from pin updated to the pushed digest.

on:
  push:
    branches: [main]
    paths:
      - docker/ffmpeg-alpine/**
      - docker/patches/0005-dovi-rpu-convert-p7-to-p81.patch
      - .github/workflows/ffmpeg-alpine.yml
  pull_request:
    paths:
      - docker/ffmpeg-alpine/**
      - docker/patches/0005-dovi-rpu-convert-p7-to-p81.patch
      - .github/workflows/ffmpeg-alpine.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/collinjaycock/onscreen-ffmpeg-alpine
  # Matches docker/ffmpeg-alpine/Dockerfile's FFMPEG_PKGVER and PKGREL.
  TAG: 8.1.3-r100

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build${{ github.event_name != 'pull_request' && ' & push by digest' || '' }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/ffmpeg-alpine/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=ffmpeg-alpine-${{ matrix.arch }}
          cache-to: type=gha,scope=ffmpeg-alpine-${{ matrix.arch }},mode=max

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ github.event_name != 'pull_request' && 'multi-arch tag' || '' }}
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the ${{ env.TAG }} manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create -t "$IMAGE:$TAG" $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$TAG"
