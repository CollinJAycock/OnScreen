name: Android TV

# Fast PR gate for the Android TV client's JVM unit tests. The suite had
# silently drifted red (untested capability/Dolby-Vision changes + an
# android.util.Log call that throws in unit tests); this stops that from
# recurring. Unit tests only — no APK assembly (slow, and not needed to catch
# logic regressions). Path-filtered so it only runs when the TV client changes.
on:
  push:
    paths:
      - 'clients/android/**'
      - '.github/workflows/android-tv.yml'
  pull_request:
    paths:
      - 'clients/android/**'
      - '.github/workflows/android-tv.yml'

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v7

      # AGP 9.2 / Gradle 9.4 require JDK 17+; the module compiles to 17 bytecode.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Provides cmdline-tools + accepts SDK licenses so AGP can resolve
      # compileSdk 35 / build-tools on the runner.
      - uses: android-actions/setup-android@v3

      # Gradle dependency + build cache (keyed on the wrapper + build files).
      - uses: gradle/actions/setup-gradle@v4

      - name: Point the Gradle daemon JVM at the runner's JDK
        # The committed gradle.properties pins org.gradle.java.installations.paths
        # to the Windows Android Studio JBR (for local dev). On the Linux runner
        # that path is invalid ("Cannot convert relative path C:\... to absolute").
        # Override it in GRADLE_USER_HOME (higher precedence than the project file,
        # the per-machine escape hatch the comment in gradle.properties describes)
        # so daemon-JVM detection finds JDK 21 at JAVA_HOME (toolchainVersion=21).
        run: |
          GUH="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$GUH"
          echo "org.gradle.java.installations.paths=$JAVA_HOME" >> "$GUH/gradle.properties"

      - name: Run unit tests
        # chmod is a safety net — gradlew is committed executable (100755), but
        # this keeps CI green if the bit is ever lost on a Windows-authored commit.
        run: |
          chmod +x gradlew
          # Tests are flavor-independent (the firetv flavor only overlays a
          # manifest); run the default googletv variant's unit tests.
          ./gradlew :app:testGoogletvDebugUnitTest --no-daemon --console=plain

      - name: Run Android lint
        # This job used to run unit tests ONLY, so lint never gated the module
        # and its errors accumulated unseen — 37 UnsafeOptInUsageError plus a
        # real API-26-on-minSdk-24 crash in the Live TV guide were all sitting
        # green. Both flavors, because the firetv manifest overlay is exactly
        # the kind of thing that only breaks on its own variant.
        run: |
          ./gradlew :app:lintGoogletvRelease :app:lintFiretvRelease \
            --no-daemon --console=plain

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-tv-test-report
          path: clients/android/app/build/reports/tests/testGoogletvDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-tv-lint-report
          path: clients/android/app/build/reports/lint-results-*.*
          if-no-files-found: ignore
          retention-days: 7
