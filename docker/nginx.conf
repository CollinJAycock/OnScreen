# OnScreen HA reverse-proxy configuration
# Referenced by docker-compose.ha.yml (nginx service).
#
# Before deploying:
#   1. Replace /etc/ssl/certs/onscreen.crt and /etc/ssl/private/onscreen.key
#      with real certificate paths (or mount them via docker-compose volumes).
#   2. Adjust server_name to your actual domain.
#
# SECURITY INVARIANT - proxy_set_header inheritance:
#   nginx inherits proxy_set_header from the enclosing block ONLY when a
#   location defines none of its own. A single location-level
#   proxy_set_header (e.g. for Upgrade or Range) silently drops Host,
#   X-Real-IP, X-Forwarded-For and X-Forwarded-Proto for that location. That
#   used to happen on /api/, /media/ and /, so OnScreen saw every client as the
#   nginx container's private IP: the local-only first-run setup gate opened to
#   the internet, every per-IP rate limit collapsed into one shared bucket, and
#   auth cookies lost Secure. Therefore ALL proxy_set_header directives live at
#   server level below. Do NOT add proxy_set_header inside a location; if one
#   is ever unavoidable, repeat the complete forwarded-header set there too.
#   (The same inheritance rule applies to add_header.)

worker_processes auto;
pid            /tmp/nginx.pid;

events {
    worker_connections 2048;
    multi_accept       on;
}

http {
    # ── Basics ───────────────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    # Don't advertise the nginx version in the Server header / error pages.
    server_tokens off;

    # ── Logging ──────────────────────────────────────────────────────────────
    # Query strings are deliberately NOT logged. Streaming, artwork and
    # download URLs carry bearer credentials as `?token=<paseto>` (HLS, native
    # cross-origin clients, <img>/<video> tags that can't send headers), so the
    # stock "$request" field wrote live session tokens to access.log. Log the
    # method + path only, and strip the query from the Referer for the same
    # reason (same-origin Referers include the full URL).
    map $request_uri $request_path_noquery {
        "~^(?<p>[^?]*)" $p;
        default         "";
    }
    map $http_referer $referer_noquery {
        "~^(?<r>[^?]*)" $r;
        default         "";
    }
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $request_path_noquery $server_protocol" '
                    '$status $body_bytes_sent '
                    '"$referer_noquery" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;
    # Note: error_log lines can still include the full request line (with any
    # ?token=) when nginx itself logs an error for that request. Keep the error
    # log at "warn" or higher and treat it as sensitive.
    error_log  /var/log/nginx/error.log  warn;

    # ── Client limits ────────────────────────────────────────────────────────
    # The API caps its own bodies at 1 MB; the DB restore upload gets its own
    # larger limit in a dedicated location below.
    client_max_body_size 10m;

    # ── WebSocket upgrade map ────────────────────────────────────────────────
    # Empty Upgrade -> empty Connection, which also lets the upstream keepalive
    # pool below actually reuse connections (nginx otherwise sends "close").
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # ── Upstream: Docker DNS resolves "onscreen" to all 3 replicas ───────────
    upstream onscreen_backend {
        least_conn;
        server onscreen:7070;

        # Keep connections alive to the backend for better throughput.
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Health check available over plain HTTP so external probes (ELB, etc.)
        # don't need a TLS handshake.
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS server ─────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name _;

        # ── TLS ──────────────────────────────────────────────────────────────
        # TODO: Replace with real certificate paths or mount via compose volumes.
        ssl_certificate     /etc/ssl/certs/onscreen.crt;
        ssl_certificate_key /etc/ssl/private/onscreen.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers   ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:TLS:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # OCSP stapling requires the full certificate chain
        ssl_stapling        on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /etc/ssl/certs/onscreen.crt;  # Must include full CA chain
        resolver 127.0.0.11 valid=30s;   # Docker embedded DNS

        # ── Security headers ─────────────────────────────────────────────────
        # HSTS without includeSubDomains/preload: this is a copy-paste sample,
        # and those two commit every sibling subdomain of the operator's domain
        # to HTTPS (preload is effectively irreversible). Add them yourself only
        # if every subdomain serves valid HTTPS.
        # X-XSS-Protection is intentionally omitted: it is deprecated and the
        # old "1; mode=block" auditor enabled XS-leak side channels.
        # add_header in a location replaces ALL of these for that location, so
        # no location below uses add_header.
        add_header Strict-Transport-Security "max-age=63072000"                         always;
        add_header X-Content-Type-Options    "nosniff"                                  always;
        add_header X-Frame-Options           "SAMEORIGIN"                               always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"          always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

        # ── Common proxy settings (inherited by EVERY location below) ────────
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # nginx is the edge here, so REPLACE X-Forwarded-For with the peer it
        # actually saw instead of appending ($proxy_add_x_forwarded_for). An
        # appended list carries whatever the client sent, and a client on a
        # private network would be skipped by the server's right-to-left walk,
        # letting its forged left-hand entries pick the rate-limit/audit IP.
        # If you put ANOTHER proxy/CDN in front of this nginx, configure
        # real_ip_header / set_real_ip_from here so $remote_addr is the client.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # $host above drops the port; the server's CSRF Origin check needs the
        # host:port the browser actually addressed (a site on :8443 otherwise
        # fails it on browsers without Sec-Fetch-Site).
        proxy_set_header   X-Forwarded-Host  $http_host;
        # WebSocket / SSE upgrade support. Safe on every location: for normal
        # requests $http_upgrade is empty (header omitted) and Connection is "".
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        # Range / If-Range are forwarded by default; the backend handles byte
        # ranges itself, so no per-location Range header is needed.

        # Streaming-friendly timeouts: keep proxy connections open long enough
        # for video playback and large file transfers.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;

        # ── Health check (HTTPS side) ────────────────────────────────────────
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # ── API routes ───────────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://onscreen_backend;
        }

        # ── DB restore upload (admin only; the server caps it at 2 GiB) ───────
        # Without this, the global 10m cap silently blocked restores and pushed
        # operators toward bypassing the proxy.
        location = /api/v1/admin/restore {
            proxy_pass http://onscreen_backend;
            client_max_body_size    2g;
            proxy_request_buffering off;
            proxy_read_timeout      600s;
            proxy_send_timeout      600s;
        }

        # ── Media streaming ──────────────────────────────────────────────────
        location /media/ {
            proxy_pass http://onscreen_backend;

            # Stream the request straight through; the backend handles byte-range.
            proxy_request_buffering off;

            # Longer read timeout for active streams.
            proxy_read_timeout 600s;
        }

        # ── Artwork ──────────────────────────────────────────────────────────
        # No Cache-Control is added here. The server decides per response:
        # "public" only for art every viewer may see, "private" whenever the
        # answer depends on the caller (content-rating ceiling, private
        # library, public-art-cache toggle off). A blanket
        # "public, max-age=604800, immutable" used to override that and let a
        # shared cache/CDN replay an admin's restricted poster to anyone.
        location /artwork/ {
            proxy_pass http://onscreen_backend;
        }

        # ── SPA fallback for all other routes ────────────────────────────────
        # The Go server embeds and serves the SPA; proxy everything else to it
        # and let it handle try-files / index.html internally.
        location / {
            proxy_pass http://onscreen_backend;
        }
    }
}
